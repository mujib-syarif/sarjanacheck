name: Build apps (Android & Windows)

# Tiap push ke main yang menyentuh web/app -> build APK + installer Windows,
# lalu terbit sebagai GitHub Release "app-v1.0.<nomor run>" (app membaca release ini untuk fitur update).
# Bisa juga dijalankan manual dari tab Actions.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - clan-history.js
      - season.json
      - assets/**
      - app/**
      - .github/workflows/build-apps.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Siapkan web
        run: node app/prepare-www.mjs app/android/www "$APP_VERSION"
      - name: Buat project Android
        working-directory: app/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash make-icons.sh
          # versionCode naik terus supaya APK baru bisa menimpa yang lama
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          npx cap sync android
      - name: Pasang keystore tetap (supaya update bisa menimpa app lama)
        run: |
          mkdir -p ~/.android
          cp app/android/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: app/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rapikan nama
        run: cp app/android/android/app/build/outputs/apk/debug/app-debug.apk "SarjanaCheck-$APP_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SarjanaCheck-android
          path: SarjanaCheck-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Siapkan web
        shell: bash
        run: node app/prepare-www.mjs app/windows/www "$APP_VERSION"
      - name: Build installer
        shell: bash
        working-directory: app/windows
        run: |
          npm install --no-audit --no-fund
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SarjanaCheck-windows
          path: |
            app/windows/dist/SarjanaCheck-Setup-*.exe
            app/windows/dist/SarjanaCheck-Setup-*.exe.blockmap
            app/windows/dist/latest.yml

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: SarjanaCheck v${{ env.APP_VERSION }}
          body: |
            Build otomatis dari commit ${{ github.sha }}.
            - Android: pasang `SarjanaCheck-${{ env.APP_VERSION }}.apk`
            - Windows: jalankan `SarjanaCheck-Setup-${{ env.APP_VERSION }}.exe`
          files: |
            out/*.apk
            out/*.exe
            out/*.exe.blockmap
            out/latest.yml
          make_latest: true
