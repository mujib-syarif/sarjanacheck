<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Sarjana Checker</title>

  <meta
    name="description"
    content="Clash of Clans Player, Clan & CWL Analyzer"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

<style>

:root{
  --bg:#edf3fb;
  --card:#fff;
  --card2:#e7effb;
  --text:#10233f;
  --muted:#52677f;
  --line:#b9c9dc;
  --accent:#123b83;
  --accent2:#0d5dc0;
  --gold:#c69a3a;
  --green:#087950;
  --red:#bb1d36;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    linear-gradient(
      180deg,
      #dce8f8 0,
      #f6f9fd 36rem
    );
  color:var(--text);
  font:
    14px/1.45
    "Plus Jakarta Sans",
    system-ui,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,1400px);
  margin:auto;
  padding:22px 16px 32px;
}

/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;

  margin:4px 0 20px;
  padding:10px 14px 12px;

  border:
    1px solid
    rgba(18,59,131,.18);

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.97),
      rgba(235,243,253,.92)
    );

  box-shadow:
    0 8px 24px
    rgba(24,57,99,.09);

  overflow:hidden;
}

.header:after{
  content:"";

  position:absolute;

  left:14px;
  right:14px;
  bottom:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold) 20%,
      var(--accent) 50%,
      var(--gold) 80%,
      transparent
    );
}

.logo{
  position:relative;
  z-index:1;

  width:52px;
  height:52px;

  object-fit:contain;

  border-radius:13px;

  filter:
    drop-shadow(
      0 4px 7px
      rgba(18,59,131,.16)
    );
}

.brand{
  min-width:0;
}

.brand-title{
  position:relative;
  z-index:1;

  font-size:21px;
  font-weight:800;

  letter-spacing:-.4px;

  background:
    linear-gradient(
      90deg,
      #102f68,
      #123b83 55%,
      #8b6a2b
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.brand-sub{
  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-panel{
  border:
    1px solid
    var(--line);

  background:
    var(--card);

  border-radius:16px;

  box-shadow:
    0 5px 16px
    rgba(24,57,99,.08);

  padding:14px;

  margin-bottom:18px;
}

.switch{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  margin-bottom:10px;
}

.switch button{
  min-height:38px;

  border:
    1px solid
    var(--line);

  border-radius:10px;

  background:
    var(--card2);

  color:var(--text);

  font-weight:800;
}

.switch button.active{
  background:var(--accent);

  border-color:
    var(--accent);

  color:#fff;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
  min-width:0;

  color:var(--text);

  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:10px;

  padding:
    10px 12px;

  outline:none;
}

.search-row input:focus{
  border-color:
    var(--accent2);

  box-shadow:
    0 0 0 3px
    rgba(13,93,192,.10);
}

.search-btn{
  border:
    1px solid
    var(--accent);

  border-radius:10px;

  background:
    var(--accent);

  color:#fff;

  padding:
    8px 18px;

  font-weight:800;
}

.search-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.hint{
  margin:
    8px 2px 0;

  color:var(--muted);

  font-size:11px;
}

/* =====================================================
   PAGE
===================================================== */

.page{
  display:none;
}

.page.active{
  display:block;
}

.loading,
.error-box,
.empty{
  padding:20px;

  color:var(--muted);

  text-align:center;
}

.loading{
  border:
    1px solid
    var(--line);

  border-radius:14px;

  background:#fff;

  font-weight:800;
}

.error-box{
  color:#7b1021;

  border:
    1px solid
    #e0aab4;

  border-radius:14px;

  background:#fff1f3;
}

/* =====================================================
   GENERAL CARD
===================================================== */

.section,
.clan-header{
  border:
    1px solid
    var(--line);

  background:
    var(--card);

  border-radius:16px;

  box-shadow:
    0 5px 16px
    rgba(24,57,99,.08);

  padding:15px;

  margin-bottom:12px;
}

.section-head{
  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:10px;

  margin-bottom:12px;
}

.section-title{
  font-size:15px;

  font-weight:800;
}

.section-value{
  color:var(--accent2);

  font-size:12px;

  font-weight:700;
}

/* =====================================================
   PLAYER
===================================================== */

.player-profile{
  padding:17px;

  border:
    1px solid
    var(--line);

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #edf5ff
    );

  box-shadow:
    0 5px 16px
    rgba(24,57,99,.08);

  margin-bottom:12px;
}

.player-name-row{
  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:9px;
}

.player-name{
  font-size:22px;

  font-weight:800;

  overflow-wrap:anywhere;
}

.player-tag{
  color:var(--muted);

  font-size:11px;

  margin-top:3px;
}

.xp-bubble{
  display:inline-grid;

  place-items:center;

  min-width:44px;
  min-height:28px;

  padding:
    3px 8px;

  border-radius:999px;

  background:#d8eaff;

  border:
    1px solid
    #96bde8;

  color:#073c84;

  font-size:11px;

  font-weight:800;
}

.player-clan-link{
  display:flex;

  align-items:center;

  gap:10px;

  width:max-content;

  max-width:100%;

  margin-top:13px;

  padding:
    8px 10px;

  border:
    1px solid
    #9eb9d9;

  border-radius:11px;

  background:#edf5ff;

  color:#0b4d9f;

  font-weight:800;

  text-align:left;
}

.player-clan-link:hover{
  border-color:
    var(--accent2);
}

.clan-badge{
  width:44px;
  height:44px;

  object-fit:contain;

  flex:0 0 auto;
}

.player-clan-copy{
  min-width:0;
}

.player-clan-copy strong{
  display:block;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.player-clan-copy span{
  display:block;

  color:var(--muted);

  font-size:11px;

  font-weight:600;
}

/* =====================================================
   SUMMARY
===================================================== */

.summary{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.meta{
  padding:9px;

  border-radius:10px;

  background:#eaf1fb;

  color:var(--muted);

  font-size:10px;
}

.meta strong{
  display:block;

  color:var(--text);

  font-size:14px;

  margin-top:2px;
}

/* =====================================================
   HERO
===================================================== */

.hero-group{
  margin-bottom:11px;
}

.hero-group-title{
  display:flex;

  align-items:center;

  gap:7px;

  margin:
    0 0 7px;

  padding:
    6px 9px;

  border-left:
    3px solid
    var(--gold);

  border-radius:7px;

  background:#edf4fc;

  font-size:11px;

  font-weight:800;
}

.hero-group-title span{
  color:var(--muted);

  font-size:9px;

  font-weight:600;
}

.hero-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.hero-card{
  display:flex;

  align-items:center;

  gap:10px;

  min-width:0;

  padding:10px;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  background:#f8fbff;
}

.hero-img{
  width:58px;
  height:58px;

  object-fit:contain;

  flex:0 0 auto;
}

.hero-copy{
  min-width:0;
}

.item-name{
  font-weight:800;

  overflow-wrap:anywhere;
}

.item-detail{
  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}

.progress{
  height:6px;

  margin-top:7px;

  border-radius:10px;

  overflow:hidden;

  background:#d9e5f5;
}

.progress-fill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      #2386da
    );
}

/* =====================================================
   EQUIPMENT
===================================================== */

.equipment-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.equipment-card{
  display:flex;

  align-items:center;

  gap:9px;

  min-width:0;

  padding:9px;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  background:#f8fbff;
}

.equipment-img{
  width:44px;
  height:44px;

  object-fit:contain;

  flex:0 0 auto;
}

.epic{
  color:#8a4cbb;

  font-size:9px;

  font-weight:800;

  margin-top:2px;
}

/* =====================================================
   CLAN
===================================================== */

.clan-name{
  font-size:22px;

  font-weight:800;

  overflow-wrap:anywhere;
}

.clan-tag{
  color:var(--muted);

  font-size:12px;
}

.clan-description{
  color:var(--muted);

  margin-top:8px;
}

.clan-meta{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:14px;
}

/* =====================================================
   MEMBERS
===================================================== */

.member-list{
  display:grid;

  gap:7px;
}

.member{
  width:100%;

  display:flex;

  align-items:center;

  gap:10px;

  text-align:left;

  color:var(--text);

  background:#f8fbff;

  border:
    1px solid
    var(--line);

  border-radius:11px;

  padding:10px;
}

.member:hover{
  border-color:
    var(--accent);
}

.member-rank{
  color:var(--accent2);

  font-weight:800;

  width:24px;

  flex:0 0 auto;
}

.member-info{
  flex:1;

  min-width:0;
}

.member-name{
  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-weight:800;
}

.member-detail{
  color:var(--muted);

  font-size:11px;
}

.member-th{
  color:var(--accent2);

  font-size:12px;

  font-weight:800;
}

/* =====================================================
   CWL
===================================================== */

.cwl-clan-link{
  appearance:none;

  padding:0;

  border:0;

  background:transparent;

  color:var(--accent2);

  text-align:left;

  font:inherit;

  font-weight:800;
}

.cwl-clan-link:hover{
  text-decoration:underline;
}

.th-breakdown{
  display:grid;

  gap:8px;
}

.th-row{
  display:grid;

  grid-template-columns:
    43px 1fr 28px;

  align-items:center;

  gap:9px;

  font-size:12px;
}

.th-label,
.th-count{
  font-weight:800;
}

.th-bar{
  height:9px;

  overflow:hidden;

  border-radius:8px;

  background:#d9e5f5;
}

.th-bar-fill{
  height:100%;

  min-width:2px;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      #2386da
    );
}

.table-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--line);

  border-radius:12px;
}

.clan-th-table{
  width:100%;

  min-width:720px;

  border-collapse:collapse;

  background:#fff;
}

.clan-th-table th,
.clan-th-table td{
  padding:
    6px 4px;

  border-bottom:
    1px solid
    #d5e0ed;

  text-align:center;
}

.clan-th-table th{
  background:#123b83;

  color:#fff;

  font-size:10px;

  white-space:nowrap;
}

.clan-th-table th:first-child{
  width:210px;

  text-align:left;
}

.clan-th-table td{
  color:#152c4c;

  font-weight:700;
}

.clan-th-table tbody tr:nth-child(even){
  background:#f1f6fc;
}

.clan-th-table tbody tr.selected{
  background:#e0edff;
}

.clan-cell{
  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;
}

.clan-cell-badge{
  width:34px;
  height:34px;

  object-fit:contain;

  flex:0 0 auto;
}

/* =====================================================
   CWL ROUNDS
===================================================== */

.round{
  padding:13px;

  margin:8px 0;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  background:#f8fbff;
}

.round-head{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.round-title{
  font-weight:800;
}

.round-status{
  color:var(--muted);

  font-size:11px;
}

.war{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:10px;
}

.war-side{
  width:
    calc(50% - 24px);
}

.war-side.right{
  text-align:right;
}

.war-name{
  font-weight:800;

  overflow-wrap:anywhere;
}

.war-score{
  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}

.vs{
  color:var(--accent2);

  font-size:11px;

  font-weight:800;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
  color:#52677f;

  margin:
    22px 0 0;

  text-align:center;

  font-size:11px;

  line-height:1.7;
}

.footer a{
  color:var(--accent2);

  text-decoration:none;

  font-weight:800;
}

.footer a:hover{
  text-decoration:underline;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .app{
    padding:
      14px 10px 26px;
  }

  .header{
    margin-bottom:12px;

    padding:
      8px 10px 10px;
  }

  .logo{
    width:44px;
    height:44px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-sub{
    font-size:9px;
  }

  .search-panel{
    padding:10px;

    margin-bottom:12px;
  }

  .switch{
    gap:5px;
  }

  .switch button{
    font-size:10px;

    min-height:34px;
  }

  .search-row{
    gap:6px;
  }

  .search-btn{
    padding:
      8px 13px;

    font-size:11px;
  }

  .summary{
    grid-template-columns:
      repeat(2,1fr);
  }

  .clan-meta{
    grid-template-columns:
      repeat(3,1fr);
  }

  .hero-grid,
  .equipment-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .hero-card{
    padding:7px;

    gap:6px;
  }

  .hero-img{
    width:46px;
    height:46px;
  }

  .equipment-card{
    padding:7px;

    gap:6px;
  }

  .equipment-img{
    width:38px;
    height:38px;
  }

  .item-name{
    font-size:11px;
  }

  .item-detail{
    font-size:9px;
  }

  .section{
    padding:11px;
  }

  .section-title{
    font-size:13px;
  }

  .clan-header{
    padding:13px;
  }

  .clan-name{
    font-size:18px;
  }

  .player-profile{
    padding:13px;
  }

  .player-name{
    font-size:19px;
  }

}

@media(min-width:1000px){

  .app{
    padding:
      32px 24px 40px;
  }

  .header{
    padding:
      12px 17px 14px;
  }

  .logo{
    width:60px;
    height:60px;
  }

  .brand-title{
    font-size:25px;
  }

  .brand-sub{
    font-size:12px;
  }

  .section,
  .clan-header,
  .search-panel{
    padding:18px;
  }

  .hero-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .equipment-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

</style>
</head>


<body>

<div class="app">

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <img
      class="logo"
      src="assets/logo/og-thumbnail.png"
      alt="Sarjana Checker"
    >

    <div class="brand">

      <div class="brand-title">
        Sarjana Checker
      </div>

      <div class="brand-sub">
        Clash of Clans Account Analyzer
      </div>

    </div>

  </header>


  <!-- ===================================================
       SEARCH
  ==================================================== -->

  <section class="search-panel">

    <div class="switch">

      <button
        id="playerTab"
        class="active"
        onclick="setMode('player')"
      >
        PLAYER
      </button>

      <button
        id="clanTab"
        onclick="setMode('clan')"
      >
        CLAN
      </button>

      <button
        id="cwlTab"
        onclick="setMode('cwl')"
      >
        CWL
      </button>

    </div>


    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        placeholder="Masukkan Player Tag"
      >

      <button
        id="searchBtn"
        class="search-btn"
        onclick="searchData()"
      >
        CHECK
      </button>

    </div>


    <div
      class="hint"
      id="searchHint"
    >
      Contoh: #9UG9LJV8Y
    </div>

  </section>


  <!-- ===================================================
       PLAYER PAGE
  ==================================================== -->

  <main
    id="playerPage"
    class="page active"
  ></main>


  <!-- ===================================================
       CLAN PAGE
  ==================================================== -->

  <main
    id="clanPage"
    class="page"
  ></main>


  <!-- ===================================================
       CWL PAGE
  ==================================================== -->

  <main
    id="cwlPage"
    class="page"
  ></main>


  <!-- ===================================================
       FOOTER
  ==================================================== -->

  <footer class="footer">

    <div>
      Sarjana Checker · Clash of Clans Analyzer
    </div>

    <div>
      Custom Base Nama:
      <a
        href="https://mujib-syarif.basenama.workers.dev"
        target="_blank"
        rel="noopener noreferrer"
      >
        BaseNama
      </a>
    </div>

    <div>
      TikTok:
      <a
        href="https://tiktok.com/@mujib_syarif"
        target="_blank"
        rel="noopener noreferrer"
      >
        @mujib_syarif
      </a>
    </div>

  </footer>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
  "https://sarjana-checker-api.basenama.workers.dev";


let mode = "player";

let currentPlayer = null;
let currentClan = null;
let currentCwl = null;


/* =====================================================
   ASSETS
===================================================== */

const HERO_ASSETS = {

  "barbarian king":
    "assets/heroes/AnimeFury_BK_01 .png",

  "archer queen":
    "assets/heroes/AnimeFury_AQ_01.png",

  "grand warden":
    "assets/heroes/AnimeFury_GW_01.png",

  "royal champion":
    "assets/heroes/AnimeFury_RC_02.png",

  "minion prince":
    "assets/heroes/AnimeFury_MP_01.png",

  "dragon duke":
    "assets/heroes/DD_AnimeFury.png",

  "battle machine":
    "assets/heroes/Hero_Skin_BM_Battle_Machine_of_the_North_3_shadow.png",

  "battle copter":
    "assets/heroes/BattleCopter_Boat_Pose03_NoShadow.png"

};


const EQUIPMENT_ASSETS = {

  "barbarian puppet":
    "assets/equipment/Hero_Equipment_BK_Barbarian_Puppet.png",

  "rage vial":
    "assets/equipment/Hero_Equipment_BK_Rage_Vial.png",

  "earthquake boots":
    "assets/equipment/Hero_Equipment_BK_Earthquake_Boots.png",

  "vampstache":

/* =====================================================
   BASIC HELPERS
===================================================== */

function firstValue(){

  for(
    const value of arguments
  ){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      return value;

    }

  }

  return null;

}


function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function formatNumber(value){

  return Number(value || 0)
    .toLocaleString("id-ID");

}


function cleanTag(value){

  return String(value || "")
    .trim()
    .toUpperCase();

}


function clanTag(clan){

  return cleanTag(
    firstValue(
      clan &&
        clan.tag,
      clan &&
        clan.clanTag
    )
  );

}


function asArray(value){

  return Array.isArray(value)
    ? value
    : [];

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function encodePath(value){

  return encodeURI(
    String(value || "")
  );

}


/* =====================================================
   API
===================================================== */

async function api(
  endpoint,
  tag
){

  const url =
    API_BASE +
    "/" +
    endpoint +
    "?tag=" +
    encodeURIComponent(
      cleanTag(tag)
    );

  const response =
    await fetch(url);

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      "API error"
    );

  }

  return data;

}

/* =====================================================
   SEARCH
===================================================== */

async function searchData(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const tag =
    cleanTag(
      input.value
    );

  if(!tag){

    return;

  }


  setLoading();


  try{

    if(mode === "player"){

      const data =
        await api(
          "player",
          tag
        );

      currentPlayer =
        data.player ||
        data;

      renderPlayer(
        currentPlayer
      );

    }

    else if(mode === "clan"){

      const data =
        await api(
          "clan",
          tag
        );

      currentClan =
        data.clan ||
        data;

      renderClan(
        currentClan
      );

    }

    else{

      const data =
        await api(
          "cwl",
          tag
        );

      currentCwl =
        normalizeCwl(
          data
        );

      renderCwl(
        currentCwl
      );

    }

  }

  catch(error){

    setError(
      error.message
    );

  }

  finally{

    document.getElementById(
      "searchBtn"
    ).disabled = false;

  }

}

/* =====================================================
   IMAGE
===================================================== */

function localImage(
  path,
  className,
  alt
){

  if(!path){

    return `
      <div class="asset-placeholder">
        IMG
      </div>
    `;

  }

  return `
    <img
      class="${className}"
      src="${encodePath(path)}"
      alt="${escapeHTML(alt || "")}"
      onerror="
        this.style.display='none';
        this.nextElementSibling.hidden=false;
      "
    >

    <div
      class="asset-placeholder"
      hidden
    >
      IMG
    </div>
  `;

}


function badgeImage(
  clan,
  small = false
){

  const urls =
    clan &&
    clan.badgeUrls;

  const url =
    firstValue(
      urls &&
        urls.small,
      urls &&
        urls.medium,
      urls &&
        urls.large
    );

  if(!url){

    return `
      <div
        class="clan-cell-badge"
      ></div>
    `;

  }

  return `
    <img
      class="clan-cell-badge"
      src="${escapeHTML(url)}"
      alt="Clan"
    >
  `;

}

/* =====================================================
   HERO CARD
===================================================== */

function renderHero(
  hero,
  maxTable
){

  const name =
    firstValue(
      hero.name,
      "-"
    );

  const key =
    String(
      name
    )
    .toLowerCase()
    .trim();


  const level =
    number(
      hero.level
    );


  let max =
    number(
      firstValue(
        hero.maxLevel,
        hero.maxLevelForTownHall
      )
    );


  if(!max){

    max =
      number(
        maxTable[key]
      );

  }


  const percent =
    max > 0
      ? Math.min(
          100,
          level / max * 100
        )
      : 0;


  return `

    <div
      class="hero-card"
    >

      ${localImage(
        heroAsset(name),
        "hero-img",
        name
      )}

      <div
        class="hero-copy"
      >

        <div
          class="item-name"
        >
          ${escapeHTML(name)}
        </div>

        <div
          class="item-detail"
        >
          Level
          ${level}/${max || "?"}
        </div>

        <div
          class="progress"
        >

          <div
            class="progress-fill"
            style="
              width:${percent}%
            "
          ></div>

        </div>

      </div>

    </div>

  `;

}

function renderEquipment(
  item,
  th
){

  const name =
    firstValue(
      item.name,
      "-"
    );


  const key =
    String(
      name
    )
    .toLowerCase()
    .trim();


  const level =
    number(
      item.level
    );


  let max =
    number(
      firstValue(
        item.maxLevel,
        item.maxLevelForTownHall
      )
    );


  if(!max){

    const caps =
      EQUIPMENT_CAPS[th] ||
      {
        common:18,
        epic:27
      };


    max =
      EPIC_EQUIPMENT.has(key)
        ? caps.epic
        : caps.common;

  }


  const percent =
    max > 0
      ? Math.min(
          100,
          level / max * 100
        )
      : 0;


  return `

    <div
      class="equipment-card"
    >

      ${localImage(
        equipmentAsset(name),
        "equipment-img",
        name
      )}

      <div
        class="hero-copy"
      >

        <div
          class="item-name"
        >
          ${escapeHTML(name)}
        </div>

        <div
          class="item-detail"
        >
          ${level}/${max}
        </div>

        ${
          EPIC_EQUIPMENT.has(key)
            ? `
              <div class="epic">
                EPIC
              </div>
            `
            : ""
        }

        <div
          class="progress"
        >

          <div
            class="progress-fill"
            style="
              width:${percent}%
            "
          ></div>

        </div>

      </div>

    </div>

  `;

}

/* =====================================================
   MEMBER
===================================================== */

function roleOrder(
  role
){

  const value =
    String(
      role || ""
    ).toLowerCase();


  if(value === "leader"){
    return 1;
  }

  if(
    value === "coleader" ||
    value === "co-leader"
  ){
    return 2;
  }

  if(
    value === "admin" ||
    value === "elder"
  ){
    return 3;
  }

  return 4;

}


function sortMembers(
  a,
  b
){

  const roleA =
    roleOrder(
      a.role
    );

  const roleB =
    roleOrder(
      b.role
    );


  if(roleA !== roleB){

    return roleA -
      roleB;

  }


  return (
    number(
      a.clanRank
    ) ||
    999
  ) -
  (
    number(
      b.clanRank
    ) ||
    999
  );

}


function roleName(
  role
){

  const value =
    String(
      role || ""
    ).toLowerCase();


  if(value === "leader"){
    return "Leader";
  }

  if(
    value === "coleader" ||
    value === "co-leader"
  ){
    return "Co-Leader";
  }

  if(
    value === "admin" ||
    value === "elder"
  ){
    return "Elder";
  }

  return "Member";

}

){

/* =====================================================
   TOWN HALL BREAKDOWN
===================================================== */

function townHallBreakdown(
  members
){

  const result = {};

  for(
    let i=1;
    i<=18;
    i++
  ){

    result[i] = 0;

  }


  asArray(
    members
  ).forEach(
    member => {

      const th =
        number(
          firstValue(
            member.townHallLevel,
            member.townhallLevel,
            member.townHall
          )
        );

      if(
        th >= 1 &&
        th <= 18
      ){

        result[th]++;

      }

    }
  );


  return result;

}


function renderBreakdown(
  source
){

  const entries = [];

  for(
    let th=18;
    th>=1;
    th--
  ){

    const count =
      number(
        source &&
        source[th]
      );

    if(count > 0){

      entries.push({
        th,
        count
      });

    }

  }


  if(!entries.length){

    return `
      <div class="empty">
        Data Town Hall belum tersedia.
      </div>
    `;

  }


  const max =
    Math.max(
      ...entries.map(
        item =>
          item.count
      )
    );


  return entries
    .map(
      item => `

        <div
          class="th-row"
        >

          <div
            class="th-label"
          >
            TH${item.th}
          </div>

          <div
            class="th-bar"
          >

            <div
              class="th-bar-fill"
              style="
                width:${
                  Math.round(
                    item.count /
                    max *
                    100
                  )
                }%
              "
            ></div>

          </div>

          <div
            class="th-count"
          >
            ${item.count}
          </div>

        </div>

      `
    )
    .join("");

}


/* =====================================================
   CWL NORMALIZE
===================================================== */

function normalizeCwl(
  data
){

  const root =
    data &&
    data.cwl
      ? data.cwl
      : data;


  return {

    ...root,

    tag:
      firstValue(
        root.tag,
        root.clanTag,
        root.currentClan &&
          root.currentClan.tag
      ),

    cwlRoster:
      asArray(
        firstValue(
          root.cwlRoster,
          root.currentClan &&
            root.currentClan.cwlRoster
        )
      ),

    cwlRosterSize:
      number(
        firstValue(
          root.cwlRosterSize,
          root.currentClan &&
            root.currentClan.cwlRosterSize
        )
      ),

    rounds:
      asArray(
        root.rounds
      ),

    clans:
      asArray(
        root.clans
      ),

    currentClan:
      root.currentClan ||
      null,

    cwlTownHallBreakdown:
      root.cwlTownHallBreakdown ||
      root.townHallBreakdown ||
      {}

  };

}


/* =====================================================
   CWL ROSTER
===================================================== */

function cwlRosterFor(
  data,
  selectedClan
){

  if(
    asArray(
      data.cwlRoster
    ).length
  ){

    return asArray(
      data.cwlRoster
    );

  }


  if(
    selectedClan &&
    asArray(
      selectedClan.cwlRoster
    ).length
  ){

    return asArray(
      selectedClan.cwlRoster
    );

  }


  return [];

}


/* =====================================================
   CWL SELECTED CLAN
===================================================== */

function cwlClanFor(
  data,
  tag
){

  const wanted =
    cleanTag(tag);


  const direct =
    asArray(
      data.clans
    ).find(
      clan =>
        clanTag(clan) ===
        wanted
    );


  if(direct){

    return direct;

  }


  if(
    data.currentClan &&
    clanTag(
      data.currentClan
    ) === wanted
  ){

    return data.currentClan;

  }


  return null;

}


/* =====================================================
   CWL BREAKDOWN
===================================================== */

function cwlBreakdownFor(
  data,
  selectedClan,
  roster
){

  const direct =
    data.cwlTownHallBreakdown ||
    data.townHallBreakdown ||
    {};


  const directEntries =
    Object.keys(
      direct
    )
    .map(
      key => ({
        th:
          number(
            key
          ),

        count:
          number(
            direct[key]
          )
      })
    )
    .filter(
      item =>
        item.th > 0 &&
        item.count > 0
    );


  if(
    directEntries.length
  ){

    return directEntries
      .sort(
        (a,b) =>
          b.th - a.th
      );

  }


  /*
   * PENTING:
   * kalau API sedang preparation
   * dan breakdown masih 0,
   * hitung langsung dari cwlRoster.
   */

  const derived = {};

  asArray(
    roster
  ).forEach(
    member => {

      const th =
        number(
          firstValue(
            member.townHallLevel,
            member.townhallLevel,
            member.townHall
          )
        );

      if(th > 0){

        derived[th] =
          (
            derived[th] ||
            0
          ) + 1;

      }

    }
  );


  return Object.keys(
    derived
  )
  .map(
    th => ({
      th:number(th),
      count:
        derived[th]
    })
  )
  .sort(
    (a,b) =>
      b.th - a.th
  );

}

/* =====================================================
   CWL ROUND
===================================================== */

function warIncludesClan(
  war,
  tag
){

  if(!war){
    return false;
  }

  const wanted =
    cleanTag(tag);


  if(
    clanTag(
      war.target
    ) === wanted
  ){

    return true;

  }


  if(
    clanTag(
      war.enemy
    ) === wanted
  ){

    return true;

  }


  return asArray(
    war.clans
  )
  .some(
    side =>
      clanTag(side) ===
      wanted
  );

}


function warForRound(
  round,
  tag
){

  return asArray(
    round.wars
  )
  .find(
    war =>
      warIncludesClan(
        war,
        tag
      )
  ) || null;

}


function sidesForWar(
  war,
  tag
){

  const wanted =
    cleanTag(tag);


  if(
    war.target &&
    war.enemy
  ){

    if(
      clanTag(
        war.target
      ) === wanted
    ){

      return {
        mine:war.target,
        enemy:war.enemy
      };

    }


    if(
      clanTag(
        war.enemy
      ) === wanted
    ){

      return {
        mine:war.enemy,
        enemy:war.target
      };

    }

  }


  return null;

}


function scoreFor(
  side
){

  if(!side){

    return "-";

  }


  return (
    formatNumber(
      firstValue(
        side.stars,
        0
      )
    ) +
    " ★ · " +
    formatNumber(
      firstValue(
        side.destructionPercentage,
        0
      )
    ) +
    "%"
  );

}


function renderCwlRound(
  round,
  index,
  selectedTag
){

  const numberRound =
    number(
      firstValue(
        round.roundNumber,
        index
      )
    ) || index;


  const war =
    warForRound(
      round,
      selectedTag
    );


  if(!war){

    return `

      <div
        class="round"
      >

        <div
          class="round-head"
        >

          <div
            class="round-title"
          >
            Round ${numberRound}
          </div>

          <div
            class="round-status"
          >
            Belum tersedia
          </div>

        </div>

      </div>

    `;

  }


  const sides =
    sidesForWar(
      war,
      selectedTag
    );


  if(!sides){

    return `

      <div
        class="round"
      >

        <div
          class="round-head"
        >

          <div
            class="round-title"
          >
            Round ${numberRound}
          </div>

          <div
            class="round-status"
          >
            Data war tidak cocok
          </div>

        </div>

      </div>

    `;

  }


  return `

    <div
      class="round"
    >

      <div
        class="round-head"
      >

        <div
          class="round-title"
        >
          Round ${numberRound}
        </div>

        <div
          class="round-status"
        >
          ${escapeHTML(
            firstValue(
              war.state,
              "War"
            )
          )}
        </div>

      </div>


      <div
        class="war"
      >

        <div
          class="war-side"
        >

          <div
            class="war-name"
          >
            ${escapeHTML(
              firstValue(
                sides.mine.name,
                "-"
              )
            )}
          </div>

          <div
            class="war-score"
          >
            ${scoreFor(
              sides.mine
            )}
          </div>

        </div>


        <div
          class="vs"
        >
          VS
        </div>


        <div
          class="war-side right"
        >

          <div
            class="war-name"
          >
            ${escapeHTML(
              firstValue(
                sides.enemy.name,
                "-"
              )
            )}
          </div>

          <div
            class="war-score"
          >
            ${scoreFor(
              sides.enemy
            )}
          </div>

        </div>

      </div>

    </div>

  `;

}
