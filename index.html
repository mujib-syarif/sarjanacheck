<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sarjana Checker</title>
  <meta name="description" content="Clash of Clans Player, Clan & CWL Analyzer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07090d;
      --panel: #0f141c;
      --panel2: #141b25;
      --card: #0b1017;
      --border: #232c39;

      --text: #f4f7fb;
      --muted: #8c97a8;

      --purple: #7c5cff;
      --purple2: #a78bfa;

      --green: #35d07f;
      --yellow: #f5c451;
      --blue: #45a7ff;
      --red: #ff6577;
      --orange: #ff9d3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(124, 92, 255, .18),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 980px;
      margin: auto;
      padding: 25px 16px 60px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
      border-radius: 18px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-panel {
      background:
        linear-gradient(145deg, #121923, #0c1118);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: #080b10;
      padding: 4px;
      border-radius: 11px;
      margin-bottom: 14px;
    }

    .switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 5px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .switch button.active {
      background: var(--purple);
      color: white;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      background: #090d13;
      color: white;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 11px;
      padding: 13px;
      font-size: 13px;
    }

    .search-row input:focus {
      border-color: var(--purple);
    }

    .search-btn {
      border: 0;
      border-radius: 11px;
      padding: 0 20px;
      background: var(--purple);
      color: white;
      font-weight: 800;
      font-size: 12px;
    }

    .search-btn:active {
      transform: scale(.97);
    }

    .hint {
      color: var(--muted);
      font-size: 10px;
      margin-top: 8px;
    }

    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================================================
       PROFILE
    ========================================================= */

    .profile {
      background:
        linear-gradient(145deg, #151c27, #0d1219);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .profile-top {
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .profile-top::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -110px;
      top: -110px;
      background: rgba(124, 92, 255, .16);
      filter: blur(45px);
      border-radius: 50%;
    }

    .player-name {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .player-tag {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .clan-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      color: #c4b5fd;
      background: rgba(124, 92, 255, .09);
      border: 1px solid rgba(124, 92, 255, .2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .clan-link span {
      color: var(--muted);
      font-weight: 500;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
    }

    .stat {
      padding: 14px 10px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 9px;
      margin-top: 4px;
    }

    /* =========================================================
       SECTION
    ========================================================= */

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
    }

    .section-value {
      color: var(--purple2);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================================================
       PROGRESS
    ========================================================= */

    .progress-main {
      height: 9px;
      background: #080b10;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--purple),
        var(--purple2)
      );
      border-radius: inherit;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      min-height: 92px;
    }

    .hero-card-top {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .hero-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .hero-name {
      color: var(--muted);
      font-size: 10px;
    }

    .hero-level {
      font-size: 17px;
      font-weight: 800;
      margin-top: 3px;
    }

    .hero-max {
      color: var(--green);
      font-size: 9px;
      margin-top: 2px;
    }

    .hero-builder {
      color: var(--orange);
    }

    /* =========================================================
       EQUIPMENT
    ========================================================= */

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .equipment-card {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px;
      min-width: 0;
    }

    .equipment-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .equipment-info {
      min-width: 0;
    }

    .equipment-name {
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .equipment-level {
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px;
    }

    .equipment-rarity {
      color: var(--purple2);
      font-size: 8px;
      font-weight: 800;
      margin-top: 2px;
    }

    /* =========================================================
       GENERIC CARD
    ========================================================= */

    .info-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px;
      margin-top: 8px;
    }

    .info-name {
      font-size: 11px;
      font-weight: 700;
    }

    .info-desc {
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px;
    }

    .info-value {
      font-size: 11px;
      font-weight: 800;
      color: var(--purple2);
      white-space: nowrap;
    }

    /* =========================================================
       CLAN
    ========================================================= */

    .clan-header {
      background:
        linear-gradient(145deg, #151c27, #0d1219);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .clan-name {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .clan-tag {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .clan-description {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
      margin-top: 13px;
    }

    .clan-meta {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .meta {
      background: #0b0f15;
      border: 1px solid var(--border);
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 9px;
      color: var(--muted);
    }

    .meta strong {
      color: white;
    }

    /* =========================================================
       MEMBER
    ========================================================= */

    .member {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px;
      margin-bottom: 7px;
      color: white;
      text-align: left;
    }

    .member:hover {
      border-color: rgba(124, 92, 255, .55);
    }

    .member-rank {
      width: 28px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      font-size: 11px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-detail {
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px;
    }

    .member-th {
      color: var(--purple2);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .role-leader {
      color: var(--yellow);
    }

    .role-coleader {
      color: var(--purple2);
    }

    .role-elder {
      color: var(--blue);
    }

    /* =========================================================
       CWL
    ========================================================= */

    .cwl-round {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
    }

    .cwl-round-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .cwl-round-title {
      font-size: 11px;
      font-weight: 800;
    }

    .cwl-round-status {
      color: var(--muted);
      font-size: 9px;
    }

    .war-side {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .war-clan {
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #080d13;
    }

    .war-clan-name {
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .war-clan-score {
      color: var(--purple2);
      font-size: 9px;
      margin-top: 3px;
    }

    .war-vs {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    /* =========================================================
       TH BREAKDOWN
    ========================================================= */

    .th-breakdown {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .th-row {
      display: grid;
      grid-template-columns: 48px 1fr 38px;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: #090e14;
    }

    .th-label {
      font-size: 10px;
      font-weight: 800;
    }

    .th-bar {
      height: 7px;
      background: #05080c;
      border-radius: 99px;
      overflow: hidden;
    }

    .th-bar-fill {
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--purple),
        var(--purple2)
      );
      border-radius: inherit;
    }

    .th-count {
      color: var(--muted);
      font-size: 9px;
      text-align: right;
      font-weight: 700;
    }

    .cwl-clan-link {
      border: 0;
      background: transparent;
      color: var(--purple2);
      font-weight: 800;
      padding: 0;
      text-align: left;
      font-size: inherit;
    }

    /* =========================================================
       LOADING / ERROR
    ========================================================= */

    .loading {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #242b37;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      background: rgba(255, 101, 119, .07);
      border: 1px solid rgba(255, 101, 119, .25);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .error-title {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
    }

    .error-message {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      margin-top: 5px;
      word-break: break-word;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      text-align: center;
      color: #505a69;
      font-size: 9px;
      margin-top: 28px;
      line-height: 1.7;
    }

    .footer a {
      color: var(--purple2);
      text-decoration: none;
      font-weight: 700;
    }

    /* =========================================================
       DESKTOP
    ========================================================= */

    @media (min-width: 700px) {
      .app {
        padding-top: 40px;
      }

      .hero-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .equipment-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .member {
        padding: 13px;
      }

      .section {
        padding: 19px;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand-title {
        font-size: 24px;
      }

      .equipment-grid {
        grid-template-columns: 1fr;
      }

      .war-side {
        grid-template-columns: 1fr;
      }

      .war-vs {
        text-align: center;
      }
    }
  </style>
</head>

  <!-- =======================================================

</div>

/* ============================================================
   UTILITIES
============================================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function number(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return 0;
  }

  return n;

}


function formatNumber(value) {

  return number(value).toLocaleString("en-US");

}


function cleanTag(value) {

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if (
    tag &&
    !tag.startsWith("#")
  ) {
    tag = "#" + tag;
  }

  return tag;

}


function encodedTag(value) {

  return encodeURIComponent(
    cleanTag(value)
  );

}


function nameKey(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}


function firstValue(...values) {

  for (const value of values) {

    if (
      value !== undefined &&
      value !== null &&
      value !== ""
    ) {
      return value;
    }

  }

  return null;

}


/* ============================================================
   API
============================================================ */

async function api(endpoint, tag) {

  const url =
    `${API_BASE}/${endpoint}?tag=${encodedTag(tag)}`;

  const response = await fetch(
    url,
    {
      method: "GET",
      headers: {
        "Accept": "application/json"
      },
      cache: "no-store"
    }
  );

  const text =
    await response.text();

  let body;

  try {

    body =
      JSON.parse(text);

  } catch {

    throw new Error(
      `Response API bukan JSON. HTTP ${response.status}`
    );

  }


  if (!response.ok) {

    throw new Error(
      body?.message ||
      body?.reason ||
      body?.error ||
      body?.details?.message ||
      `HTTP ${response.status}`
    );

  }


  /*
   * Worker bisa mengembalikan:
   *
   * {
   *   data: {...}
   * }
   *
   * atau:
   *
   * {
   *   result: {...}
   * }
   *
   * atau langsung object.
   */

  let data = body;


  if (
    data &&
    typeof data === "object" &&
    !Array.isArray(data)
  ) {

    if (
      data.data &&
      typeof data.data === "object"
    ) {
      data = data.data;
    }

    else if (
      data.result &&
      typeof data.result === "object"
    ) {
      data = data.result;
    }

    else if (
      endpoint === "player" &&
      data.player &&
      typeof data.player === "object"
    ) {
      data = data.player;
    }

    else if (
      endpoint === "clan" &&
      data.clan &&
      typeof data.clan === "object"
    ) {
      data = data.clan;
    }

  }


  return data;

}

/* ============================================================
   NORMALIZE PLAYER
============================================================ */

function normalizePlayer(raw) {

  const player =
    raw || {};


  const heroesRaw =
    Array.isArray(player.heroes)
      ? player.heroes
      : [];


  const heroEquipmentRaw =
    Array.isArray(player.heroEquipment)
      ? player.heroEquipment
      : [];


  const heroes =
    heroesRaw.map(hero => {

      const heroName =
        firstValue(
          hero.name,
          hero.heroName
        ) || "Hero";


      let max =
        firstValue(
          hero.maxLevel,
          hero.max,
          hero.max_level
        );


      const th =
        number(
          firstValue(
            player.townHallLevel,
            player.townhallLevel,
            player.townHall
          )
        );


      const builder =
        nameKey(heroName) === "battle machine" ||
        nameKey(heroName) === "battle copter";


      if (!max) {

        if (builder) {

          const bh =
            number(
              firstValue(
                player.builderHallLevel,
                player.builderBaseLevel,
                player.builderHall
              )
            );

          max =
            BUILDER_MAX[bh]?.[heroName] || 0;

        }

        else {

          max =
            HOME_MAX[th]?.[heroName] || 0;

        }

      }


      return {

        ...hero,

        name: heroName,

        level:
          number(
            firstValue(
              hero.level,
              hero.currentLevel
            )
          ),

        maxLevel:
          number(max),

        equipment:
          Array.isArray(hero.equipment)
            ? hero.equipment
            : []

      };

    });


  let equipment =
    heroEquipmentRaw;


  if (!equipment.length) {

    equipment =
      heroes.flatMap(hero => {

        return (hero.equipment || [])
          .map(item => ({
            ...item,
            hero: firstValue(
              item.hero,
              hero.name
            )
          }));

      });

  }


  const clanRaw =
    player.clan || null;


  const clan =
    clanRaw
      ? {
          ...clanRaw,

          tag:
            firstValue(
              clanRaw.tag,
              clanRaw.clanTag
            ),

          name:
            firstValue(
              clanRaw.name,
              clanRaw.clanName
            ),

          clanLevel:
            firstValue(
              clanRaw.clanLevel,
              clanRaw.level
            )
        }
      : null;


  return {

    ...player,

    tag:
      firstValue(
        player.tag,
        player.playerTag
      ),

    name:
      firstValue(
        player.name,
        player.playerName
      ) || "-",

    townHallLevel:
      number(
        firstValue(
          player.townHallLevel,
          player.townhallLevel,
          player.townHall
        )
      ),

    expLevel:
      number(
        firstValue(
          player.expLevel,
          player.xp,
          player.experienceLevel
        )
      ),

    trophies:
      number(
        firstValue(
          player.trophies,
          player.trophy
        )
      ),

    bestTrophies:
      number(
        firstValue(
          player.bestTrophies,
          player.best_trophies
        )
      ),

    warStars:
      number(
        firstValue(
          player.warStars,
          player.war_stars
        )
      ),

    attackWins:
      number(
        firstValue(
          player.attackWins,
          player.attack_wins
        )
      ),

    defenseWins:
      number(
        firstValue(
          player.defenseWins,
          player.defense_wins
        )
      ),

    clan,

    heroes,

    heroEquipment:
      equipment

  };

}


/* ============================================================
   HERO PROGRESS
============================================================ */

function calculateHeroProgress(player) {

  const heroes =
    player.heroes || [];


  if (!heroes.length) {

    return {
      percent: 0,
      current: 0,
      max: 0
    };

  }


  let current = 0;
  let max = 0;


  for (const hero of heroes) {

    current +=
      number(hero.level);

    max +=
      number(hero.maxLevel);

  }


  if (!max) {

    return {
      percent: 0,
      current,
      max
    };

  }


  return {

    percent:
      Math.round(
        Math.min(
          current / max,
          1
        ) * 100
      ),

    current,
    max

  };

}

/* ============================================================
   EQUIPMENT RENDER
============================================================ */

function renderEquipmentCard(item, player) {

  const name =
    firstValue(
      item.name,
      item.equipmentName
    ) || "Equipment";


  const key =
    nameKey(name);


  const image =
    EQUIPMENT_ASSETS[key];


  const epic =
    EPIC_EQUIPMENT.has(key);


  let max =
    number(
      firstValue(
        item.maxLevel,
        item.max
      )
    );


  if (!max) {

    const th =
      number(player.townHallLevel);


    const caps =
      EQUIPMENT_MAX[th];


    if (caps) {

      max =
        epic
          ? caps.epic
          : caps.common;

    }

  }


  return `

    <div class="equipment-card">

      ${
        image
          ? `
            <img
              class="equipment-img"
              src="${image}"
              alt="${escapeHTML(name)}"
              loading="lazy"
            >
          `
          : ""
      }

      <div class="equipment-info">

        <div class="equipment-name">
          ${escapeHTML(name)}
        </div>

        <div class="equipment-level">

          Level
          ${escapeHTML(
            firstValue(
              item.level,
              item.currentLevel
            ) || "-"
          )}

          /

          ${escapeHTML(max || "-")}

        </div>

        <div class="equipment-rarity">

          ${epic ? "EPIC" : "COMMON"}

        </div>

      </div>

    </div>

  `;

}

      await api("clan", tag);

    const clan =
      normalizeClan(raw);

    currentClan =
      clan;

    renderClan(clan);

  }

  catch (error) {

    setError(
      error?.message ||
      "Unknown error"
    );

  }

}


/* ============================================================
   NORMALIZE CLAN
============================================================ */

function normalizeClan(raw) {

  const clan =
    raw || {};


  let members =
    Array.isArray(clan.memberList)
      ? clan.memberList
      : [];


  if (!members.length) {

    if (
      Array.isArray(clan.membersList)
    ) {
      members =
        clan.membersList;
    }

  }


  if (!members.length) {

    if (
      Array.isArray(clan.members)
    ) {
      members =
        clan.members;
    }

  }


  members =
    members.map(member => ({

      ...member,

      tag:
        firstValue(
          member.tag,
          member.playerTag
        ),

      name:
        firstValue(
          member.name,
          member.playerName
        ) || "-",

      townHallLevel:
        number(
          firstValue(
            member.townHallLevel,
            member.townhallLevel,
            member.townHall
          )
        ),

      trophies:
        number(
          firstValue(
            member.trophies,
            member.trophy
          )
        ),

      clanRank:
        number(
          firstValue(
            member.clanRank,
            member.rank
          )
        ),

      role:
        firstValue(
          member.role,
          member.roleName
        ) || "Member"

    }));


  const memberCount =
    number(
      firstValue(
        clan.members,
        clan.memberCount
      )
    );


  return {

    ...clan,

    tag:
      firstValue(
        clan.tag,
        clan.clanTag
      ),

    name:
      firstValue(
        clan.name,
        clan.clanName
      ) || "-",

    clanLevel:
      firstValue(
        clan.clanLevel,
        clan.level
      ),

    members:
      memberCount,

    memberList:
      members,

    description:
      firstValue(
        clan.description,
        clan.desc
      ) || "",

    type:
      firstValue(
        clan.type,
        clan.clanType
      ) || "-"

  };

}


/* ============================================================
   ROLE ORDER
============================================================ */

function roleOrder(role) {

  const key =
    String(role || "")
      .toLowerCase()
      .replace(/\s/g, "");


  if (key === "leader") {
    return 1;
  }

  if (
    key === "coleader" ||
    key === "coleader"
  ) {
    return 2;
  }

  if (
    key === "admin" ||
    key === "elder"
  ) {
    return 3;
  }

  return 4;

}


function roleName(role) {

  const key =
    String(role || "")
      .toLowerCase()
      .replace(/\s/g, "");


  if (key === "leader") {
    return "Leader";
  }

  if (
    key === "coleader" ||
    key === "coleader"
  ) {
    return "Co-Leader";
  }

  if (
    key === "admin" ||
    key === "elder"
  ) {
    return "Elder";
  }

  return "Member";

}


/* ============================================================
   CLAN RENDER
============================================================ */

function renderClan(clan) {

  const members =
    [...(clan.memberList || [])];


  /*
   * Leader
   * Co-Leader
   * Elder
   * Member
   *
   * lalu rank.
   */

  members.sort((a, b) => {

    const roleDiff =
      roleOrder(a.role) -
      roleOrder(b.role);


    if (roleDiff !== 0) {
      return roleDiff;
    }


    return (
      number(a.clanRank) -
      number(b.clanRank)
    );

  });


  const membersHTML =
    members.length

      ? members.map((member, index) => {

          const role =
            roleName(member.role);


          const roleClass =
            role === "Leader"
              ? "role-leader"
              : role === "Co-Leader"
                ? "role-coleader"
                : role === "Elder"
                  ? "role-elder"
                  : "";


          return `

            <button
              class="member"
              onclick="loadPlayer('${escapeHTML(member.tag)}')"
            >

              <div class="member-rank">

                ${String(index + 1)
                  .padStart(2, "0")}

              </div>


              <div class="member-info">

                <div class="member-name">

                  ${escapeHTML(member.name)}

                </div>


                <div class="member-detail">

                  ${formatNumber(member.trophies)}
                  trophies

                  ·

                  <span class="${roleClass}">
                    ${escapeHTML(role)}
                  </span>

                </div>

              </div>


              <div class="member-th">

                TH${escapeHTML(
                  member.townHallLevel || "-"
                )}

              </div>

            </button>

          `;

        }).join("")

      : `

        <div class="info-card">

          <div>

            <div class="info-name">
              Member tidak tersedia.
            </div>

          </div>

        </div>

      `;


  document
    .getElementById("clanContent")
    .innerHTML = `

      <div class="clan-header">

        <div class="clan-name">

          ${escapeHTML(clan.name)}

        </div>


        <div class="clan-tag">

          ${escapeHTML(clan.tag)}

        </div>


        ${
          clan.description
            ? `
              <div class="clan-description">
                ${escapeHTML(
                  clan.description
                )}
              </div>
            `
            : ""
        }


        <div class="clan-meta">

          <div class="meta">

            Member

            <strong>

              ${formatNumber(
                clan.members
              )}/50

            </strong>

          </div>


          <div class="meta">

            Level

            <strong>

              ${escapeHTML(
                clan.clanLevel ?? "-"
              )}

            </strong>

          </div>


          <div class="meta">

            Type

            <strong>

              ${escapeHTML(
                clan.type
              )}

            </strong>

          </div>

        </div>

      </div>


      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Clan Members
          </div>

          <div class="section-value">

            ${members.length}/50

          </div>

        </div>


        ${membersHTML}

      </section>

    `;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ============================================================
   CWL
============================================================ */

async function loadCwl(tag) {

  mode = "cwl";

  showPage("cwl");

  setLoading();


  try {

    const raw =
      await api("cwl", tag);


    currentCwl =
      normalizeCwl(raw);


    renderCwl(
      currentCwl
    );

  }

  catch (error) {

    setError(
      error?.message ||
      "Unknown error"
    );

  }

}


/* ============================================================
   NORMALIZE CWL
============================================================ */

function normalizeCwl(raw) {

  const data =
    raw || {};


  return {

    ...data,

    currentClan:
      data.currentClan ||
      data.clan ||
      null,

    clans:
      Array.isArray(data.clans)
        ? data.clans
        : [],

    rounds:
      Array.isArray(data.rounds)
        ? data.rounds
        : [],

    cwlRoster:
      Array.isArray(data.cwlRoster)
        ? data.cwlRoster
        : [],

    cwlRosterSize:
      number(
        data.cwlRosterSize
      ),

    cwlRosterSourceRound:
      data.cwlRosterSourceRound ||
      null,

    cwlTownHallBreakdown:
      data.cwlTownHallBreakdown ||
      null

  };

}


/* ============================================================
   CWL TH BREAKDOWN NORMALIZER
============================================================ */

function getBreakdownEntries(clan) {

  if (!clan) {
    return [];
  }


  let breakdown =
    clan.townHallBreakdown ||
    clan.cwlTownHallBreakdown ||
    clan.thBreakdown ||
    null;


  if (!breakdown) {
    return [];
  }


  if (Array.isArray(breakdown)) {

    return breakdown.map(item => ({

      th:
        number(
          firstValue(
            item.townHallLevel,
            item.townhallLevel,
            item.th,
            item.level
          )
        ),

      count:
        number(
          firstValue(
            item.count,
            item.total,
            item.members
          )
        )

    }));

  }


  if (
    typeof breakdown === "object"
  ) {

    return Object.entries(
      breakdown
    ).map(([th, count]) => ({

      th:
        number(
          String(th)
            .replace(/\D/g, "")
        ),

      count:
        number(
          typeof count === "object"
            ? firstValue(
                count.count,
                count.total,
                count.members
              )
            : count
        )

    }));

  }


  return [];

}


/* ============================================================
   CWL CLAN LOOKUP
============================================================ */

function findCwlClan(tag) {

  const clean =
    cleanTag(tag);


  const clans =
    currentCwl?.clans || [];


  return clans.find(
    clan =>
      cleanTag(
        firstValue(
          clan.tag,
          clan.clanTag
        )
      ) === clean
  ) || null;

}


/* ============================================================
   OPEN CLAN FROM CWL
============================================================ */

function openClanFromCwl(tag) {

  if (!tag) {
    return;
  }


  loadClan(tag);

}


/* ============================================================
   CWL RENDER
============================================================ */

function renderCwl(data) {

  const targetClan =
    data.currentClan ||
    findCwlClan(
      data.currentClan?.tag
    );


  const rounds =
    data.rounds || [];


  const clanTag =
    firstValue(
      data.currentClan?.tag,
      targetClan?.tag
    );


  const clan =
    findCwlClan(clanTag) ||
    targetClan;


  const breakdown =
    getBreakdownEntries(
      clan
    );


  const maxCount =
    Math.max(
      1,
      ...breakdown.map(
        x => number(x.count)
      )
    );


  const breakdownSorted =
    breakdown
      .filter(
        x => x.th >= 1
      )
      .sort(
        (a, b) => b.th - a.th
      );


  const breakdownHTML =
    breakdownSorted.length

      ? breakdownSorted
          .map(item => `

            <div class="th-row">

              <div class="th-label">

                TH${escapeHTML(item.th)}

              </div>


              <div class="th-bar">

                <div
                  class="th-bar-fill"
                  style="
                    width:${
                      Math.round(
                        number(item.count) /
                        maxCount *
                        100
                      )
                    }%
                  "
                ></div>

              </div>


              <div class="th-count">

                ${formatNumber(
                  item.count
                )}

              </div>

            </div>

          `)
          .join("")

      : `

        <div class="info-card">

          <div>

            <div class="info-name">

              Data TH CWL belum tersedia

            </div>

            <div class="info-desc">

              Menunggu roster CWL dari API.

            </div>

          </div>

        </div>

      `;


  const roundsHTML =
    rounds.length

      ? rounds
          .slice(0, 7)
          .map(
            (round, index) =>
              renderCwlRound(
                round,
                index + 1,
                clanTag
              )
          )
          .join("")

      : `

        <div class="info-card">

          <div>

            <div class="info-name">
              Data ronde CWL belum tersedia
            </div>

          </div>

        </div>

      `;


  document
    .getElementById("cwlContent")
    .innerHTML = `

      <!-- CURRENT CLAN -->

      <div class="clan-header">

        ${
          clan
            ? `

              <button
                class="cwl-clan-link"
                onclick="
                  openClanFromCwl(
                    '${escapeHTML(clan.tag)}'
                  )
                "
              >

                <div class="clan-name">

                  ${escapeHTML(
                    clan.name || "-"
                  )}

                </div>

              </button>

            `
            : `

              <div class="clan-name">
                CWL
              </div>

            `
        }


        <div class="clan-tag">

          ${escapeHTML(
            clanTag || "-"
          )}

        </div>


        <div class="clan-meta">

          <div class="meta">

            CWL Rounds

            <strong>
              7
            </strong>

          </div>


          <div class="meta">

            CWL Roster

            <strong>

              ${formatNumber(
                firstValue(
                  clan?.cwlRosterSize,
                  data.cwlRosterSize
                )
              )}

            </strong>

          </div>

        </div>

      </div>


      <!-- TH BREAKDOWN -->

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Town Hall Breakdown
          </div>

          ${
            clan
              ? `
                <button
                  class="cwl-clan-link"
                  onclick="
                    openClanFromCwl(
                      '${escapeHTML(clan.tag)}'
                    )
                  "
                >
                  ${escapeHTML(
                    clan.name || "Clan"
                  )}
                </button>
              `
              : ""
          }

        </div>


        <div class="th-breakdown">

          ${breakdownHTML}

        </div>

      </section>


      <!-- ROUNDS -->

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            CWL Battle Rounds
          </div>

          <div class="section-value">
            7 Rounds
          </div>

        </div>


        ${roundsHTML}

      </section>

    `;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ============================================================
   CWL ROUND RENDER
============================================================ */

function renderCwlRound(
  round,
  numberRound,
  selectedTag
) {

  const wars =
    Array.isArray(round.wars)
      ? round.wars
      : Array.isArray(round.matches)
        ? round.matches
        : [];


  let war =
    null;


  const wanted =
    cleanTag(selectedTag);


  for (const candidate of wars) {

    const sides =
      candidate.clans ||
      candidate.sides ||
      [];


    const found =
      sides.find(
        clan =>
          cleanTag(
            firstValue(
              clan.tag,
              clan.clanTag
            )
          ) === wanted
      );


    if (found) {

      war =
        candidate;

      break;

    }

  }


  if (!war && wars.length) {

    war =
      wars[0];

  }


  if (!war) {

    return `

      <div class="cwl-round">

        <div class="cwl-round-head">

          <div class="cwl-round-title">

            Round ${numberRound}

          </div>

          <div class="cwl-round-status">
            Belum tersedia
          </div>

        </div>

      </div>

    `;

  }


  const sides =
    war.clans ||
    war.sides ||
    [];


  const clanA =
    sides[0] || {};


  const clanB =
    sides[1] || {};


  return `

    <div class="cwl-round">

      <div class="cwl-round-head">

        <div class="cwl-round-title">

          Round ${numberRound}

        </div>

        <div class="cwl-round-status">

          ${
            firstValue(
              war.state,
              war.status
            ) || "War"
          }

        </div>

      </div>


      <div class="war-side">

        <div class="war-clan">

          <div class="war-clan-name">

            ${escapeHTML(
              firstValue(
                clanA.name,
                clanA.clanName
              ) || "-"
            )}

          </div>

          <div class="war-clan-score">

            ${formatNumber(
              firstValue(
                clanA.stars,
                clanA.starCount,
                clanA.clanStars
              )
            )}

            ★

            ·

            ${formatNumber(
              firstValue(
                clanA.destructionPercentage,
                clanA.destruction
              )
            )}%

          </div>

        </div>


        <div class="war-vs">
          VS
        </div>


        <div class="war-clan">

          <div class="war-clan-name">

            ${escapeHTML(
              firstValue(
                clanB.name,
                clanB.clanName
              ) || "-"
            )}

          </div>

          <div class="war-clan-score">

            ${formatNumber(
              firstValue(
                clanB.stars,
                clanB.starCount,
                clanB.clanStars
              )
            )}

            ★

            ·

            ${formatNumber(
              firstValue(
                clanB.destructionPercentage,
                clanB.destruction
              )
            )}%

          </div>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   ENTER KEY
============================================================ */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        searchData();

      }

    }
  );


/* ============================================================
   INITIAL
============================================================ */

setMode("player");

</script>
