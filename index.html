<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sarjana Checker</title>
  <meta
    name="description"
    content="Sarjana Checker - Clash of Clans Player, Clan & CWL Analyzer"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #080b10;
      --panel: #10151d;
      --panel2: #151b25;
      --panel3: #0b0f15;
      --border: #242c38;

      --text: #f4f7fb;
      --muted: #8d98a8;

      --accent: #7c5cff;
      --accent2: #a78bfa;

      --orange: #ff9f43;
      --green: #35d07f;
      --yellow: #f5c451;
      --red: #ff6577;
      --blue: #45a7ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(124, 92, 255, .18),
          transparent 38%
        ),
        var(--bg);
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 1180px;
      margin: auto;
      padding: 28px 20px 60px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header-logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-panel {
      padding: 18px;
      margin-bottom: 20px;

      background:
        linear-gradient(
          145deg,
          #121821,
          #0d1118
        );

      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;

      padding: 4px;
      margin-bottom: 14px;

      background: #090c11;
      border-radius: 11px;
    }

    .switch button {
      padding: 11px 8px;

      border: 0;
      border-radius: 8px;

      color: var(--muted);
      background: transparent;

      font-size: 12px;
      font-weight: 800;
    }

    .switch button.active {
      color: white;
      background: var(--accent);
    }

    .search-row {
      display: flex;
      gap: 9px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;

      padding: 13px 14px;

      color: white;
      background: #090d13;

      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;

      font-size: 13px;
    }

    .search-row input:focus {
      border-color: var(--accent);
    }

    .search-btn {
      min-width: 125px;

      padding: 0 18px;

      color: white;
      background: var(--accent);

      border: 0;
      border-radius: 11px;

      font-size: 12px;
      font-weight: 800;
    }

    .search-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .hint {
      margin-top: 8px;

      color: var(--muted);
      font-size: 10px;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      display: none;

      padding: 18px;
      margin-bottom: 14px;

      color: var(--accent2);
      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 15px;

      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .loading.show {
      display: block;
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error {
      display: none;

      padding: 14px;
      margin-bottom: 14px;

      color: #ff9eaa;
      background: rgba(255, 101, 119, .08);

      border: 1px solid rgba(255, 101, 119, .25);
      border-radius: 14px;

      font-size: 12px;
      line-height: 1.6;
    }

    .error.show {
      display: block;
    }

    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================================================
       COMMON
    ========================================================= */

    .section {
      padding: 18px;
      margin-bottom: 16px;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 17px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
    }

    .section-value {
      color: var(--accent2);
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      padding: 22px;

      color: var(--muted);
      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 12px;

      text-align: center;
      font-size: 12px;
    }

    /* =========================================================
       PLAYER HEADER
    ========================================================= */

    .profile {
      overflow: hidden;

      margin-bottom: 16px;

      background:
        linear-gradient(
          145deg,
          #141a23,
          #0e131a
        );

      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .profile-top {
      position: relative;

      display: flex;
      align-items: center;
      gap: 16px;

      padding: 22px;
    }

    .profile-top::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      right: -100px;
      top: -110px;

      background: rgba(124, 92, 255, .15);

      filter: blur(45px);
      border-radius: 50%;

      pointer-events: none;
    }

    .player-avatar {
      width: 68px;
      height: 68px;

      display: grid;
      place-items: center;

      flex-shrink: 0;

      color: var(--accent2);
      background: rgba(124, 92, 255, .10);

      border: 1px solid rgba(124, 92, 255, .25);
      border-radius: 18px;

      font-size: 30px;
    }

    .player-main {
      min-width: 0;
      flex: 1;
    }

    .player-name-row {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .player-name {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .xp {
      flex-shrink: 0;

      color: var(--orange);

      font-size: 11px;
      font-weight: 800;
    }

    .player-tag {
      margin-top: 4px;

      color: var(--muted);
      font-size: 11px;
    }

    .clan-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      margin-top: 12px;
      padding: 7px 10px;

      color: #c4b5fd;
      background: rgba(124, 92, 255, .09);

      border: 1px solid rgba(124, 92, 255, .20);
      border-radius: 8px;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .clan-link:hover {
      background: rgba(124, 92, 255, .16);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      border-top: 1px solid var(--border);
    }

    .stat {
      padding: 15px 10px;

      text-align: center;

      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 3px;

      color: var(--muted);
      font-size: 9px;
    }

    /* =========================================================
       PLAYER LAYOUT
    ========================================================= */

    .player-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
      gap: 16px;
    }

    /* =========================================================
       PROGRESS
    ========================================================= */

    .progress-main {
      height: 9px;

      overflow: hidden;

      margin-bottom: 8px;

      background: #080b10;
      border-radius: 99px;
    }

    .progress-fill {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--accent2)
        );

      border-radius: inherit;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;

      color: var(--muted);
      font-size: 10px;
    }

    .category {
      margin-top: 16px;
    }

    .category-top {
      display: flex;
      justify-content: space-between;

      margin-bottom: 6px;

      font-size: 11px;
    }

    .category-top span:last-child {
      color: var(--muted);
      font-weight: 800;
    }

    .bar {
      height: 6px;

      overflow: hidden;

      background: #080b10;
      border-radius: 99px;
    }

    .bar > div {
      height: 100%;
      border-radius: inherit;
    }

    .hero-bar {
      background: var(--blue);
    }

    .equipment-bar {
      background: var(--accent);
    }

    /* =========================================================
       HEROES
    ========================================================= */

    .hero-group-title {
      margin: 18px 0 9px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .hero-group-title:first-child {
      margin-top: 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .hero-card {
      position: relative;

      min-height: 100px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 11px;

      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .hero-image {
      width: 62px;
      height: 62px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .hero-image.placeholder {
      display: grid;
      place-items: center;

      color: var(--muted);
      background: #10151d;

      border-radius: 10px;

      font-size: 22px;
    }

    .hero-info {
      min-width: 0;
    }

    .hero-name {
      color: var(--muted);

      font-size: 10px;
      line-height: 1.35;
    }

    .hero-level {
      margin-top: 4px;

      font-size: 18px;
      font-weight: 800;
    }

    .hero-max {
      margin-top: 2px;

      color: var(--green);
      font-size: 9px;
      font-weight: 700;
    }

    .hero-max.not-max {
      color: var(--muted);
    }

    /* =========================================================
       EQUIPMENT
    ========================================================= */

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .equipment-card {
      min-width: 0;

      padding: 10px;

      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .equipment-image {
      width: 54px;
      height: 54px;

      display: block;

      margin: 0 auto 7px;

      object-fit: contain;
    }

    .equipment-name {
      min-height: 27px;

      overflow: hidden;

      color: #dfe4eb;

      font-size: 9px;
      line-height: 1.35;

      text-align: center;
    }

    .equipment-level {
      margin-top: 5px;

      font-size: 11px;
      font-weight: 800;

      text-align: center;
    }

    .equipment-level span {
      color: var(--muted);
      font-weight: 600;
    }

    .equipment-progress {
      height: 4px;

      overflow: hidden;

      margin-top: 6px;

      background: #080b10;
      border-radius: 99px;
    }

    .equipment-progress > div {
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
    }

    .equipment-card.maxed .equipment-progress > div {
      background: var(--green);
    }

    .equipment-card.maxed .equipment-level {
      color: var(--green);
    }

    /* =========================================================
       CLAN
    ========================================================= */

    .clan-header {
      padding: 22px;
      margin-bottom: 16px;

      background:
        linear-gradient(
          145deg,
          #141a23,
          #0e131a
        );

      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .clan-title-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .clan-icon {
      width: 58px;
      height: 58px;

      display: grid;
      place-items: center;

      flex-shrink: 0;

      color: var(--accent2);
      background: rgba(124, 92, 255, .10);

      border: 1px solid rgba(124, 92, 255, .20);
      border-radius: 15px;

      font-size: 26px;
    }

    .clan-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .clan-tag {
      margin-top: 4px;

      color: var(--muted);
      font-size: 11px;
    }

    .clan-description {
      margin-top: 14px;

      color: #b5becb;
      font-size: 11px;
      line-height: 1.6;
    }

    .clan-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 14px;
    }

    .meta {
      padding: 8px 10px;

      color: var(--muted);
      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 8px;

      font-size: 10px;
    }

    .meta strong {
      color: white;
    }

    /* =========================================================
       SORT
    ========================================================= */

    .sort-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      margin-bottom: 13px;
    }

    .sort-btn {
      padding: 7px 10px;

      color: var(--muted);
      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 8px;

      font-size: 9px;
      font-weight: 800;
    }

    .sort-btn.active {
      color: white;
      background: rgba(124, 92, 255, .16);
      border-color: rgba(124, 92, 255, .45);
    }

    /* =========================================================
       MEMBER
    ========================================================= */

    .member {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 11px;
      margin-bottom: 7px;

      color: white;
      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 11px;

      text-align: left;
    }

    .member:hover {
      border-color: rgba(124, 92, 255, .5);
      background: #0e131a;
    }

    .member-rank {
      width: 28px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;
      text-align: center;

      flex-shrink: 0;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 11px;
      font-weight: 800;
    }

    .member-detail {
      margin-top: 3px;

      color: var(--muted);

      font-size: 9px;
    }

    .member-role {
      margin-top: 3px;

      color: var(--accent2);

      font-size: 8px;
      font-weight: 800;
    }

    .member-th {
      flex-shrink: 0;

      color: var(--accent2);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================================================
       CWL
    ========================================================= */

    .cwl-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;

      margin-bottom: 16px;
    }

    .cwl-stat {
      padding: 15px;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 13px;

      text-align: center;
    }

    .cwl-stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    .cwl-stat-label {
      margin-top: 3px;

      color: var(--muted);
      font-size: 9px;
    }

    /* =========================================================
       CWL TH TABLE
    ========================================================= */

    .th-table-wrap {
      overflow-x: auto;

      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .th-table {
      width: 100%;
      min-width: 700px;

      border-collapse: collapse;
    }

    .th-table th,
    .th-table td {
      padding: 10px 8px;

      border-bottom: 1px solid var(--border);

      font-size: 9px;
      text-align: center;
      white-space: nowrap;
    }

    .th-table th {
      color: var(--muted);
      background: #0b0f15;

      font-size: 8px;
    }

    .th-table tr:last-child td {
      border-bottom: 0;
    }

    .th-table td:first-child,
    .th-table th:first-child {
      text-align: left;
    }

    .cwl-clan-link {
      color: #c4b5fd;
      font-weight: 800;
      cursor: pointer;
    }

    .cwl-clan-link:hover {
      color: white;
      text-decoration: underline;
    }

    .th-number {
      color: var(--muted);
    }

    .th-number.has {
      color: white;
      font-weight: 800;
    }

    /* =========================================================
       CWL ROUNDS
    ========================================================= */

    .round-list {
      display: grid;
      gap: 10px;
    }

    .round-card {
      padding: 13px;

      background: var(--panel3);

      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .round-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;
      margin-bottom: 10px;
    }

    .round-title {
      font-size: 12px;
      font-weight: 800;
    }

    .round-state {
      color: var(--accent2);
      font-size: 9px;
      font-weight: 800;
    }

    .war-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }

    .war-side {
      min-width: 0;

      padding: 10px;

      background: #080b10;

      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .war-side-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #dfe4eb;

      font-size: 10px;
      font-weight: 800;
    }

    .war-side-score {
      margin-top: 4px;

      font-size: 18px;
      font-weight: 800;
    }

    .war-side-detail {
      margin-top: 3px;

      color: var(--muted);
      font-size: 8px;
    }

    .war-vs {
      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      margin-top: 28px;

      color: #505a69;

      text-align: center;
      font-size: 9px;
      line-height: 1.7;
    }

    .footer a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 800;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* =========================================================
       DESKTOP
    ========================================================= */

    @media (min-width: 800px) {
      .app {
        padding-top: 38px;
      }

      .equipment-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .hero-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .hero-card {
        min-height: 110px;
      }

      .hero-image {
        width: 68px;
        height: 68px;
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 650px) {
      .app {
        padding: 18px 12px 45px;
      }

      .header {
        gap: 11px;
      }

      .header-logo {
        width: 50px;
        height: 50px;
      }

      .brand-title {
        font-size: 22px;
      }

      .brand-sub {
        font-size: 9px;
      }

      .search-panel {
        padding: 13px;
      }

      .search-row {
        gap: 7px;
      }

      .search-btn {
        min-width: 90px;
        padding: 0 10px;
      }

      .player-grid {
        grid-template-columns: 1fr;
      }

      .profile-top {
        padding: 16px;
      }

      .player-avatar {
        width: 54px;
        height: 54px;
        font-size: 24px;
      }

      .player-name {
        font-size: 20px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat {
        padding: 12px 5px;
      }

      .stat-value {
        font-size: 13px;
      }

      .stat-label {
        font-size: 7px;
      }

      .section {
        padding: 14px;
      }

      .hero-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .equipment-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .equipment-card {
        padding: 7px;
      }

      .equipment-image {
        width: 46px;
        height: 46px;
      }

      .clan-header {
        padding: 16px;
      }

      .clan-name {
        font-size: 19px;
      }

      .cwl-summary {
        gap: 6px;
      }

      .cwl-stat {
        padding: 11px 5px;
      }

      .cwl-stat-value {
        font-size: 16px;
      }

      .war-grid {
        grid-template-columns: 1fr auto 1fr;
      }

      /*
        Biar jarak nama clan → TH Breakdown
        nggak kelewat renggang di mobile.
      */
      .cwl-clan-section {
        padding-top: 12px;
      }
    }

    @media (max-width: 430px) {
      .equipment-grid {
        grid-template-columns: repeat(3, 1fr);
      }

/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function number(value) {

  const n = Number(value);

  return Number.isFinite(n) ? n : 0;
}


function formatNumber(value) {

  return number(value).toLocaleString("id-ID");
}


function normalizeName(value) {

  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


function normalizeTag(value) {

  let tag = String(value ?? "")
    .trim()
    .toUpperCase();

  if (!tag) {
    return "";
  }

  if (!tag.startsWith("#")) {
    tag = "#" + tag;
  }

  return tag;
}


function encodedTag(tag) {

  return encodeURIComponent(normalizeTag(tag));
}


function roleName(member) {

  const role =
    String(
      member?.roleName ??
      member?.role ??
      ""
    )
      .trim()
      .toLowerCase();

  if (role === "leader") {
    return "Leader";
  }

  if (
    role === "coleader" ||
    role === "co-leader" ||
    role === "co_leader"
  ) {
    return "Co-Leader";
  }

  if (
    role === "admin" ||
    role === "elder"
  ) {
    return "Elder";
  }

  return "Member";
}


function roleOrder(role) {

  const order = {
    "Leader": 1,
    "Co-Leader": 2,
    "Elder": 3,
    "Member": 4
  };

  return order[role] || 99;
}


function getHeroMax(townHall, heroName) {

  const th = number(townHall);
  const name = normalizeName(heroName);

  return HOME_MAX[th]?.[name] ?? 0;
}


function getBuilderHeroMax(builderHall, heroName) {

  const bh = number(builderHall);
  const name = normalizeName(heroName);

  return BUILDER_MAX[bh]?.[name] ?? 0;
}


function getEquipmentMax(townHall, equipmentName) {

  const th = number(townHall);
  const rarity =
    EPIC_EQUIPMENT.has(normalizeName(equipmentName))
      ? "epic"
      : "common";

  return (
    EQUIPMENT_CAPS[th]?.[rarity] ??
    (rarity === "epic" ? 27 : 18)
  );
}


function equipmentLevel(item) {

  return number(
    item?.level ??
    item?.currentLevel ??
    item?.lvl
  );
}


function equipmentName(item) {

  return String(
    item?.name ??
    item?.equipmentName ??
    "Unknown Equipment"
  );
}


function equipmentMax(item, townHall) {

  const explicit =
    number(
      item?.maxLevel ??
      item?.max ??
      0
    );

  /*
    API bisa mengirim absolute max 18/27.
    Di frontend kita override dengan cap Blacksmith
    berdasarkan TH.
  */

  return getEquipmentMax(
    townHall,
    equipmentName(item)
  ) || explicit || 18;
}


/* ============================================================
   HERO PROGRESS
============================================================ */

function calculateHeroProgress(player) {

  const th =
    number(player?.townHallLevel);

  const heroes =
    Array.isArray(player?.heroes)
      ? player.heroes
      : [];

  let current = 0;
  let max = 0;

  for (const hero of heroes) {

    const name =
      normalizeName(hero?.name);

    if (
      name === "battle machine" ||
      name === "battle copter"
    ) {
      continue;
    }

    const cap =
      getHeroMax(th, name);

    if (!cap) {
      continue;
    }

    current += Math.min(
      number(hero?.level),
      cap
    );

    max += cap;
  }

  return {
    current,
    max,
    percent: max
      ? Math.round((current / max) * 100)
      : 0
  };
}


/* ============================================================
   BUILDER HERO PROGRESS
============================================================ */

function calculateBuilderProgress(player) {

  const bh =
    number(
      player?.builderHallLevel ??
      player?.builderBaseTownHallLevel ??
      player?.builderHall
    );

  const heroes =
    Array.isArray(player?.heroes)
      ? player.heroes
      : [];

  let current = 0;
  let max = 0;

  for (const hero of heroes) {

    const name =
      normalizeName(hero?.name);

    if (
      name !== "battle machine" &&
      name !== "battle copter"
    ) {
      continue;
    }

    const cap =
      getBuilderHeroMax(bh, name);

    if (!cap) {
      continue;
    }

    current += Math.min(
      number(hero?.level),
      cap
    );

    max += cap;
  }

  return {
    current,
    max,
    percent: max
      ? Math.round((current / max) * 100)
      : 0
  };
}


/* ============================================================
   EQUIPMENT PROGRESS
============================================================ */

function getPlayerEquipment(player) {

  if (
    Array.isArray(player?.heroEquipment)
  ) {
    return player.heroEquipment;
  }

  if (
    Array.isArray(player?.heroEquipments)
  ) {
    return player.heroEquipments;
  }

  if (
    Array.isArray(player?.equipment)
  ) {
    return player.equipment;
  }

  return [];
}


function calculateEquipmentProgress(player) {

  const th =
    number(player?.townHallLevel);

  const equipment =
    getPlayerEquipment(player);

  let current = 0;
  let max = 0;

  for (const item of equipment) {

    const level =
      equipmentLevel(item);

    const cap =
      equipmentMax(item, th);

    current += Math.min(
      level,
      cap
    );

    max += cap;
  }

  return {
    current,
    max,
    percent: max
      ? Math.round((current / max) * 100)
      : 0
  };
}

/* ============================================================
   API
============================================================ */

async function api(path) {

  const response =
    await fetch(
      API_BASE + path,
      {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      }
    );

  let body = null;

  try {
    body = await response.json();
  } catch (_) {
    body = null;
  }

  if (!response.ok) {

    let message =
      body?.message ||
      body?.reason ||
      `HTTP ${response.status}`;

    throw new Error(message);
  }

  return body;
}

/* ============================================================
   SEARCH
============================================================ */

async function searchData() {

  const input =
    document.getElementById("searchInput");

  const tag =
    normalizeTag(input.value);

  clearError();

  if (!tag) {

    showError(
      mode === "player"
        ? "Masukkan Player Tag terlebih dahulu."
        : "Masukkan Clan Tag terlebih dahulu."
    );

    return;
  }

  setLoading(true);

  try {

    if (mode === "player") {

      const data =
        await api(
          `/player?tag=${encodedTag(tag)}`
        );

      currentPlayer = data;

      renderPlayer(data);

      showPage("playerPage");

    } else if (mode === "clan") {

      const data =
        await api(
          `/clan?tag=${encodedTag(tag)}`
        );

      currentClan = data;

      renderClan(data);

      showPage("clanPage");

    } else {

      const data =
        await api(
          `/cwl?tag=${encodedTag(tag)}`
        );

      currentCwl = data;

      renderCwl(data);

      showPage("cwlPage");
    }

  } catch (error) {

    console.error(error);

    showError(
      error?.message ||
      "Gagal mengambil data dari server."
    );

  } finally {

    setLoading(false);
  }
}

function renderHeroes(heroes, th) {

  if (!heroes.length) {

    return `
      <div class="empty">
        Data hero belum tersedia.
      </div>
    `;
  }

  return heroes
    .map(hero => {

      const name =
        String(
          hero?.name ||
          "Unknown Hero"
        );

      const normalized =
        normalizeName(name);

      const level =
        number(hero?.level);

      const max =
        getHeroMax(
          th,
          normalized
        );

      const image =
        getHeroAsset(name);

      const maxed =
        max > 0 &&
        level >= max;

      return `

        <div class="hero-card">

          ${
            image
              ? `
                <img
                  class="hero-image"
                  src="${image}"
                  alt="${escapeHtml(name)}"
                  loading="lazy"
                >
              `
              : `
                <div class="hero-image placeholder">
                  ⚔️
                </div>
              `
          }

          <div class="hero-info">

            <div class="hero-name">
              ${escapeHtml(name)}
            </div>

            <div class="hero-level">
              ${level}
            </div>

            ${
              max
                ? `
                  <div
                    class="hero-max ${
                      maxed ? "" : "not-max"
                    }"
                  >
                    ${maxed ? "MAX" : `Max ${max}`}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;
    })
    .join("");
}

/* ============================================================
   RENDER EQUIPMENT
============================================================ */

function renderEquipment(
  equipment,
  th
) {

  return equipment
    .map(item => {

      const name =
        equipmentName(item);

      const level =
        equipmentLevel(item);

      const max =
        equipmentMax(
          item,
          th
        );

      const image =
        getEquipmentAsset(name);

      const percent =
        max
          ? Math.min(
              100,
              Math.round(
                (level / max) * 100
              )
            )
          : 0;

      const maxed =
        level >= max;

      return `

        <div
          class="equipment-card ${
            maxed ? "maxed" : ""
          }"
        >

          ${
            image
              ? `

                  class="equipment-image"

                  alt="${escapeHtml(name)}"

/* ============================================================
   CLAN SORT
============================================================ */

function sortMembers(members, sort) {

  return [...members].sort(
    (a, b) => {

      if (sort === "th") {

        return (
          number(b?.townHallLevel) -
          number(a?.townHallLevel)
        );
      }

      if (sort === "trophies") {

        return (
          number(b?.trophies) -
          number(a?.trophies)
        );
      }

      if (sort === "role") {

        const ra =
          roleName(a);

        const rb =
          roleName(b);

        const roleDiff =
          roleOrder(ra) -
          roleOrder(rb);

        if (roleDiff !== 0) {
          return roleDiff;
        }

        return (
          number(a?.clanRank) -
          number(b?.clanRank)
        );
      }

      return (
        number(a?.clanRank) -
        number(b?.clanRank)
      );
    }
  );
}

  clanSort = sort;

  document
    .querySelectorAll(".sort-btn")

}

              const tag =

                      return `

/* ============================================================
   CWL ROUNDS
============================================================ */

function renderCwlRounds(
  rounds,
  targetTag
) {

  /*
    Worker sudah mengirim targetWar:
    hanya war yang melibatkan clan yang dicari.
  */

  const ordered =
    [...rounds]
      .sort(
        (a, b) =>
          number(a?.round) -
          number(b?.round)
      )
      .slice(0, 7);

  return `

    <div class="round-list">

      ${ordered
        .map(round => {

          const war =
            round?.targetWar ||
            round?.wars?.find(
              w =>
                w?.clan?.tag === targetTag ||
                w?.opponent?.tag === targetTag
            ) ||
            null;

          return renderCwlRound(
            round,
            war,
            targetTag
          );
        })
        .join("")
      }

    </div>
  `;
}


/* ============================================================
   CWL ROUND
============================================================ */

function renderCwlRound(
  round,
  war,
  targetTag
) {

  const roundNumber =
    number(
      round?.round

  if (!war) {

    return `

        <div class="empty">
          War data round ini belum tersedia.
        </div>

      </div>
    `;
  }


  const clan =
    war?.clan ||
    {};

  const opponent =
    war?.opponent ||
    {};


  const clanName =
    escapeHtml(
      clan?.name || "-"
    );

  const opponentName =
    escapeHtml(
      opponent?.name || "-"
    );


  const clanStars =
    number(
      clan?.stars ??
      clan?.starCount
    );

  const opponentStars =
    number(
      opponent?.stars ??
      opponent?.starCount
    );


  const clanDestruction =
    number(
      clan?.destructionPercentage ??
      clan?.destruction
    );

  const opponentDestruction =
    number(
      opponent?.destructionPercentage ??
      opponent?.destruction
    );


  const state =
    escapeHtml(
      war?.state ||
      "unknown"
    );


  return `

    <div class="round-card">

      <div class="round-head">

        <div class="round-title">
          Battle Round ${roundNumber}
        </div>

        <div class="round-state">
          ${state}
        </div>

      </div>


      <div class="war-grid">

        <div class="war-side">

          <div class="war-side-name">
            ${clanName}
          </div>

          <div class="war-side-score">
            ${clanStars}
          </div>

          <div class="war-side-detail">
            ${clanDestruction.toFixed(2)}%

          </div>

        </div>


        <div class="war-vs">

        <div class="war-side">

          <div class="war-side-name">
            ${opponentName}
          </div>

          <div class="war-side-score">
            ${opponentStars}
          </div>

          <div class="war-side-detail">
            ${opponentDestruction.toFixed(2)}%

        </div>

      </div>

    </div>
  `;
}
