<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarjana Checker</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#080b12;
  color:#f5f7fb;
  font-family:Inter,Arial,Helvetica,sans-serif;
}


/* =========================================================
   APP
========================================================= */

.app{
  width:min(1100px,94%);
  margin:0 auto;
  padding:35px 0 25px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:22px;
}

.brand-title{
  font-size:30px;
  font-weight:900;
  letter-spacing:-.5px;
}

.brand-sub{
  margin-top:5px;
  color:#7f8ba0;
  font-size:14px;
}


/* =========================================================
   SEARCH PANEL
========================================================= */

.search-panel{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:15px;
  margin-bottom:18px;
}

.switch{
  display:flex;
  gap:5px;
  margin-bottom:12px;
}

.switch button{
  border:0;
  background:transparent;
  color:#7e899c;
  padding:9px 15px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.switch button.active{
  background:#26304a;
  color:#fff;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-row input{
  flex:1;
  min-width:0;
  border:1px solid #293344;
  background:#0b1018;
  color:#fff;
  outline:none;
  border-radius:11px;
  padding:14px;
  font-size:15px;
}

.search-row input:focus{
  border-color:#397de8;
}

.search-btn{
  border:0;
  background:#fff;
  color:#080b12;
  border-radius:11px;
  padding:0 23px;
  font-weight:900;
  cursor:pointer;
}

.search-btn:hover{
  background:#dfe6f0;
}

.hint{
  margin-top:8px;
  color:#687487;
  font-size:11px;
}


/* =========================================================
   PAGE
========================================================= */

.page{
  display:none;
}

.page.active{
  display:block;
}


/* =========================================================
   PROFILE
========================================================= */

.profile{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.profile-top{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.player-name-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.player-name{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.3px;
}


/* =========================================================
   XP BADGE
========================================================= */

.xp-badge{
  background:#2f80ed;
  color:#fff;
  border-radius:6px;
  padding:4px 7px;
  font-size:11px;
  line-height:1;
  font-weight:900;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 1px 5px rgba(47,128,237,.25);
}

.player-tag{
  margin-top:5px;
  color:#7f8ba0;
  font-size:13px;
}


/* =========================================================
   CLAN LINK
========================================================= */

.clan-link{
  margin-top:10px;
  padding:0;
  border:0;
  background:none;
  color:#4f9cff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  text-align:left;
}

.clan-link span{
  color:#7f8ba0;
  font-weight:500;
}

.clan-link:hover{
  text-decoration:underline;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
}

.stat{
  background:#0b1018;
  border:1px solid #161e2b;
  border-radius:12px;
  padding:14px;
}

.stat-value{
  font-size:20px;
  font-weight:900;
}

.stat-label{
  margin-top:4px;
  color:#707c90;
  font-size:10px;
  font-weight:700;
}


/* =========================================================
   SECTION
========================================================= */

.section{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.section-title{
  font-size:20px;
  font-weight:900;
}

.section-value{
  color:#7f8ba0;
  font-size:12px;
}


/* =========================================================
   MAIN HERO PROGRESS
========================================================= */

.progress-main{
  height:6px;
  background:#202938;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:#397de8;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
  color:#697589;
  font-size:10px;
}


/* =========================================================
   HERO GRID
========================================================= */

.hero-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.hero-card{
  background:#0b1018;
  border:1px solid #202938;
  border-radius:14px;
  padding:13px;
  min-width:0;
}

.hero-card-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.hero-image{
  width:50px;
  height:50px;
  flex:0 0 50px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.hero-info{
  min-width:0;
}

.hero-name{
  font-size:13px;
  font-weight:900;
  line-height:1.15;
}

.hero-level{
  margin-top:4px;
  color:#c3cad5;
  font-size:12px;
}

.hero-max{
  color:#6f7a8d;
  font-size:10px;
  margin-top:2px;
}

.hero-progress{
  height:4px;
  margin-top:10px;
  background:#202938;
  border-radius:10px;
  overflow:hidden;
}

.hero-progress span{
  display:block;
  height:100%;
  background:#397de8;
}


/* =========================================================
   EQUIPMENT GRID
========================================================= */

.equipment-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}

.equipment-card{
  background:#0b1018;
  border:1px solid #202938;
  border-radius:14px;
  padding:11px;
  min-width:0;
}

.equipment-card.locked{
  opacity:.38;
}

.equipment-top{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.equipment-image{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.equipment-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.equipment-info{
  min-width:0;
}

.equipment-name{
  font-size:12px;
  font-weight:900;
  line-height:1.15;
  word-break:break-word;
}

.equipment-hero{
  color:#6f7a8d;
  font-size:9px;
  margin-top:3px;
}

.equipment-status{
  margin-top:9px;
  color:#aab4c4;
  font-size:11px;
  font-weight:500;
}

.equipment-status.owned{
  color:#fff;
  font-weight:900;
}

.equipment-status.locked-text{
  color:#687386;
}


/* =========================================================
   PRIORITY / ACCOUNT DATA
========================================================= */

.priority{
  display:flex;
  justify-content:space-between;
  gap:12px;
  background:#0b1018;
  border:1px solid #1b2432;
  border-radius:11px;
  padding:12px;
  margin-top:8px;
}

.priority-name{
  font-size:13px;
  font-weight:800;
}

.priority-desc{
  margin-top:3px;
  color:#727e91;
  font-size:11px;
}


/* =========================================================
   CLAN PAGE
========================================================= */

.back-btn{
  border:1px solid #293344;
  background:#10151f;
  color:#aeb7c6;
  border-radius:10px;
  padding:9px 13px;
  cursor:pointer;
  margin-bottom:12px;
}

.back-btn:hover{
  color:#fff;
  border-color:#465064;
}

.clan-header{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.clan-name{
  font-size:25px;
  font-weight:900;
}

.clan-tag{
  margin-top:5px;
  color:#7e899c;
  font-size:13px;
}

.clan-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px;
}

.member-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.member{
  width:100%;
  border:1px solid #202938;
  background:#0b1018;
  color:#fff;
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  text-align:left;
}

.member:hover{
  border-color:#397de8;
}

.member-rank{
  width:28px;
  color:#687386;
  font-size:11px;
  font-weight:900;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-name{
  font-size:13px;
  font-weight:900;
}

.member-detail{
  margin-top:3px;
  color:#6f7a8d;
  font-size:10px;
}

.member-th{
  color:#aeb7c6;
  font-size:11px;
  font-weight:900;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading-box{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:35px;
  text-align:center;
  color:#7f8ba0;
}

.error-box{
  background:#191015;
  border:1px solid #512530;
  color:#ff9eaa;
  border-radius:14px;
  padding:15px;
}

.error-title{
  font-weight:900;
}

.error-desc{
  margin-top:5px;
  color:#a97880;
  font-size:12px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
  text-align:center;
  color:#505b6d;
  font-size:10px;
  line-height:1.6;
  margin-top:25px;
}

.footer a{
  display:inline-block;
  margin-top:3px;
  color:#4f9cff;
  text-decoration:none;
  font-weight:800;
}

.footer a:hover{
  text-decoration:underline;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

  .app{
    padding-top:35px;
  }

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:899px){

  .hero-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .equipment-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:599px){

  .app{
    width:94%;
    padding-top:20px;
  }

  .brand-title{
    font-size:25px;
  }

  .brand-sub{
    font-size:12px;
  }

  .search-row{
    gap:7px;
  }

  .search-btn{
    padding:0 15px;
  }

  .profile,
  .section,
  .clan-header{
    padding:14px;
    border-radius:15px;
  }

  .player-name{
    font-size:21px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  /*
   * MOBILE HERO = 2 KOLOM
   */

  .hero-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .hero-card{
    padding:10px;
  }

  .hero-card-top{
    gap:7px;
  }

  .hero-image{
    width:42px;
    height:42px;
    flex-basis:42px;
  }

  .hero-name{
    font-size:11px;
  }

  .hero-level{
    font-size:10px;
  }

  .hero-max{
    font-size:9px;
  }

  /*
   * MOBILE EQUIPMENT = 2 KOLOM
   */

  .equipment-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .equipment-card{
    padding:9px;
  }

  .equipment-top{
    gap:7px;
  }

  .equipment-image{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .equipment-name{
    font-size:10px;
  }

  .equipment-hero{
    font-size:8px;
  }

  .equipment-status{
    font-size:10px;
    margin-top:7px;
  }

  .clan-stats{
    grid-template-columns:repeat(2,1fr);
  }

  .section-title{
    font-size:17px;
  }

  .section-value{
    font-size:10px;
  }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:360px){

  .equipment-image{
    width:34px;
    height:34px;
    flex-basis:34px;
  }

  .equipment-name{
    font-size:9px;
  }

  .equipment-status{
    font-size:9px;
  }

  .hero-image{
    width:36px;
    height:36px;
    flex-basis:36px;
  }

}

</style>
</head>

===================================================== -->

<main

<!-- =====================================================
     CLAN PAGE
===================================================== -->

===================================================== -->

</footer>


</div>

/* ========================================================
   HELPERS
======================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatNumber(value){

  const number =
    Number(value);

  if(!Number.isFinite(number)){
    return "-";
  }

  return number.toLocaleString("en-US");

}


function cleanTag(value){

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if(
    tag &&
    !tag.startsWith("#")
  ){
    tag =
      "#" + tag;
  }

  return tag;

}


function normalizeName(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

}


/* ========================================================
   API REQUEST
======================================================== */

async function apiGet(endpoint,tag){

  const clean =
    cleanTag(tag);

  const url =
    `${API_BASE}/${endpoint}?tag=${encodeURIComponent(clean)}`;

  const response =
    await fetch(url);

  let data = null;

  try{

    data =
      await response.json();

  }catch(error){

    throw new Error(
      "Respons API tidak valid."
    );

  }


  if(!response.ok){

    const message =
      data?.details?.message ||
      data?.error ||
      `HTTP ${response.status}`;

    throw new Error(message);

  }

  return data;

}


/* ========================================================
   MODE PLAYER / CLAN
======================================================== */

function setMode(type){

  mode = type;

  const playerTab =
    document.getElementById("playerTab");

  const clanTab =
    document.getElementById("clanTab");

  const input =
    document.getElementById("searchInput");

  const hint =
    document.getElementById("searchHint");


  if(type === "player"){

    playerTab.classList.add("active");

    clanTab.classList.remove("active");

    input.placeholder =
      "Masukkan Player Tag";

    hint.textContent =
      "Contoh: #9UG9LJV8Y";

    showPlayer(false);

  }else{

    clanTab.classList.add("active");

    playerTab.classList.remove("active");

    input.placeholder =
      "Masukkan Clan Tag";

    hint.textContent =
      "Contoh: #2J0P2GR08";

    showClan(false);

  }

}


/* ========================================================
   SEARCH
======================================================== */

async function searchData(){

  const input =
    document.getElementById("searchInput");

  const value =
    cleanTag(input.value);

  if(
    !value ||
    value === "#"
  ){

    return;

  }


  if(mode === "player"){

    await loadPlayer(value);

  }else{

    await loadClan(value);

  }

}

/* ========================================================
   GET PLAYER EQUIPMENT
======================================================== */

function getPlayerEquipment(player){

  const result = [];


  /*
   * FORMAT UTAMA
   */

  if(
    Array.isArray(
      player.heroEquipment
    )
  ){

    result.push(
      ...player.heroEquipment
    );

  }


  /*
   * FORMAT ALTERNATIF
   */

  if(
    Array.isArray(
      player.heroEquipments
    )
  ){

    result.push(
      ...player.heroEquipments
    );

  }


  /*
   * FORMAT ALTERNATIF LAGI
   */

  if(
    Array.isArray(
      player.equipment
    )
  ){

    result.push(
      ...player.equipment
    );

  }


  /*
   * FALLBACK:
   * beberapa proxy/API wrapper
   * bisa meletakkan equipment
   * di object heroes.
   */

  if(
    Array.isArray(
      player.heroes
    )
  ){

    for(
      const hero of player.heroes
    ){

      if(
        !Array.isArray(
          hero.equipment
        )
      ){

        continue;

      }


      for(
        const item of hero.equipment
      ){

        if(!item){
          continue;
        }


        result.push({

          ...item,

          hero:
            item.hero ||
            hero.name ||
            ""

        });

      }

    }

  }


  /*
   * DEDUPLICATE
   */

  const unique =
    new Map();


  for(
    const item of result
  ){

    if(
      !item ||
      !item.name
    ){

      continue;

    }


    const key =
      normalizeName(
        item.name
      );


    unique.set(
      key,
      item
    );

  }


  return [
    ...unique.values()
  ];

}


/* ========================================================
   FIND EQUIPMENT
======================================================== */

function findOwnedEquipment(
  playerEquipment,
  catalogItem
){

  const target =
    normalizeName(
      catalogItem.name
    );


  return playerEquipment.find(
    item => {

      const apiName =
        normalizeName(
          item.name
        );

      return apiName === target;

    }
  );

}


/* ========================================================
   RENDER PLAYER
======================================================== */

function renderPlayer(player){

  const th =
    Number(
      player.townHallLevel || 0
    );


  const heroes =
    Array.isArray(
      player.heroes
    )
      ? player.heroes
      : [];


  const visibleHeroes =
    HEROES.filter(
      hero =>
        th >= hero.unlockTH
    );


  /*
   * HERO PROGRESS
   */

  let totalPercent = 0;

  let heroCount = 0;


  for(
    const heroConfig of visibleHeroes
  ){

    const apiHero =
      heroes.find(
        hero =>
          normalizeName(hero.name) ===
          normalizeName(heroConfig.key)
      );


    if(!apiHero){
      continue;
    }


    const level =
      Number(
        apiHero.level || 0
      );


    const max =
      Number(
        apiHero.maxLevel ||
        HERO_MAX[th]?.[heroConfig.short] ||
        level ||
        1
      );


    if(max > 0){

      totalPercent +=
        Math.min(
          level / max,
          1
        ) * 100;

      heroCount++;

    }

  }


  const heroPercent =
    heroCount
      ? Math.round(
          totalPercent /
          heroCount
        )
      : 0;


  /*
   * CLAN
   */

  const clan =
    player.clan || null;


  const clanHTML =
    clan

      ? `

        <button
          class="clan-link"
          onclick="
            loadClan('${escapeHTML(clan.tag)}')
          "
        >

          ${escapeHTML(clan.name)}

          <span>
            · Clan Level
            ${escapeHTML(
              clan.clanLevel ?? "-"

      `

      : `

        <div class="clan-link">

        </div>

  /*
   * HERO CARDS
   */

  const heroCards =
    visibleHeroes.map(
      config => {

        const apiHero =
          heroes.find(
            hero =>
              normalizeName(hero.name) ===
              normalizeName(config.key)
          );


        let level =
          Number(
            apiHero?.level || 0
          );


        let max =
          Number(
            apiHero?.maxLevel ||
            HERO_MAX[th]?.[config.short] ||
            level ||
            1
          );


        /*
         * BK TH4-TH6
         */

        if(
          config.short === "BK" &&
          th <= 6

          level =
            apiHero?.level ??
            1;

          max = 1;

        }


        const percent =
          max > 0
            ? Math.min(

                (level / max) * 100

            : 0;


        return `

  /*

            </div>

          </div>


          <div class="stat">

              ${formatNumber(

            </div>

            <div class="stat-label">

            </div>

          </div>

/* ========================================================
   RENDER EQUIPMENT
======================================================== */

function renderEquipment(
  player,
  th
){

  /*
   * Hapus section lama
   */

  const old =
    document.getElementById(
      "equipmentSection"
    );

  if(old){
    old.remove();
  }


  /*
   * Equipment baru tersedia mulai TH8
   */

  if(th < 8){

    return;

  }


  const playerEquipment =
    getPlayerEquipment(
      player
    );


  let ownedCount = 0;


  const cards =
    EQUIPMENT.map(
      equipment => {

        const locked =
          th <
          equipment.unlockTH;


        const owned =
          findOwnedEquipment(
            playerEquipment,
            equipment
          );


        if(
          owned &&
          !locked
        ){

          ownedCount++;

        }


        let status = "";


        if(locked){

          status =
            `
              <div class="
                equipment-status
                locked-text
              ">
                Terkunci · TH${equipment.unlockTH}
              </div>
            `;

        }else if(owned){

          const level =
            owned.level ??
            "-";

          const max =
            owned.maxLevel ??
            "-";


          status =
            `
              <div class="
                equipment-status
                owned
              ">

                Lv ${escapeHTML(level)}
                /
                ${escapeHTML(max)}

              </div>
            `;

        }else{

          /*
           * Ini berarti item memang tidak
           * ditemukan dalam equipment player.
           */

          status =
            `
              <div class="equipment-status">

                Belum dimiliki

              </div>
            `;

        }


        return `

          <div
            class="
              equipment-card
              ${locked ? "locked" : ""}
            "
          >

            <div class="equipment-top">

              <div class="equipment-image">

                <img
                  src="${equipment.image}"
                  alt="${escapeHTML(
                    equipment.name
                  )}"
                  onerror="
                    this.style.display='none';
                  "
                >

              </div>


              <div class="equipment-info">

                <div class="equipment-name">

                  ${escapeHTML(
                    equipment.name
                  )}

                </div>


                <div class="equipment-hero">

                  ${escapeHTML(
                    equipment.hero
                  )}

                </div>

              </div>

            </div>


            ${status}

          </div>

        `;

      }
    ).join("");


  const section =
    document.createElement(
      "section"
    );


  section.id =
    "equipmentSection";


  section.className =
    "section";


  section.innerHTML = `

    <div class="section-head">

      <div class="section-title">
        Hero Equipment
      </div>

      <div class="section-value">

        ${ownedCount}
        /
        ${EQUIPMENT.length}
        Dimiliki

      </div>

    </div>


    <div
      style="
        color:#697589;
        font-size:10px;
        margin-top:-7px;
        margin-bottom:14px;
      "
    >

      Total katalog:
      ${EQUIPMENT.length}
      equipment

    </div>


    <div class="equipment-grid">

      ${cards}

    </div>

  `;


  /*
   * Penting:
   * renderPlayer membuat profile + hero +
   * account dulu, kemudian section ini
   * ditambahkan paling bawah.
   */

  setTimeout(() => {

    const content =
      document.getElementById(
        "playerContent"
      );

    if(content){

      content.appendChild(
        section
      );

    }

  },0);

}

                clan.members
              )}

            </div>

            <div class="stat-label">
              MEMBERS
            </div>

          </div>


          <div class="stat">

            <div class="stat-value">

              ${formatNumber(
                clan.clanPoints
              )}

            </div>

            <div class="stat-label">
              CLAN POINTS
            </div>

          </div>


          <div class="stat">

            <div class="stat-value">

              ${formatNumber(
                clan.clanCapitalPoints
              )}

            </div>

            <div class="stat-label">
              CAPITAL POINTS
            </div>

          </div>

        </div>

      </div>


      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Clan Members
          </div>

          <div class="section-value">

            ${members.length}
            Members

          </div>

        </div>


        <div class="member-list">

          ${membersHTML}

        </div>

      </section>

    `;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

    }
  );
