<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sarjana Checker</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

:root{

  --bg:#080b10;
  --panel:#10151d;
  --panel2:#151b25;
  --card:#0b0f15;

  --border:#242c38;

  --text:#f4f7fb;
  --muted:#8d98a8;

  --accent:#7c5cff;
  --accent2:#a78bfa;

  --green:#35d07f;
  --yellow:#f5c451;
  --red:#ff6577;
  --blue:#45a7ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(124,92,255,.16),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{

  width:100%;
  max-width:760px;

  margin:auto;

  padding:
    18px
    14px
    50px;
}


/* =========================
   HEADER
========================= */

.header{

  display:flex;
  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.header-logo{

  width:48px;
  height:48px;

  object-fit:contain;

  border-radius:12px;
}

.brand-title{

  font-size:22px;

  font-weight:800;

  letter-spacing:-.8px;
}

.brand-sub{

  font-size:10px;

  color:var(--muted);

  margin-top:3px;
}


/* =========================
   SEARCH
========================= */

.search-panel{

  background:
    linear-gradient(
      145deg,
      #121821,
      #0d1118
    );

  border:
    1px solid
    var(--border);

  border-radius:18px;

  padding:14px;

  margin-bottom:16px;
}

.switch{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  background:#090c11;

  padding:4px;

  border-radius:11px;

  margin-bottom:12px;
}

.switch button{

  border:0;

  background:transparent;

  color:var(--muted);

  padding:9px 5px;

  border-radius:8px;

  font-size:11px;

  font-weight:800;
}

.switch button.active{

  background:
    var(--accent);

  color:white;
}

.search-row{

  display:flex;

  gap:8px;
}

.search-row input{

  flex:1;

  min-width:0;

  background:#090d13;

  color:white;

  border:
    1px solid
    var(--border);

  outline:none;

  border-radius:11px;

  padding:12px;

  font-size:13px;
}

.search-row input:focus{

  border-color:
    var(--accent);
}

.search-btn{

  border:0;

  border-radius:11px;

  padding:
    0 16px;

  background:
    var(--accent);

  color:white;

  font-weight:800;

  font-size:11px;
}

.hint{

  color:var(--muted);

  font-size:9px;

  margin-top:7px;
}


/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}


/* =========================
   COMMON
========================= */

.section{

  background:
    var(--panel);

  border:
    1px solid
    var(--border);

  border-radius:17px;

  padding:15px;

  margin-bottom:14px;
}

.section-head{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:10px;

  margin-bottom:13px;
}

.section-title{

  font-size:13px;

  font-weight:800;
}

.section-value{

  color:
    var(--accent2);

  font-size:11px;

  font-weight:800;
}

.priority{

  display:flex;

  align-items:center;

  gap:10px;

  padding:11px;

  background:
    var(--card);

  border:
    1px solid
    var(--border);

  border-radius:11px;

  margin-top:7px;
}

.priority-name{

  font-size:11px;

  font-weight:700;
}

.priority-desc{

  font-size:9px;

  color:
    var(--muted);

  margin-top:3px;
}


/* =========================
   PROFILE
========================= */

.profile{

  background:
    linear-gradient(
      145deg,
      #141a23,
      #0e131a
    );

  border:
    1px solid
    var(--border);

  border-radius:20px;

  overflow:hidden;

  margin-bottom:14px;
}

.profile-top{

  padding:19px;
}

.player-name{

  font-size:24px;

  font-weight:800;

  letter-spacing:-1px;
}

.player-tag{

  color:
    var(--muted);

  font-size:10px;

  margin-top:4px;
}

.clan-link{

  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:12px;

  color:#c4b5fd;

  background:
    rgba(
      124,
      92,
      255,
      .09
    );

  border:
    1px solid
    rgba(
      124,
      92,
      255,
      .2
    );

  border-radius:8px;

  padding:
    7px 9px;

  font-size:10px;

  font-weight:700;
}

.clan-link span{

  color:
    var(--muted);

  font-weight:500;
}

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  border-top:
    1px solid
    var(--border);
}

.stat{

  padding:
    12px 8px;

  text-align:center;

  border-right:
    1px solid
    var(--border);
}

.stat:last-child{

  border-right:0;
}

.stat-value{

  font-weight:800;

  font-size:14px;
}

.stat-label{

  font-size:8px;

  color:
    var(--muted);

  margin-top:3px;
}


/* =========================
   PROGRESS
========================= */

.progress-main{

  height:8px;

  background:#080b10;

  border-radius:99px;

  overflow:hidden;
}

.progress-fill{

  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );

  border-radius:inherit;
}

.progress-info{

  display:flex;

  justify-content:
    space-between;

  gap:8px;

  font-size:9px;

  color:
    var(--muted);

  margin-top:7px;
}


/* =========================
   HERO
========================= */

.hero-group{

  margin-bottom:14px;
}

.hero-group:last-child{

  margin-bottom:0;
}

.hero-group-title{

  font-size:10px;

  color:
    var(--accent2);

  font-weight:800;

  margin-bottom:7px;

  text-transform:
    uppercase;
}

.hero-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;
}

.hero-card{

  background:
    var(--card);

  border:
    1px solid
    var(--border);

  border-radius:12px;

  padding:10px;

  display:flex;

  align-items:center;

  gap:9px;
}

.hero-icon{

  width:40px;
  height:40px;

  object-fit:contain;

  flex-shrink:0;
}

.hero-name{

  font-size:10px;

  color:
    var(--muted);
}

.hero-level{

  font-size:15px;

  font-weight:800;

  margin-top:3px;
}

.hero-max{

  font-size:8px;

  color:
    var(--green);

  margin-top:2px;
}


/* =========================
   EQUIPMENT
========================= */

.equipment-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;
}

.equipment-card{

  background:
    var(--card);

  border:
    1px solid
    var(--border);

  border-radius:12px;

  padding:9px;

  display:flex;

  align-items:center;

  gap:8px;
}

.equipment-icon{

  width:42px;
  height:42px;

  object-fit:contain;

  flex-shrink:0;
}

.equipment-name{

  font-size:9px;

  font-weight:800;
}

.equipment-info{

  font-size:8px;

  color:
    var(--muted);

  margin-top:3px;
}

.equipment-progress{

  height:4px;

  background:#070a0e;

  border-radius:99px;

  overflow:hidden;

  margin-top:5px;
}

.equipment-progress div{

  height:100%;

  background:
    var(--accent);
}


/* =========================
   CLAN
========================= */

.clan-header{

  background:
    linear-gradient(
      145deg,
      #141a23,
      #0e131a
    );

  border:
    1px solid
    var(--border);

  border-radius:20px;

  padding:17px;

  margin-bottom:14px;
}

.clan-head-row{

  display:flex;

  align-items:center;

  gap:12px;
}

.clan-logo{

  width:62px;
  height:62px;

  object-fit:contain;

  flex-shrink:0;
}

.clan-name{

  font-size:21px;

  font-weight:800;

  letter-spacing:-.7px;
}

.clan-tag{

  color:
    var(--muted);

  font-size:10px;

  margin-top:3px;
}

.clan-meta{

  display:flex;

  gap:6px;

  flex-wrap:wrap;

  margin-top:13px;
}

.meta{

  background:
    #0b0f15;

  border:
    1px solid
    var(--border);

  padding:
    6px 8px;

  border-radius:8px;

  font-size:9px;

  color:
    var(--muted);
}

.meta strong{

  color:white;
}

.clan-description{

  margin-top:12px;

  background:
    #0b0f15;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  padding:11px;

  font-size:10px;

  line-height:1.6;

  color:#c8ced8;
}


/* =========================
   MEMBER
========================= */

.member-tools{

  display:flex;

  align-items:center;

  gap:7px;

  margin-bottom:10px;
}

.member-tools select{

  width:100%;

  background:
    #0b0f15;

  color:white;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  padding:8px;

  font-size:10px;

  outline:none;
}

.member{

  width:100%;

  display:flex;

  align-items:center;

  gap:9px;

  background:
    #0b0f15;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  padding:9px;

  margin-bottom:6px;

  color:white;

  text-align:left;
}

.member:hover{

  border-color:
    rgba(
      124,
      92,
      255,
      .5
    );
}

.member-rank{

  width:25px;

  color:
    var(--muted);

  font-size:9px;

  text-align:center;
}

.member-avatar{

  width:34px;
  height:34px;

  border-radius:9px;

  background:
    #151b25;

  display:grid;

  place-items:center;

  font-size:10px;

  font-weight:800;

  color:
    var(--accent2);
}

.member-info{

  flex:1;

  min-width:0;
}

.member-name{

  font-size:10px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.member-detail{

  font-size:8px;

  color:
    var(--muted);

  margin-top:3px;
}

.member-th{

  font-size:10px;

  font-weight:800;

  color:
    var(--accent2);
}


/* =========================
   CWL CLAN
========================= */

.cwl-clan{

  width:100%;

  display:flex;

  align-items:center;

  gap:10px;

  background:
    var(--card);

  border:
    1px solid
    var(--border);

  border-radius:13px;

  padding:10px;

  margin-bottom:7px;

  color:white;

  text-align:left;
}

.cwl-clan:hover{

  border-color:
    rgba(
      124,
      92,
      255,
      .55
    );
}

.cwl-logo{

  width:48px;
  height:48px;

  object-fit:contain;

  flex-shrink:0;
}

.cwl-info{

  flex:1;

  min-width:0;
}

.cwl-name{

  font-size:11px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.cwl-meta{

  color:
    var(--muted);

  font-size:8px;

  margin-top:4px;
}


/* =========================
   CWL TABLE
========================= */

.cwl-table-wrap{

  overflow-x:auto;

  -webkit-overflow-scrolling:
    touch;

  border:
    1px solid
    var(--border);

  border-radius:12px;
}

.cwl-table{

  width:100%;

  min-width:760px;

  border-collapse:
    collapse;

  font-size:8px;
}

.cwl-table th{

  background:
    #151b25;

  color:
    var(--muted);

  font-weight:800;

  padding:
    8px 5px;

  white-space:nowrap;

  border-bottom:
    1px solid
    var(--border);
}

.cwl-table td{

  padding:
    8px 5px;

  text-align:center;

  border-bottom:
    1px solid
    var(--border);

  color:#d9dee7;
}

.cwl-table tr:last-child td{

  border-bottom:0;
}

.cwl-table th:first-child,
.cwl-table td:first-child{

  position:sticky;

  left:0;

  text-align:left;

  min-width:150px;

  background:
    #10151d;

  z-index:2;
}

.cwl-table tbody tr:hover td{

  background:
    #151b25;
}

.cwl-clan-name{

  font-size:9px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  max-width:120px;
}

.cwl-clan-tag{

  color:
    var(--muted);

  font-size:7px;

  margin-top:2px;
}

.th-zero{

  color:
    #505a69 !important;
}


/* =========================
   CWL WAR
========================= */

.cwl-round{

  background:
    var(--card);

  border:
    1px solid
    var(--border);

  border-radius:12px;

  padding:11px;

  margin-bottom:7px;
}

.cwl-round-head{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:8px;
}

.cwl-round-name{

  font-size:10px;

  font-weight:800;
}

.cwl-round-status{

  font-size:8px;

  color:
    var(--muted);
}

.war-clans{

  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:8px;

  margin-top:10px;
}

.war-clan-name{

  font-size:9px;

  font-weight:700;
}

.war-score{

  font-size:15px;

  font-weight:800;

  text-align:center;
}

.war-left{

  text-align:right;
}

.war-right{

  text-align:left;
}

.war-bar{

  height:5px;

  background:
    #080b10;

  border-radius:99px;

  overflow:hidden;

  margin-top:8px;

  grid-column:
    1 / -1;
}

.war-bar div{

  height:100%;

  background:
    var(--accent);
}


/* =========================
   BACK
========================= */

.back-btn{

  border:
    1px solid
    var(--border);

  background:
    transparent;

  color:
    var(--muted);

  border-radius:9px;

  padding:
    8px 11px;

  font-size:10px;

  font-weight:700;

  margin-bottom:11px;
}

.back-btn:hover{

  color:white;
}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  color:
    #505a69;

  font-size:8px;

  margin-top:24px;

  line-height:1.7;
}

.footer a{

  color:
    #a78bfa;

  text-decoration:none;

  font-weight:700;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:600px){

  .app{

    padding-top:30px;
  }

  .hero-grid{

    grid-template-columns:
      repeat(4,1fr);
  }

  .equipment-grid{

    grid-template-columns:
      repeat(3,1fr);
  }
}

</style>

</head>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <img
    class="header-logo"
    src="assets/logo/og-thumbnail.png"
    alt="Sarjana Checker"
  >

  <div>

    <div class="brand-title">
      Sarjana Checker
    </div>

      Clash of Clans Account Analyzer
    </div>

  </div>

</header>

     SEARCH
========================= -->

</section>


<!-- =========================

========================= -->

<main

>

  <div
    id="playerContent"
  ></div>

</main>


<!-- =========================
     CLAN
========================= -->

<main

>

  <button

    ← Kembali

</main>


<!-- =========================
     CWL
========================= -->

<main
  id="cwlPage"
  class="page"
>

  <button
    class="back-btn"

  >
    ← Kembali
  </button>

  <div
    id="cwlContent"
  ></div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  <div>
    Clash of Clans Tag Tracker

</footer>


</div>

/* =========================
   UTILITY
========================= */

function escapeHTML(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function formatNumber(value){

  return Number(value || 0)
    .toLocaleString("en-US");
}


function cleanTag(value){

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if(
    tag &&
    !tag.startsWith("#")
  ){

    tag =
      "#" + tag;
  }

  return tag;
}


function imageFallback(img){

  img.onerror = null;

  img.style.display =
    "none";
}


/* =========================
   API
========================= */

async function apiGet(
  endpoint,
  tag
){

  const response =
    await fetch(

      `${API_BASE}/${endpoint}?tag=${
        encodeURIComponent(
          cleanTag(tag)
        )
      }`

    );


  let data;

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "Respons API tidak valid."
    );
  }


  if(!response.ok){

    const detail =
      data?.details?.message ||
      data?.message ||
      data?.error ||
      `HTTP ${response.status}`;

    throw new Error(
      detail
    );
  }


  return data;
}

/* =========================
   HERO
========================= */

function isBuilderHero(
  hero
){

  const name =
    String(
      hero.name || ""
    ).toLowerCase();


  return (
    name.includes(
      "battle machine"
    ) ||
    name.includes(
      "battle copter"
    )
  );
}


function getHeroMax(
  hero,
  th
){

  const table =
    HOME_MAX[
      Number(th)
    ] || {};


  return (
    table[
      hero.name
    ] ||
    Number(
      hero.maxLevel ||
      hero.level ||
      0
    )
  );
}


function getBuilderHeroMax(
  hero,
  bh
){

  const table =
    BUILDER_MAX[
      Number(bh)
    ] || {};


  return (
    table[
      hero.name
    ] ||
    Number(
      hero.maxLevel ||
      hero.level ||
      0
    )
  );
}

  const th =
    Number(
      player.townHallLevel || 0

    Number(
      player.builderHallLevel ||

    hero,

    const level =
      Number(

      HERO_ASSETS[

    return `

      <div class="hero-card">

          Home Village · TH${th}

                    getHeroMax(
                      hero,

  if(

  ){

    html += `

        <div class="hero-group-title">
          Builder Base

            bh
              ? ` · BH${bh}`

                hero =>
                  card(

                    getBuilderHeroMax(
                      hero,
                      bh

  return (

          </div>

        </div>

      </div>

/* =========================
   HERO PROGRESS
========================= */

function heroProgress(
  player
){

  const heroes =
    (player.heroes || [])
      .filter(
        hero =>
          hero &&
          hero.name &&
          !isBuilderHero(hero)
      );


  const th =
    Number(
      player.townHallLevel || 0
    );


  let current =
    0;

  let max =
    0;


  heroes.forEach(
    hero => {

      const heroMax =
        getHeroMax(
          hero,
          th
        );


      current +=
        Math.min(
          Number(
            hero.level || 0
          ),
          heroMax
        );


      max +=
        heroMax;
    }
  );


  return {

    current,

    max,

    percent:
      max
        ? Math.round(
            current /
            max *
            100
          )
        : 0
  };
}


/* =========================
   EQUIPMENT
========================= */

function equipmentMax(
  item
){

  if(
    EPIC_EQUIPMENT.has(
      item.name
    )
  ){

    return 27;
  }


  return Number(
    item.maxLevel ||
    18
  );
}


function renderEquipment(
  player
){

  /*
    PENTING:

    Jangan ambil:

      heroes[].equipment

    karena itu hanya loadout.

    Yang dipakai:

      player.heroEquipment

    Ini daftar equipment
    yang dimiliki/unlocked.
  */

  const equipment =
    player.heroEquipment || [];


  if(
    !equipment.length
  ){

    return {

      count:0,

      html:`

        <div class="priority">

          <div>

            <div class="priority-name">
              Data equipment tidak tersedia.
            </div>

          </div>

        </div>

      `
    };
  }


  const html =
    equipment
      .map(
        item => {

          const max =
            equipmentMax(
              item
            );


          const level =
            Number(
              item.level || 0
            );


          const percent =
            max
              ? Math.min(
                  100,
                  Math.round(
                    level /
                    max *
                    100
                  )
                )
              : 0;


          const asset =
            EQUIPMENT_ASSETS[
              item.name
            ];


          return `

            <div
              class="equipment-card"
            >

              ${
                asset
                ? `

                  <img
                    class="equipment-icon"
                    src="${asset}"
                    alt=""
                    onerror="imageFallback(this)"
                  >

                `
                : ""
              }


              <div
                style="min-width:0"
              >

                <div class="equipment-name">
                  ${escapeHTML(
                    item.name
                  )}
                </div>

                <div class="equipment-info">
                  Level ${level}/${max}
                </div>

                <div
                  class="equipment-progress"
                >

                  <div
                    style="
                      width:${percent}%
                    "
                  ></div>

                </div>

              </div>

            </div>

          `;
        }
      )
      .join("");


  return {

    count:
      equipment.length,

    html
  };
}

/* =========================

========================= */

function roleName(
  role
){

  const value =
    String(
      role || ""
    ).toLowerCase();


  if(
    value === "leader"
  ){

    return "Leader";
  }


  if(
    value === "coleader" ||
    value === "co-leader"
  ){

    return "Co-Leader";
  }


  if(
    value === "admin" ||
    value === "elder"
  ){

    return "Senior";
  }


  return "Member";
}


/* =========================
   CLAN SORT
========================= */

function sortMembers(
  members,
  sort
){

  const list =
    [...members];


  if(
    sort === "rank"
  ){

    list.sort(
      (a,b) =>
        Number(
          a.clanRank ??
          999
        ) -
        Number(
          b.clanRank ??
          999
        )
    );

  }


  else if(
    sort === "th"
  ){

    list.sort(
      (a,b) =>
        Number(
          b.townHallLevel || 0
        ) -
        Number(
          a.townHallLevel || 0
        )
    );

  }


  else if(
    sort === "trophy"
  ){

    list.sort(
      (a,b) =>
        Number(
          b.trophies || 0
        ) -
        Number(
          a.trophies || 0
        )
    );

  }


  else if(
    sort === "name"
  ){

    list.sort(
      (a,b) =>
        String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          )
        )
    );
  }


  return list;
}


/* =========================
   MEMBER LIST
========================= */

function renderMembers(){

  if(!currentClan){
    return;
  }


  const members =
    currentClan.memberList ||
    [];


  const sort =
    document.getElementById(
      "memberSort"
    )?.value ||
    "rank";


  const sorted =
    sortMembers(
      members,
      sort
    );


  const container =
    document.getElementById(
      "memberList"
    );


  if(!container){
    return;
  }


  container.innerHTML =
    sorted.length

    ? sorted
        .map(
          (member,index) => {

            const rank =
              member.clanRank ||
              index + 1;


            return `

              <button
                class="member"
                onclick="
                  loadPlayer(
                    '${escapeHTML(
                      member.tag
                    )}'
                  )
                "
              >

                <div class="member-rank">

                  ${String(
                    rank
                  ).padStart(
                    2,
                    "0"
                  )}

                </div>


                <div class="member-avatar">

                  TH${escapeHTML(
                    member.townHallLevel
                  )}

                </div>


                <div class="member-info">

                  <div class="member-name">

                    ${escapeHTML(
                      member.name
                    )}

                  </div>


                  <div class="member-detail">

                    ${formatNumber(
                      member.trophies
                    )}

                    trophies

                    ·

                    ${escapeHTML(
                      roleName(
                        member.role
                      )
                    )}

                  </div>

                </div>


                <div class="member-th">

                  TH${escapeHTML(
                    member.townHallLevel
                  )}

                </div>

              </button>

            `;
          }
        )
        .join("")

    : `

      <div class="priority">

        <div>

          <div class="priority-name">
            Member tidak tersedia.
          </div>

        </div>

      </div>

    `;
}

/* =========================
   CWL
========================= */

async function loadCWL(
  tag
){

  previousMode =
    mode;

  mode =
    "cwl";


  setMode(
    "cwl"
  );

  showPage(
    "cwlPage"
  );


  setLoading(
    "Mengambil data CWL..."
  );


  try{

    const data =
      await apiGet(
        "cwl",
        tag
      );


    currentCWL =
      data;


    renderCWL(
      data
    );

  }catch(error){

    setError(
      error.message
    );
  }
}


/* =========================
   CWL BADGE
========================= */

function clanBadge(
  clan
){

  return (
    clan?.badgeUrls?.medium ||
    clan?.badgeUrls?.small ||
    clan?.badgeUrls?.large ||
    ""
  );
}


/* =========================
   CWL TH TABLE
========================= */

function renderCWLTHTable(
  data
){

  const clans =
    data.clans ||
    [];


  if(
    !clans.length
  ){

    return `

      <div class="priority">

        <div>

          <div class="priority-name">
            Data clan CWL belum tersedia.
          </div>

        </div>

      </div>

    `;
  }


  const thLevels =
    [];


  /*
    TH yang ditampilkan.
    Sesuai model tabel
    pada screenshot.
  */

  for(
    let th = 8;
    th <= 18;
    th++
  ){

    thLevels.push(
      th
    );
  }


  const rows =
    clans
      .map(
        clan => {

          const breakdown =
            clan.townHallBreakdown ||
            {};


          const badge =
            clanBadge(
              clan
            );


          return `

            <tr>


              <td>

                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:7px;
                  "
                >


                  ${
                    badge
                    ? `

                      <img
                        src="${escapeHTML(
                          badge
                        )}"
                        style="
                          width:27px;
                          height:27px;
                          object-fit:contain;
                          flex-shrink:0;
                        "
                        alt=""
                      >

                    `
                    : ""
                  }


                  <div
                    style="
                      min-width:0;
                    "
                  >

                    <div class="cwl-clan-name">

                      ${escapeHTML(
                        clan.name ||
                        "-"
                      )}

                    </div>


                    <div class="cwl-clan-tag">

                      ${escapeHTML(
                        clan.tag ||
                        ""
                      )}

                    </div>

                  </div>

                </div>

              </td>


              ${
                thLevels
                  .map(
                    th => {

                      const count =
                        Number(
                          breakdown[
                            th
                          ] || 0
                        );


                      return `

                        <td
                          class="${
                            count === 0
                              ? "th-zero"
                              : ""
                          }"
                        >

                          ${
                            count === 0
                              ? "-"
                              : count
                          }

                        </td>

                      `;
                    }
                  )
                  .join("")
              }


            </tr>

          `;
        }
      )
      .join("");


  return `

    <div
      class="cwl-table-wrap"
    >

      <table
        class="cwl-table"
      >


        <thead>

          <tr>

            <th>
              Clan
            </th>


            ${
              thLevels
                .map(
                  th => `

                    <th>
                      TH${th}
                    </th>

                  `
                )
                .join("")
            }

          </tr>

        </thead>


        <tbody>

          ${rows}

        </tbody>


      </table>

    </div>

  `;
}


/* =========================
   CWL CLAN LIST
========================= */

function renderCWLClans(

){

  const clans =

  if(

                )}

              <div class="cwl-meta">

                ${escapeHTML(

                  "-"
                )}

                ·

                ${escapeHTML(
                  clan.memberCount ??

                  "-"
                )}
                member

              </div>


            </div>


            <div>
              ›
            </div>


          </button>

        `;
      }
    )
    .join("");
}


/* =========================
   CWL WAR
========================= */

function renderWarCards(
  data
){

  const wars =
    data.wars ||
    [];


  if(
    !wars.length
  ){

    return `

      <div class="priority">

        <div>

          <div class="priority-name">
            Data war CWL belum tersedia.
          </div>

        </div>

      </div>

    `;
  }


  return wars
    .map(
      (war,index) => {

        const left =
          war.clan ||
          {};

        const right =
          war.opponent ||
          {};


        const leftStars =
          Number(
            left.stars || 0
          );


        const rightStars =
          Number(
            right.stars || 0
          );


        const total =
          Math.max(
            1,
            leftStars +
            rightStars
          );


        const leftPercent =
          Math.round(
            leftStars /
            total *
            100
          );


        return `

          <div
            class="cwl-round"
          >


            <div
              class="cwl-round-head"
            >

              <div
                class="cwl-round-name"
              >

                Round
                ${index + 1}

              </div>


              <div
                class="cwl-round-status"
              >

                ${escapeHTML(
                  war.state ||
                  "-"
                )}

              </div>

            </div>


            <div
              class="war-clans"
            >


              <div
                class="war-left"
              >

                <div
                  class="war-clan-name"
                >

                  ${escapeHTML(
                    left.name ||
                    "-"
                  )}

                </div>


                <div
                  class="war-score"
                >

                  ${leftStars}

                </div>

              </div>


              <div>
                VS
              </div>


              <div
                class="war-right"
              >

                <div
                  class="war-clan-name"
                >

                  ${escapeHTML(
                    right.name ||
                    "-"
                  )}

                </div>


                <div
                  class="war-score"
                >

                  ${rightStars}

                </div>

              </div>


              <div
                class="war-bar"
              >

                <div
                  style="
                    width:${leftPercent}%
                  "
                ></div>

              </div>


            </div>

          </div>

        `;
      }
    )
    .join("");
}
