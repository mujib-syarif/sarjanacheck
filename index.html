<html lang="id">

<meta charset="UTF-8">

<title>Sarjana Checker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#080b12;
  color:#f4f7fb;
}
.container{
  width:min(1100px,94%);
  margin:auto;
}
header{
  padding:28px 0 20px;
}
.logo{
  font-size:28px;
  font-weight:900;
}
.subtitle{
  color:#8e98aa;
  margin-top:5px;
}
.search{
  display:flex;
  gap:10px;
  margin:20px 0;
}
.search input{
  flex:1;
  background:#111722;
  border:1px solid #293242;
  color:white;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  outline:none;
}
.search button{
  border:0;
  border-radius:12px;
  padding:0 22px;
  background:#fff;
  color:#080b12;
  font-weight:800;
  cursor:pointer;
}
.card{
  background:#10151f;
  border:1px solid #202938;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}
.player-head{
  display:flex;
  gap:16px;
  align-items:center;
}
.player-avatar{
  width:76px;
  height:76px;
  border-radius:16px;
  background:#171e2a;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.player-avatar img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.player-name{
  font-size:25px;
  font-weight:900;
}
.tag{
  color:#8792a6;
  font-size:14px;
  margin-top:4px;
}
.clan{
  margin-top:10px;
  color:#c8d0dc;
}
.th{
  margin-left:auto;
  background:#202b3c;
  border-radius:12px;
  padding:10px 13px;
  font-weight:900;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
}
.stat{
  background:#0b1018;
  border-radius:12px;
  padding:15px;
}
.stat-label{
  font-size:12px;
  color:#7f899b;
}
.stat-value{
  margin-top:5px;
  font-size:20px;
  font-weight:900;
}
.section-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:14px;
}
.hero-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}
.hero{
  background:#0b1018;
  border:1px solid #202938;
  border-radius:15px;
  padding:14px;
  display:flex;
  gap:12px;
  align-items:center;
}
.hero.locked{
  opacity:.45;
}
.hero-img{
  width:58px;
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-img img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.hero-name{
  font-weight:800;
}
.hero-level{
  margin-top:4px;
  color:#aeb7c6;
  font-size:13px;
}
.progress{
  height:5px;
  margin-top:8px;
  background:#202938;
  border-radius:5px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:#fff;
}
.equipment-info{
  color:#8e98aa;
  font-size:13px;
  margin-top:-8px;
  margin-bottom:15px;
}
.equipment-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:10px;
}
.equipment{
  background:#0b1018;
  border:1px solid #202938;
  border-radius:14px;
  padding:12px;
  min-height:105px;
}
.equipment.locked{
  opacity:.42;
}
.equipment-top{
  display:flex;
  align-items:center;
  gap:10px;
}
.equipment-img{

  height:48px;
  flex-shrink:0;
}
.equipment-img img{

  height:100%;
  object-fit:contain;

.equipment-name{
  font-size:13px;
  font-weight:800;
}
.equipment-hero{
  color:#737e91;
  font-size:11px;
  margin-top:2px;
}
.equipment-status{
  margin-top:9px;
  font-size:12px;
  color:#aeb7c6;
}
.equipment-status.owned{
  color:#fff;
  font-weight:700;
}
.equipment-status.lock{
  color:#697386;
}
.empty{
  text-align:center;
  color:#7f899b;
  padding:30px;
}
.loading{
  text-align:center;
  padding:35px;
  color:#8e98aa;
}
.error{
  background:#251318;
  border:1px solid #5b2834;
  color:#ff9eac;
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}
.hidden{

}
footer{
  text-align:center;
  padding:30px 0;
  color:#687386;
  font-size:12px;

@media(max-width:700px){

  }

  }

</style>

/*
|--------------------------------------------------------------------------
| HELPERS
|--------------------------------------------------------------------------
*/

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizeTag(tag){

  tag = tag.trim().toUpperCase();

  if(!tag.startsWith("#")){
    tag = "#" + tag;
  }

  return tag;

}


function showError(message){

  const el = document.getElementById("error");

  el.textContent = message;
  el.classList.remove("hidden");

}


function hideError(){

  document.getElementById("error")
    .classList.add("hidden");

}


/*
|--------------------------------------------------------------------------
| HERO DATA
|--------------------------------------------------------------------------
*/

function renderHeroes(player){

  const th = player.townHallLevel || 1;

  const apiHeroes = player.heroes || [];

  const heroGrid =
    document.getElementById("heroGrid");

  heroGrid.innerHTML = "";

  const caps = HERO_MAX[th] || {};

  HEROES.forEach(hero => {

    if(th < hero.unlockTH){
      return;
    }

    const apiHero =
      apiHeroes.find(
        h => h.name === hero.key
      );

    let level = apiHero?.level ?? 0;

    /*
     * BK TH4-6 memang tersedia,
     * tetapi level maksimalnya 1.
     */

    if(hero.short === "BK" && th <= 6){
      level = apiHero?.level ?? 1;
    }

    const max =
      caps[hero.short] ?? level;

    const percentage =
      max > 0
      ? Math.min(100,(level/max)*100)
      : 0;

    const card =
      document.createElement("div");

    card.className = "hero";

    card.innerHTML = `

      <div class="hero-img">

        <img
          src="${hero.image}"
          alt="${escapeHTML(hero.key)}"
          onerror="this.style.display='none'"
        >

      </div>

      <div style="flex:1">

        <div class="hero-name">
          ${escapeHTML(hero.key)}
        </div>

        <div class="hero-level">
          Level ${level} / ${max}
        </div>

        <div class="progress">
          <span style="width:${percentage}%"></span>
        </div>

      </div>

    `;

    heroGrid.appendChild(card);

  });

}


/*
|--------------------------------------------------------------------------
| EQUIPMENT
|--------------------------------------------------------------------------
*/

function renderEquipment(player){

  const th =
    player.townHallLevel || 1;

  const section =
    document.getElementById("equipmentSection");

  const grid =
    document.getElementById("equipmentGrid");

  const info =
    document.getElementById("equipmentInfo");


  /*
   * Blacksmith baru ada mulai TH8.
   */

  if(th < 8){

    section.classList.add("hidden");

    return;

  }

  section.classList.remove("hidden");

  info.textContent =
    `Equipment tersedia mulai TH8. Total katalog: ${EQUIPMENT.length} item.`;

  grid.innerHTML = "";


  const apiEquipment = [];

  /*
   * API equipment berada di dalam data heroes.
   */

  (player.heroes || []).forEach(hero => {

    (hero.equipment || []).forEach(item => {

      apiEquipment.push({
        ...item,
        hero:hero.name
      });

    });

  });


  EQUIPMENT.forEach(item => {

    const owned =
      apiEquipment.find(
        x => x.name === item.name
      );

    const locked =
      th < item.unlockTH;


    let status = "";

    if(locked){

      status =
        `Terkunci · TH${item.unlockTH}`;

    }else if(owned){

      const level =
        owned.level ?? "-";

      const max =
        owned.maxLevel ?? "-";

      status =
        `Lv ${level} / ${max}`;

    }else{

      status =
        "Belum dimiliki";

    }


    const card =
      document.createElement("div");

    card.className =
      "equipment" +
      (locked ? " locked" : "");


    card.innerHTML = `

      <div class="equipment-top">

        <div class="equipment-img">

          <img
            src="${item.image}"
            alt="${escapeHTML(item.name)}"
            onerror="
              this.style.display='none';
            "
          >

        </div>

        <div>

          <div class="equipment-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="equipment-hero">
            ${escapeHTML(item.hero)}
          </div>

        </div>

      </div>

      <div class="
        equipment-status
        ${owned && !locked ? "owned" : ""}
        ${locked ? "lock" : ""}
      ">
        ${escapeHTML(status)}
      </div>

    `;

    grid.appendChild(card);

  });

}

| PLAYER
|--------------------------------------------------------------------------

function renderPlayer(player){

  document
    .getElementById("playerName")
    .textContent =
      player.name || "-";


  document
    .getElementById("playerTag")
    .textContent =
      player.tag || "-";


  document
    .getElementById("playerTH")
    .textContent =
      "TH " + (player.townHallLevel || "-");


  document
    .getElementById("xp")
    .textContent =
      player.expLevel ?? "-";


  document
    .getElementById("trophies")
    .textContent =
      player.trophies ?? "-";


  document
    .getElementById("warStars")
    .textContent =
      player.warStars ?? "-";


  document
    .getElementById("donations")
    .textContent =
      player.donations ?? "-";


  const clan =
    player.clan;


  document
    .getElementById("playerClan")
    .textContent =
      clan
      ? `${clan.name} · ${clan.tag}`
      : "Tidak memiliki clan";


  renderHeroes(player);

  renderEquipment(player);

}

  hideError();

  const input =
    document.getElementById("tagInput");

  const tag =
    normalizeTag(input.value);


  if(tag.length < 4){

    showError(
      "Masukkan Player Tag terlebih dahulu."
    );

    return;

  }


  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");


  loading.classList.remove("hidden");

  result.classList.add("hidden");


  try{

    const url =
      `${API_BASE}/player?tag=${encodeURIComponent(tag)}`;


    const response =
      await fetch(url);


    if(!response.ok){

      let message =
        `Gagal mengambil data. HTTP ${response.status}`;

      try{

        const errorData =
          await response.json();

        if(errorData.error){
          message = errorData.error;
        }

      }catch(e){}

      throw new Error(message);

    }


    const player =
      await response.json();


    renderPlayer(player);

    result.classList.remove("hidden");


  }catch(error){

    showError(
      error.message ||
      "Terjadi kesalahan saat mengambil data player."
    );

  }finally{

    loading.classList.add("hidden");

  }

}


/*
|--------------------------------------------------------------------------
| ENTER KEY
|--------------------------------------------------------------------------
*/

document
  .getElementById("tagInput")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        checkPlayer();
      }

    }
  );


/*
|--------------------------------------------------------------------------
| DEFAULT TAG
|--------------------------------------------------------------------------
*/

document
  .getElementById("tagInput")
  .value = "#9UG9LJV8Y";

</script>
