<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sarjana Checker</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #07090e;
      --panel: #0e1219;
      --panel2: #111722;
      --panel3: #090d13;

      --border: #202735;
      --border2: #293243;

      --text: #f4f6fb;
      --muted: #7f8a9d;

      --accent: #7c5cff;
      --accent2: #a88cff;

      --green: #39d98a;
      --yellow: #f5c451;
      --red: #ff6577;
      --blue: #45a7ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(124, 92, 255, .18),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        "Plus Jakarta Sans",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;

      margin: auto;

      padding:
        22px
        15px
        55px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 20px;
    }

    .header-logo {
      width: 42px;
      height: 42px;

      object-fit: contain;

      border-radius: 10px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;

      letter-spacing: -.5px;
    }

    .brand-sub {
      margin-top: 2px;

      font-size: 9px;

      color: var(--muted);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-panel {
      padding: 11px;

      margin-bottom: 14px;

      background:
        linear-gradient(
          145deg,
          #111722,
          #0b0f16
        );

      border:
        1px solid var(--border);

      border-radius: 16px;
    }

    .switch {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 4px;

      padding: 3px;

      margin-bottom: 10px;

      background: #080b10;

      border-radius: 10px;
    }

    .switch button {
      border: 0;

      padding: 8px 5px;

      color: var(--muted);

      background: transparent;

      border-radius: 7px;

      font-size: 9px;
      font-weight: 800;
    }

    .switch button.active {
      color: white;

      background: var(--accent);
    }

    .search-row {
      display: flex;

      gap: 7px;
    }

    .search-row input {
      min-width: 0;
      flex: 1;

      height: 38px;

      padding:
        0 11px;

      color: white;

      background: #080c12;

      border:
        1px solid var(--border);

      border-radius: 9px;

      outline: none;

      font-size: 10px;
    }

    .search-row input:focus {
      border-color:
        rgba(124, 92, 255, .7);
    }

    .search-btn {
      width: 62px;

      border: 0;

      border-radius: 9px;

      color: white;

      background: var(--accent);

      font-size: 9px;
      font-weight: 800;
    }

    .hint {
      margin-top: 6px;

      color: #566174;

      font-size: 8px;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       GENERIC SECTION
    ========================= */

    .section {
      padding: 11px;

      margin-bottom: 11px;

      background:
        linear-gradient(
          145deg,
          #10151d,
          #0c1118
        );

      border:
        1px solid var(--border);

      border-radius: 15px;
    }

    .section-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 9px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 800;
    }

    .section-value {
      color: var(--accent2);

      font-size: 8px;
      font-weight: 700;
    }

    /* =========================
       PLAYER
    ========================= */

    .profile {
      padding: 13px;

      margin-bottom: 11px;

      background:
        linear-gradient(
          145deg,
          #151b25,
          #0d1219
        );

      border:
        1px solid var(--border);

      border-radius: 15px;
    }

    .profile-top {
      margin-bottom: 11px;
    }

    .player-name {
      font-size: 18px;
      font-weight: 800;

      letter-spacing: -.5px;
    }

    .player-tag {
      margin-top: 3px;

      color: var(--muted);

      font-size: 8px;
    }

    .clan-link {
      display: inline-flex;

      align-items: center;

      margin-top: 8px;

      padding: 6px 8px;

      color: var(--accent2);

      background:
        rgba(124, 92, 255, .08);

      border:
        1px solid
        rgba(124, 92, 255, .2);

      border-radius: 7px;

      font-size: 8px;
      font-weight: 700;
    }

    .clan-link span {
      margin-left: 3px;

      color: var(--muted);
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 6px;
    }

    .stat {
      padding: 9px;

      text-align: center;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 9px;
    }

    .stat-value {
      font-size: 12px;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 2px;

      color: var(--muted);

      font-size: 7px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-main {
      height: 7px;

      overflow: hidden;

      background: #070a0f;

      border-radius: 99px;
    }

    .progress-fill {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--accent2)
        );

      border-radius: inherit;
    }

    .progress-info {
      display: flex;

      justify-content: space-between;

      margin-top: 5px;

      color: var(--muted);

      font-size: 7px;
    }

    /* =========================
       HERO GRID
    ========================= */

    .category {
      margin-top: 12px;
    }

    .category-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 7px;
    }

    .category-title {
      font-size: 9px;
      font-weight: 800;
    }

    .category-value {
      color: var(--muted);

      font-size: 7px;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 6px;
    }

    .hero-card {
      padding: 8px;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 9px;
    }

    .hero-image {
      width: 42px;
      height: 42px;

      display: block;

      margin: 0 auto 5px;

      object-fit: contain;
    }

    .hero-name {
      overflow: hidden;

      text-align: center;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 7px;
      font-weight: 700;
    }

    .hero-level {
      margin-top: 3px;

      text-align: center;

      color: var(--accent2);

      font-size: 8px;
      font-weight: 800;
    }

    .hero-bar {
      height: 3px;

      margin-top: 5px;

      overflow: hidden;

      background: #05070b;

      border-radius: 99px;
    }

    .hero-bar-fill {
      height: 100%;

      background: var(--accent);

      border-radius: inherit;
    }

    /* =========================
       EQUIPMENT
    ========================= */

    .equipment-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 6px;
    }

    .equipment-card {
      display: flex;

      align-items: center;

      gap: 7px;

      min-width: 0;

      padding: 7px;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 9px;
    }

    .equipment-image {
      width: 36px;
      height: 36px;

      flex-shrink: 0;

      object-fit: contain;
    }

    .equipment-info {
      min-width: 0;

      flex: 1;
    }

    .equipment-name {
      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 7px;
      font-weight: 700;
    }

    .equipment-hero {
      margin-top: 2px;

      color: var(--muted);

      font-size: 6px;
    }

    .equipment-level {
      margin-top: 3px;

      color: var(--accent2);

      font-size: 7px;
      font-weight: 800;
    }

    /* =========================
       CLAN
    ========================= */

    .clan-header {
      padding: 13px;

      margin-bottom: 11px;

      background:
        linear-gradient(
          145deg,
          #151b25,
          #0d1219
        );

      border:
        1px solid var(--border);

      border-radius: 15px;
    }

    .clan-header-top {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .clan-badge {
      width: 48px;
      height: 48px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .clan-name {
      font-size: 17px;
      font-weight: 800;
    }

    .clan-tag {
      margin-top: 2px;

      color: var(--muted);

      font-size: 8px;
    }

    .clan-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      margin-top: 10px;
    }

    .meta {
      padding: 5px 7px;

      color: var(--muted);

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 6px;

      font-size: 7px;
    }

    .meta strong {
      color: white;
    }

    .clan-description {
      margin-top: 9px;

      color: var(--muted);

      font-size: 8px;

      line-height: 1.5;
    }

    .member-list {
      display: flex;

      flex-direction: column;

      gap: 5px;
    }

    .member {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px;

      text-align: left;

      color: white;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 8px;
    }

    .member-rank {
      width: 22px;

      flex-shrink: 0;

      text-align: center;

      color: var(--muted);

      font-size: 7px;
    }

    .member-info {
      min-width: 0;

      flex: 1;
    }

    .member-name {
      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 8px;
      font-weight: 700;
    }

    .member-detail {
      margin-top: 2px;

      color: var(--muted);

      font-size: 6px;
    }

    .member-th {
      flex-shrink: 0;

      color: var(--accent2);

      font-size: 7px;
      font-weight: 800;
    }

    .sort-row {
      display: flex;

      gap: 5px;

      margin-bottom: 8px;
    }

    .sort-btn {
      padding: 5px 7px;

      color: var(--muted);

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 6px;

      font-size: 7px;
    }

    .sort-btn.active {
      color: white;

      border-color:
        rgba(124, 92, 255, .6);

      background:
        rgba(124, 92, 255, .12);
    }

    /* =========================
       CWL STATS
    ========================= */

    .cwl-stat-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 6px;
    }

    .cwl-stat {
      padding: 9px;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 8px;
    }

    .cwl-stat-label {
      color: var(--muted);

      font-size: 7px;
    }

    .cwl-stat-value {
      margin-top: 4px;

      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       TH TABLE
    ========================= */

    .th-scroll {
      width: 100%;

      overflow-x: auto;

      scrollbar-width: thin;
    }

    .th-table {
      min-width: 470px;

      border:
        1px solid var(--border);

      border-radius: 8px;

      overflow: hidden;

      background: #090d13;
    }

    .th-row {
      display: grid;

      grid-template-columns:
        92px
        repeat(11, 34px);

      min-height: 30px;

      border-bottom:
        1px solid rgba(255,255,255,.035);
    }

    .th-row:last-child {
      border-bottom: 0;
    }

    .th-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      min-width: 0;

      padding: 3px;

      border-right:
        1px solid rgba(255,255,255,.035);

      text-align: center;

      font-size: 7px;
    }

    .th-cell:last-child {
      border-right: 0;
    }

    .th-head {
      color: var(--muted);

      background: #0c1118;

      font-size: 6px;
      font-weight: 800;
    }

    .th-clan {
      justify-content: flex-start;

      padding-left: 7px;

      overflow: hidden;

      color: white;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-weight: 700;
    }

    button.th-clan {
      width: 100%;

      border: 0;

      cursor: pointer;
    }

    button.th-clan:hover {
      color: var(--accent2);

      background:
        rgba(124, 92, 255, .08);
    }

    .th-count {
      color: #c9d0dc;

      font-weight: 700;
    }

    /* =========================
       WAR BREAKDOWN
    ========================= */

    .war-list {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .war-card {
      padding: 10px;

      background: #090d13;

      border:
        1px solid var(--border);

      border-radius: 9px;
    }

    .war-card-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 9px;
    }

    .war-round {
      font-size: 8px;
      font-weight: 800;
    }

    .war-status {
      color: var(--muted);

      font-size: 6px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .war-match {
      display: grid;

      grid-template-columns:
        1fr
        44px
        1fr;

      align-items: center;

      gap: 5px;
    }

    .war-side {
      min-width: 0;
    }

    .war-side.right {
      text-align: right;
    }

    .war-clan-name {
      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 7px;
      font-weight: 800;
    }

    .war-score {
      margin-top: 3px;

      color: var(--accent2);

      font-size: 13px;
      font-weight: 800;
    }

    .war-vs {
      text-align: center;

      color: var(--muted);

      font-size: 7px;
      font-weight: 800;
    }

    .war-extra {
      display: flex;

      justify-content: space-between;

      margin-top: 8px;

      color: var(--muted);

      font-size: 6px;
    }

    .war-empty {
      padding: 10px;

      text-align: center;

      color: #596475;

      background: #080c11;

      border-radius: 7px;

      font-size: 7px;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading {
      padding: 20px;

      text-align: center;

      color: var(--muted);

      font-size: 9px;
    }

    .error {
      padding: 10px;

      margin-bottom: 10px;

      color: #ff9aa7;

      background:
        rgba(255,101,119,.06);

      border:
        1px solid
        rgba(255,101,119,.2);

      border-radius: 8px;

      font-size: 8px;

      white-space: pre-wrap;
    }

    .empty {
      padding: 15px;

      text-align: center;

      color: var(--muted);

      font-size: 8px;
    }

    /* =========================
       BACK
    ========================= */

    .back-btn {
      margin-bottom: 10px;

      padding: 6px 8px;

      color: var(--muted);

      background: transparent;

      border:
        1px solid var(--border);

      border-radius: 7px;

      font-size: 7px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 25px;

      text-align: center;

      color: #4d5869;

      font-size: 7px;

      line-height: 1.7;
    }

    .footer a {
      color: var(--accent2);

      text-decoration: none;

      font-weight: 700;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 600px) {

      .app {
        padding-top: 35px;
      }

      .hero-grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .equipment-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .th-row {
        grid-template-columns:
          150px
          repeat(11, 42px);
      }

      .th-table {
        min-width: 612px;
      }

    }

  </style>

</head>


<body>

<div class="app">


  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <img
      class="header-logo"
      src="assets/logo/og-thumbnail.png"
      alt="Sarjana Checker"
    >

    <div>

      <div class="brand-title">
        Sarjana Checker
      </div>

      <div class="brand-sub">
        Clash of Clans Account Analyzer
      </div>

    </div>

  </header>


  <!-- =========================
       SEARCH
  ========================= -->

  <section class="search-panel">

    <div class="switch">

      <button
        id="playerTab"
        class="active"
        onclick="setMode('player')"
      >
        PLAYER
      </button>

      <button

        onclick="setMode('clan')"
      >
        CLAN
      </button>

      <button
        id="cwlTab"
        onclick="setMode('cwl')"
      >
        CWL
      </button>

    </div>


    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="Masukkan Player Tag"
        autocomplete="off"
      >

      <button
        class="search-btn"
        onclick="searchData()"
      >
        CHECK
      </button>

    </div>


    <div
      id="searchHint"
      class="hint"
    >
      Contoh: #9UG9LJV8Y
    </div>

  </section>


  <!-- =========================
       ERROR
  ========================= -->

  <div
    id="errorBox"
    class="error"
    style="display:none"
  ></div>


  <!-- =========================
       PLAYER PAGE
  ========================= -->

  <main
    id="playerPage"
    class="page active"
  ></main>


  <!-- =========================
       CLAN PAGE
  ========================= -->

  <main
    id="clanPage"
    class="page"
  ></main>


  <!-- =========================
       CWL PAGE
  ========================= -->

  <main
    id="cwlPage"
    class="page"
  ></main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="footer">

    <div>
      Sarjana Checker · Clash of Clans Analyzer
    </div>

    <div>
      BaseNama:
      <a
        href="https://mujib-syarif.basenama.workers.dev"
        target="_blank"

      </a>
    </div>

    <div>
      TikTok:
      <a
        href="https://tiktok.com/@mujib_syarif"
        target="_blank"
        rel="noopener noreferrer"
      >
        @mujib_syarif
      </a>
    </div>

  </footer>


</div>

      item &&
      Number(item.maxLevel)
    ) {

      item &&
      Number(item.maxLevelForTownHall)
    ) {

      item?.name

  /*
    ============================

    ============================
  */

  function esc(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function fmt(value) {

    return Number(
      value || 0
    ).toLocaleString("en-US");

  }


  function pct(value) {

    return Math.round(
      Number(value || 0) * 100
    );

  }


  function safeImage(src, fallback) {

    return src && String(src).trim()
      ? src
      : fallback;

  }


  function normalizeTag(value) {

    let tag =
      String(value || "").trim();

    if (!tag) {
      return "";
    }

    if (!tag.startsWith("#")) {
      tag = "#" + tag;
    }

    return tag.toUpperCase();

  }


  function showError(message) {

    const box =
      document.getElementById(
        "errorBox"
      );

    box.textContent =
      message || "Terjadi kesalahan.";

    box.style.display = "block";

  }


  function clearError() {

    const box =
      document.getElementById(
        "errorBox"
      );

    box.textContent = "";

    box.style.display = "none";

  }


  function setPage(page) {

    document
      .querySelectorAll(".page")
      .forEach((element) => {
        element.classList.remove(
          "active"
        );
      });

    document
      .getElementById(page)
      .classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  function setMode(type) {

    mode = type;

    const tabs = {
      player:
        document.getElementById(
          "playerTab"
        ),

      clan:
        document.getElementById(
          "clanTab"
        ),

      cwl:
        document.getElementById(
          "cwlTab"
        ),
    };

    Object.values(tabs)
      .forEach((tab) =>
        tab.classList.remove(
          "active"
        )

    tabs[type].classList.add(
      "active"
    );

    const input =
      document.getElementById(
        "searchInput"

      document.getElementById(
        "searchHint"
      );

    if (type === "player") {

      input.placeholder =

    if (type === "clan") {

    if (type === "cwl") {

      hint.textContent =

  /*
    ============================
    API
    ============================
  */

  async function api(
    endpoint
  ) {

    const response =
      await fetch(
        API_BASE + endpoint
      );

    let data = {};

    try {
      data =
        await response.json();
    } catch (_) {}

    if (!response.ok) {

      throw new Error(
        data?.message ||
        `HTTP ${response.status}`
      );

    }

    if (
      data &&
      data.ok === false
    ) {

      throw new Error(
        data.message ||
        "API error"
      );

    }

    return data;

  }

    ============================

  async function searchData() {

    clearError();

    const input =
      document.getElementById(
        "searchInput"
      );

    const tag =
      normalizeTag(
        input.value
      );

    if (!tag) {

      showError(
        "Masukkan tag terlebih dahulu."
      );

      return;
    }

    try {

      if (mode === "player") {

        await loadPlayer(tag);

        return;

      }

      if (mode === "clan") {

        await loadClan(tag);

        return;

      }

      if (mode === "cwl") {

        await loadCWL(tag);

        return;

      }

    } catch (error) {

      showError(
        error?.message ||
        "Gagal mengambil data."
      );

    }

  }

  function findHero(
    name,
    heroes
  ) {

    return (
      heroes || []
    ).find(
      (hero) =>
        String(
          hero.name
        ).toLowerCase() ===
        String(name).toLowerCase()
    );

  }


  function renderHeroCard(
    hero,
    max
  ) {

    const level =
      Number(
        hero?.level || 0
      );

    const percentage =
      max > 0
        ? Math.min(
            100,
            (level / max) * 100
          )
        : 0;

    const asset =
      HERO_ASSETS[
        hero?.name
      ];

    return `
      <div class="hero-card">

        ${
          asset
            ? `
              <img
                class="hero-image"
                src="${esc(asset)}"
                alt="${esc(hero?.name)}"
              >
            `
            : `
              <div
                class="hero-image"
              ></div>
            `
        }

        <div class="hero-name">
          ${esc(hero?.name || "-")}
        </div>

        <div class="hero-level">
          ${level}/${max}
        </div>

        <div class="hero-bar">
          <div
            class="hero-bar-fill"
            style="width:${percentage}%"
          ></div>
        </div>

      </div>
    `;

  }


  function renderEquipment(
    player
  ) {

    const equipment =
      Array.isArray(
        player?.heroEquipment
      )
        ? player.heroEquipment
        : [];

    let current = 0;

    let maximum = 0;

    const html =
      equipment
        .map((item) => {

          const level =
            Number(
              item.level || 0
            );

          const max =
            equipmentMax(item);

          current += level;

          maximum += max;

          const asset =
            EQUIPMENT_ASSETS[
              item.name
            ];

          return `
            <div
              class="equipment-card"
            >

              ${
                asset
                  ? `
                    <img
                      class="equipment-image"
                      src="${esc(asset)}"
                      alt="${esc(item.name)}"
                      onerror="this.style.display='none'"
                    >
                  `
                  : `
                    <div
                      class="equipment-image"
                    ></div>
                  `
              }

              <div
                class="equipment-info"
              >

                <div
                  class="equipment-name"
                >
                  ${esc(
                    item.name ||
                    "-"
                  )}
                </div>

                <div
                  class="equipment-hero"
                >
                  ${esc(
                    item.hero ||
                    ""
                  )}
                </div>

                <div
                  class="equipment-level"
                >
                  ${level}/${max}
                </div>

              </div>

            </div>
          `;

        })
        .join("");

    const percentage =
      maximum > 0
        ? Math.round(
            current /
            maximum *
            100
          )
        : 0;

    return {
      html:
        html ||
        `<div class="empty">
          Tidak ada equipment dari API.
        </div>`,

      current,

      maximum,

      percentage,

      count:
        equipment.length,
    };

  }

  function roleName(role) {

    const value =
      String(
        role || ""
      ).toLowerCase();

    if (
      value === "leader"
    ) {
      return "Leader";
    }

    if (
      value === "coleader" ||
      value === "co-leader"
    ) {
      return "Co-Leader";
    }

    if (
      value === "elder" ||
      value === "admin"
    ) {
      return "Elder";
    }

    return "Member";

  }

  async function loadClan(tag) {

    clearError();

    setPage("clanPage");

    document.getElementById(
      "clanPage"
    ).innerHTML =
      `<div class="section loading">
        Mengambil data clan...
      </div>`;

    const response =
      await api(
        `/clan?tag=${encodeURIComponent(
          normalizeTag(tag)
        )}`
      );

    clanData =
      response.data;

    renderClan();

  }


  function sortMembers(
    members
  ) {

    const list =
      Array.isArray(members)
        ? [...members]
        : [];

    if (clanSort === "th") {

      return list.sort(
        (a, b) =>
          Number(
            b.townHallLevel || 0
          ) -
          Number(
            a.townHallLevel || 0
          )
      );

    }

    if (clanSort === "trophy") {

      return list.sort(
        (a, b) =>
          Number(
            b.trophies || 0
          ) -
          Number(
            a.trophies || 0
          )
      );

    }

    if (clanSort === "name") {

      return list.sort(
        (a, b) =>
          String(
            a.name || ""
          ).localeCompare(
            String(
              b.name || ""
            )
          )
      );

    }

    return list.sort(
      (a, b) =>
        Number(
          a.clanRank || 999
        ) -
        Number(
          b.clanRank || 999
        )
    );

  }


  function setClanSort(
    value
  ) {

    clanSort = value;

    renderClan();

  }

    const clan =
      clanData;

    if (!clan) {
      return;

    const members =
      sortMembers(
        clan.memberList || []

    const badge =
      clan.badgeUrls?.medium ||
      clan.badgeUrls?.small ||

    const rows =

                member.tag

                  index + 1

                  2,
                  "0"
                )}
              </div>

                <div class="member-name">
                  ${esc(
                    member.name ||
                    "-"

                <div class="member-detail">

                  )}

                </div>

              </div>

              <div class="member-th">
                TH${fmt(
                  member.townHallLevel
                )}
              </div>

            </button>

          `
        )
        .join("");

    document.getElementById(
      "clanPage"
    ).innerHTML = `

      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← Kembali
      </button>


      <section class="clan-header">

        <div class="clan-header-top">

          ${
            badge
              ? `
                <img
                  class="clan-badge"
                  src="${esc(badge)}"
                  alt="${esc(
                    clan.name
                  )}"
                >
              `
              : ""
          }

          <div>

            <div class="clan-name">
              ${esc(
                clan.name ||
                "-"
              )}
            </div>

            <div class="clan-tag">
              ${esc(
                clan.tag ||
                "-"
              )}
            </div>

          </div>

        </div>


        <div class="clan-meta">

          <div class="meta">
            Member
            <strong>
              ${fmt(
                clan.memberList?.length
              )}/${fmt(
                clan.memberList?.length
              )}
            </strong>
          </div>

          <div class="meta">
            Level
            <strong>
              ${fmt(
                clan.clanLevel
              )}
            </strong>
          </div>

          <div class="meta">
            War Wins
            <strong>
              ${fmt(
                clan.warWins
              )}
            </strong>
          </div>

          <div class="meta">
            Win Streak
            <strong>
              ${fmt(
                clan.warWinStreak
              )}
            </strong>
          </div>

        </div>


        ${
          clan.description
            ? `
              <div class="clan-description">
                ${esc(
                  clan.description
                )}
              </div>
            `
            : ""
        }

      </section>


      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Clan Members
          </div>

          <div class="section-value">
            ${fmt(
              clan.memberList?.length
            )} Members
          </div>

        </div>


        <div class="sort-row">

          <button
            class="sort-btn ${
              clanSort === "rank"
                ? "active"
                : ""
            }"
            onclick="setClanSort('rank')"
          >
            Rank
          </button>

          <button
            class="sort-btn ${
              clanSort === "th"
                ? "active"
                : ""
            }"
            onclick="setClanSort('th')"
          >
            TH
          </button>

          <button
            class="sort-btn ${
              clanSort === "trophy"
                ? "active"
                : ""
            }"
            onclick="setClanSort('trophy')"
          >
            Trophy
          </button>

          <button
            class="sort-btn ${
              clanSort === "name"
                ? "active"
                : ""
            }"
            onclick="setClanSort('name')"
          >
            Name
          </button>

        </div>


        <div class="member-list">

          ${
            rows ||
            `<div class="empty">
              Tidak ada member.
            </div>`
          }

        </div>

      </section>

    `;

  }


  /*
    ============================
    CWL
    ============================
  */

  async function loadCWL(tag) {

    clearError();

    setPage("cwlPage");

    document.getElementById(
      "cwlPage"
    ).innerHTML =
      `<div class="section loading">
        Mengambil data CWL...
      </div>`;

    const response =
      await api(
        `/cwl?tag=${encodeURIComponent(
          normalizeTag(tag)
        )}`
      );

    cwlData =
      response;

    renderCWL();

  }


  function cwlClanByTag(
    tag
  ) {

    return (
      cwlData?.clans || []
    ).find(
      (clan) =>
        String(
          clan.tag
        ).toUpperCase() ===
        String(
          tag
        ).toUpperCase()
    );

  }


  function renderCWLStats() {

    const data =
      cwlData;

    const currentClan =
      data.currentClan;

    const clanName =
      currentClan?.name ||
      data.clanTag ||
      "-";

    const league =
      currentClan?.warLeague?.name ||
      "-";

    return `

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            CWL Stats
          </div>

          <div class="section-value">
            ${esc(
              data.state ||
              "-"
            )}
          </div>

        </div>


        <div class="cwl-stat-grid">

          <div class="cwl-stat">

            <div class="cwl-stat-label">
              Clan
            </div>

            <div class="cwl-stat-value">
              ${esc(
                clanName
              )}
            </div>

          </div>


          <div class="cwl-stat">

            <div class="cwl-stat-label">
              War League
            </div>

            <div class="cwl-stat-value">
              ${esc(
                league
              )}
            </div>

          </div>


          <div class="cwl-stat">

            <div class="cwl-stat-label">
              CWL Clans
            </div>

            <div class="cwl-stat-value">
              ${fmt(
                data.clans?.length
              )}
            </div>

          </div>


          <div class="cwl-stat">

            <div class="cwl-stat-label">
              Battle Rounds
            </div>

            <div class="cwl-stat-value">
              ${fmt(
                data.totalRounds
              )}
            </div>

          </div>


          <div class="cwl-stat">

            <div class="cwl-stat-label">
              Available Wars
            </div>

            <div class="cwl-stat-value">
              ${fmt(
                data.availableRounds
              )}/${fmt(
                data.totalRounds
              )}
            </div>

          </div>


          <div class="cwl-stat">

            <div class="cwl-stat-label">
              Completed
            </div>

            <div class="cwl-stat-value">
              ${fmt(
                data.completedRounds
              )}
            </div>

          </div>

        </div>

      </section>

    `;

  }


  function renderCWLTHTable() {

    const clans =
      cwlData?.clans || [];

    const thLevels =
      Array.from(
        {
          length: 11
        },
        (_, index) =>
          index + 8
      );

    const header =
      `

        <div class="th-row">

          <div class="th-cell th-head th-clan">
            Clan
          </div>

          ${thLevels
            .map(
              (th) =>
                `
                  <div
                    class="th-cell th-head"
                  >
                    TH${th}
                  </div>
                `
            )
            .join("")}

        </div>

      `;

    const rows =
      clans
        .map(
          (clan) => {

            const breakdown =
              clan.townHallBreakdown ||
              {};

            return `

              <div class="th-row">

                <button
                  class="th-cell th-clan"
                  onclick="loadClan('${esc(
                    clan.tag
                  )}')"
                  title="Buka ${esc(
                    clan.name
                  )}"
                >

                  ${esc(
                    clan.name ||
                    "-"
                  )}

                </button>


                ${thLevels
                  .map(
                    (th) =>
                      `
                        <div
                          class="
                            th-cell
                            th-count
                          "
                        >
                          ${fmt(
                            breakdown[
                              String(th)
                            ] || 0
                          )}
                        </div>
                      `
                  )
                  .join("")}

              </div>

            `;

          }
        )
        .join("");

    return `

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Town Hall Breakdown
          </div>

          <div class="section-value">
            Klik nama clan untuk detail
          </div>

        </div>


        <div class="th-scroll">

          <div class="th-table">

            ${header}

            ${
              rows ||
              `
                <div class="empty">
                  Roster CWL belum tersedia.
                </div>
              `
            }

          </div>

        </div>

      </section>

    `;

  }


  function warStatusLabel(
    state
  ) {

    if (state === "preparation") {
      return "Preparation";
    }

    if (state === "inWar") {
      return "Battle Day";
    }

    if (state === "warEnded") {
      return "War Ended";
    }

    if (state === "notInWar") {
      return "Not In War";
    }

    return "Upcoming";

  }


  function renderWarCard(
    round
  ) {

    const war =
      round.wars?.[0];

    /*
      Future round:
      no real war tag yet.
    */

    if (!war) {

      return `

        <div class="war-card">

          <div class="war-card-top">

            <div class="war-round">
              Round ${round.round}
            </div>

            <div class="war-status">
              Upcoming
            </div>

          </div>

          <div class="war-empty">
            War tag belum tersedia.
            Ronde ini belum dimulai.
          </div>

        </div>

      `;

    }

    if (!war.ok || !war.data) {

      return `

        <div class="war-card">

          <div class="war-card-top">

            <div class="war-round">
              Round ${round.round}
            </div>

            <div class="war-status">
              Error
            </div>

          </div>

          <div class="war-empty">
            Data war belum bisa diambil.
          </div>

        </div>

      `;

    }

    const data =
      war.data;

    const clan =
      data.clan;

    const opponent =
      data.opponent;

    return `

      <div class="war-card">

        <div class="war-card-top">

          <div class="war-round">
            Round ${round.round}
          </div>

          <div class="war-status">
            ${esc(
              warStatusLabel(
                data.state
              )
            )}
          </div>

        </div>


        <div class="war-match">


          <div class="war-side">

            <div class="war-clan-name">
              ${esc(
                clan?.name ||
                "-"
              )}
            </div>

            <div class="war-score">
              ${fmt(
                clan?.stars
              )}
            </div>

          </div>


          <div class="war-vs">
            VS
          </div>


          <div
            class="war-side right"
          >

            <div class="war-clan-name">
              ${esc(
                opponent?.name ||
                "-"
              )}
            </div>

            <div class="war-score">
              ${fmt(
                opponent?.stars
              )}
            </div>

          </div>


        </div>


        <div class="war-extra">

          <span>
            ${fmt(
              clan?.attacks
            )} attacks
            ·
            ${Number(
              clan?.destructionPercentage ||
              0
            ).toFixed(2)}%
          </span>

          <span>
            ${fmt(
              opponent?.attacks
            )} attacks
            ·
            ${Number(
              opponent?.destructionPercentage ||
              0
            ).toFixed(2)}%
          </span>

        </div>

      </div>

    `;

  }


  function renderCWLWarBreakdown() {

    const rounds =
      Array.isArray(
        cwlData?.rounds
      )
        ? cwlData.rounds
        : [];

    return `

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            War Breakdown
          </div>

          <div class="section-value">
            ${rounds.length} Round
          </div>

        </div>


        <div class="war-list">

          ${
            rounds.length
              ? rounds
                  .map(
                    renderWarCard
                  )
                  .join("")
              : `
                <div class="empty">
                  Data ronde CWL belum tersedia.
                </div>
              `
          }

        </div>

      </section>

    `;

  }


  function renderCWL() {

    if (!cwlData) {
      return;
    }

    document.getElementById(
      "cwlPage"
    ).innerHTML = `

      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← Kembali
      </button>


      ${renderCWLStats()}


      ${renderCWLTHTable()}


      ${renderCWLWarBreakdown()}

    `;

  }


  /*
    ============================
    BACK
    ============================
  */

  function goBack() {

    if (mode === "cwl") {

      setPage(
        "cwlPage"
      );

      return;

    }

    if (
      mode === "clan" &&
      playerData
    ) {

      setPage(
        "playerPage"
      );

      return;

    }

    setPage(
      "playerPage"
    );

  }


  /*
    ============================
    ENTER KEY
    ============================
  */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          searchData();

        }

      }
    );


  /*
    ============================
    DEFAULT PLAYER
    ============================
  */

  loadPlayer(
    "#9UG9LJV8Y"
  )
  .catch(
    (error) => {
      showError(
        error?.message ||
        "Gagal memuat player."
      );
    }
  );

</script>

</body>

</html>
