<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarjana Checker</title>
  <meta name="description" content="Clash of Clans Player, Clan & CWL Analyzer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#edf3fb; --card:#ffffff; --card2:#e7effb; --text:#10233f; --muted:#52677f; --line:#b9c9dc; --accent:#123b83; --accent2:#0d5dc0; --green:#087950; --red:#bb1d36; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#dce8f8 0,#f6f9fd 36rem); color:var(--text); font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(100%,1400px); margin:0 auto; padding:24px 16px 32px; }
    .header {
      position:relative;
      display:flex;
      align-items:center;
      gap:13px;
      margin:4px 0 22px;
      padding:10px 14px 12px;
      border:1px solid rgba(18,59,131,.18);
      border-radius:16px;
      background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(235,243,253,.92));
      box-shadow:0 8px 24px rgba(24,57,99,.09);
      overflow:hidden;
    }
    .header::before {
      content:"";
      position:absolute;
      left:14px;
      right:14px;
      bottom:0;
      height:1px;
      background:linear-gradient(90deg,transparent,#c69a3a 20%,#123b83 50%,#c69a3a 80%,transparent);
      opacity:.75;
    }
    .header::after {
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      right:-70px;
      top:-90px;
      background:radial-gradient(circle,rgba(198,154,58,.16),transparent 68%);
      pointer-events:none;
    }
    .logo {
      position:relative;
      z-index:1;
      width:52px;
      height:52px;
      object-fit:contain;
      border-radius:13px;
      filter:drop-shadow(0 4px 7px rgba(18,59,131,.16));
    }
    .brand-title {
      position:relative;
      z-index:1;
      font-size:21px;
      font-weight:800;
      letter-spacing:-.4px;
      background:linear-gradient(90deg,#102f68,#123b83 55%,#8b6a2b);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .brand-sub {
      position:relative;
      z-index:1;
      color:var(--muted);
      font-size:11px;
      margin-top:2px;
      letter-spacing:.15px;
    }
    .search-panel,.section,.clan-header,.round { border:1px solid var(--line); background:var(--card); border-radius:16px; box-shadow:0 5px 16px rgba(24,57,99,.08); }
    .search-panel { padding:14px; margin-bottom:18px; }
    .switch { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
    .switch button,.search-btn,.sort-select { border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--text); min-height:38px; padding:8px 12px; font-weight:800; }
    .switch button.active,.search-btn { background:var(--accent); border-color:var(--accent); color:#fff; }
    .search-row { display:flex; gap:8px; }
    .search-row input { min-width:0; flex:1; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; }
    .hint { margin:8px 2px 0; color:var(--muted); font-size:11px; }
    .page { display:none; }
    .page.active { display:block; }
    .loading,.error-box,.empty { padding:20px; color:var(--muted); text-align:center; }
    .error-box { color:#7b1021; border:1px solid #e0aab4; border-radius:14px; background:#fff1f3; }
    .clan-header { padding:18px; margin-bottom:12px; }
    .clan-name { font-size:22px; font-weight:800; overflow-wrap:anywhere; }
    .clan-tag,.info-desc { color:var(--muted); font-size:12px; }
    .clan-description { color:var(--muted); margin-top:8px; }
    .clan-meta { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
    .meta { padding:9px; border-radius:10px; background:#eaf1fb; color:var(--muted); font-size:10px; }
    .meta strong { display:block; color:var(--text); font-size:14px; margin-top:2px; }
    .section { padding:15px; margin-bottom:12px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .section-title { font-weight:800; font-size:15px; }
    .section-value { color:var(--accent2); font-size:12px; font-weight:700; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .summary .meta { min-height:58px; }
    .hero-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }

      display:flex; align-items:center; gap:7px;
      margin:0 0 7px; padding:6px 9px;

    }
    .hero-group-title span { color:var(--muted); font-size:9px; font-weight:600; }

    .hero-card,.equipment-card { display:flex; align-items:center; gap:10px; min-width:0; padding:10px; border:1px solid var(--line); border-radius:12px; background:#f8fbff; }
    .hero-img { width:58px; height:58px; object-fit:contain; flex:0 0 auto; }
    .equipment-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .equipment-img { width:42px; height:42px; object-fit:contain; flex:0 0 auto; }
    .asset-failed { display:none; }
    .asset-placeholder { width:42px; min-height:42px; display:grid; place-items:center; flex:0 0 auto; border:1px dashed #6c82a1; border-radius:8px; color:var(--muted); font-size:8px; text-align:center; padding:3px; }
    .hero-card .asset-placeholder { width:58px; min-height:58px; }
    .asset-placeholder[hidden] { display:none; }
    .item-name { font-weight:800; overflow-wrap:anywhere; }
    .item-detail { color:var(--muted); font-size:11px; margin-top:2px; }
    .epic { color:#ffcd75; font-size:10px; font-weight:800; margin-top:2px; }
    .sort-control { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:700; }
    .sort-select { min-height:32px; color:var(--text); background:#fff; padding:5px 8px; font-size:11px; }
    .member-list { display:grid; gap:7px; }
    .member { width:100%; display:flex; align-items:center; gap:10px; text-align:left; color:var(--text); background:#f8fbff; border:1px solid var(--line); border-radius:11px; padding:10px; }
    .member:hover { border-color:var(--accent); }
    .member-rank { color:var(--accent2); font-weight:800; width:24px; }
    .member-info { flex:1; min-width:0; }
    .member-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
    .member-detail { color:var(--muted); font-size:11px; }
    .member-th { color:var(--accent2); font-weight:800; font-size:12px; }
    .role-leader { color:#ffd678; } .role-coleader { color:var(--accent2); } .role-elder { color:var(--green); }
    .cwl-clan-link { appearance:none; padding:0; border:0; background:transparent; color:var(--accent2); text-align:left; font:inherit; font-weight:800; }
    .cwl-clan-link:hover { text-decoration:underline; }
    .th-breakdown { display:grid; gap:8px; }
    .th-row { display:grid; grid-template-columns:43px 1fr 28px; align-items:center; gap:9px; font-size:12px; }
    .th-label,.th-count { font-weight:800; }
    .th-bar { height:9px; overflow:hidden; border-radius:8px; background:#d9e5f5; }
    .th-bar-fill { height:100%; min-width:2px; background:linear-gradient(90deg,var(--accent),#2386da); }
    .round { padding:13px; margin:8px 0; }
    .round-head,.war { display:flex; justify-content:space-between; gap:10px; }
    .round-title { font-weight:800; } .round-status { color:var(--muted); font-size:11px; }
    .war { align-items:center; margin-top:10px; }
    .war-side { width:calc(50% - 24px); } .war-side.right { text-align:right; }
    .war-name { font-weight:800; overflow-wrap:anywhere; } .war-score { color:var(--muted); font-size:11px; margin-top:2px; }
    .vs { color:var(--accent2); font-size:11px; font-weight:800; }
    .footer { color:#52677f; margin:22px 0 0; text-align:center; font-size:11px; }
    .footer a { color:var(--accent2); text-decoration:none; font-weight:800; }
    .player-name-row { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    .xp-bubble { display:inline-grid; place-items:center; min-width:44px; min-height:28px; padding:3px 8px; border-radius:999px; background:#d8eaff; border:1px solid #96bde8; color:#073c84; font-size:11px; font-weight:800; }
    .player-clan-link { display:flex; align-items:center; gap:10px; width:max-content; max-width:100%; margin-top:13px; padding:8px 10px; border:1px solid #9eb9d9; border-radius:11px; background:#edf5ff; color:#0b4d9f; font-weight:800; text-align:left; }
    .clan-badge { width:44px; height:44px; object-fit:contain; flex:0 0 auto; }
    .clan-badge.small { width:36px; height:36px; }
    .player-clan-copy { min-width:0; }
    .player-clan-copy strong,.player-clan-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .player-clan-copy span { color:var(--muted); font-size:11px; font-weight:600; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
    .clan-th-table { width:100%; min-width:980px; table-layout:fixed; border-collapse:collapse; background:#fff; }
    .clan-th-table th,.clan-th-table td { padding:6px 3px; border-bottom:1px solid #d5e0ed; text-align:center; }
    .clan-th-table th { background:#123b83; color:#fff; font-size:10px; white-space:nowrap; }
    .clan-th-table th:first-child { width:210px; min-width:210px; text-align:left; }
    .clan-th-table td { color:#152c4c; font-weight:700; }
    .clan-th-table tbody tr:nth-child(even) { background:#f1f6fc; }
    .clan-th-table tbody tr.selected { background:#ccecff; }
    .clan-cell { display:flex; align-items:center; gap:6px; min-width:0; text-align:left; }
    .clan-cell .cwl-clan-link { color:#10233f; max-width:145px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .th-column { width:calc((100% - 210px) / 18); }
    @media (max-width:600px) {
      .app { padding:12px 10px 24px; }
      .header { margin:2px 0 12px; padding:8px 10px 10px; gap:9px; border-radius:13px; }
      .logo { width:43px; height:43px; border-radius:10px; }
      .brand-title { font-size:17px; }
      .brand-sub { font-size:9px; }
      .search-panel { padding:10px; margin-bottom:10px; }
      .switch { gap:5px; margin-bottom:7px; }
      .switch button,.search-btn { min-height:34px; padding:6px 7px; font-size:11px; }
      .search-row { gap:6px; }
      .search-row input { padding:8px 9px; }
      .clan-header { padding:13px; margin-bottom:10px; }
      .clan-name { font-size:18px; }
      .clan-meta { gap:5px; margin-top:10px; }
      .meta { padding:7px; }
      .meta strong { font-size:12px; }
      .summary { gap:5px; }
      .summary .meta { min-height:50px; }
      .section { padding:10px; margin-bottom:9px; border-radius:13px; }
      .section-head { margin-bottom:8px; }
      .section-title { font-size:13px; }
      .section-value { font-size:10px; }
      .hero-grid,.equipment-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
      .hero-card,.equipment-card { gap:6px; padding:7px; border-radius:9px; }
      .hero-img { width:42px; height:42px; }
      .hero-card .asset-placeholder { width:42px; min-height:42px; }
      .equipment-img { width:34px; height:34px; }
      .item-name { font-size:10px; line-height:1.2; }
      .item-detail { font-size:9px; }
      .epic { font-size:8px; }
      .hero-group-title { margin-bottom:6px; padding:5px 8px; font-size:10px; }
      .hero-group-title span { font-size:8px; }
      .sort-control { align-items:center; flex-direction:row; }
      .sort-select { min-height:29px; font-size:10px; }
      .member { padding:8px; gap:7px; }
      .member-name { font-size:12px; }
      .member-detail { font-size:9px; }
      .member-th { font-size:11px; }
      .round { padding:10px; }
      .footer { margin-top:14px; font-size:9px; }

      /* CWL: keep all TH columns, but scroll horizontally instead of crushing them. */
      .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .clan-th-table { min-width:930px; table-layout:fixed; }
      .clan-th-table th:first-child { width:185px; min-width:185px; }
      .clan-th-table th,.clan-th-table td { padding:6px 3px; font-size:9px; }
      .clan-cell { gap:5px; }
      .clan-badge.small { width:30px; height:30px; }
      .clan-cell .cwl-clan-link { max-width:125px; font-size:10px; }
      .th-column { width:41px; }
    }
    return null;
  }
  function asArray(value) { return Array.isArray(value) ? value : []; }
  function number(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
  function formatNumber(value) { return number(value).toLocaleString('en-US'); }
  function cleanTag(value) {
    const tag = String(value || '').trim().toUpperCase();
    return tag && tag.charAt(0) !== '#' ? '#' + tag : tag;
  }
  function encodedTag(value) { return encodeURIComponent(cleanTag(value)); }
  function escapeHTML(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  function assetKey(value) {
    return String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/&/g,' and ').replace(/['\u2018\u2019]/g,'')
      .replace(/[_-]+/g,' ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function indexedAssets(source) {
    const index = {};
    Object.keys(source).forEach(function(key) { index[assetKey(key)] = source[key]; });
    return index;
  }
  const HERO_ASSET_INDEX = indexedAssets(HERO_ASSETS);
  const EQUIPMENT_ASSET_INDEX = indexedAssets(EQUIPMENT_ASSETS);
  function resolveAsset(index, name, aliases) {
    const key = assetKey(name);
    const alias = aliases && aliases[key] ? assetKey(aliases[key]) : key;
    return index[alias] || null;
  }
  function badgeUrl(clan) {
    const urls = clan && firstValue(clan.badgeUrls,clan.iconUrls,clan.badge);
    if (typeof urls === 'string') return urls;
    return firstValue(urls && urls.medium,urls && urls.large,urls && urls.small,'');
  }
  function badgeImage(clan, sizeClass) {
    const url = badgeUrl(clan);
    return url ? '<img class="clan-badge' + (sizeClass ? ' ' + sizeClass : '') + '" src="' + escapeHTML(url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  }
  function heroMaxFor(hero, player) {
    const apiCap = number(firstValue(hero.maxLevelForTownHall,hero.max_level_for_town_hall));
    if (apiCap) return apiCap;
    const key = assetKey(hero.name);
    if (key === 'battle machine' || key === 'battle copter') {
      const builderHall = number(firstValue(player.builderHallLevel,player.builderBaseLevel,player.builderHall));
      return number(BUILDER_HERO_MAX[builderHall] && BUILDER_HERO_MAX[builderHall][key]) || number(firstValue(hero.maxLevel,hero.max,hero.max_level));
    }
    const th = number(player.townHallLevel);
    return number(HOME_HERO_MAX[th] && HOME_HERO_MAX[th][key]) || number(firstValue(hero.maxLevel,hero.max,hero.max_level));
  }
  function equipmentMaxFor(item, player, isEpic) {
    const apiCap = number(firstValue(item.maxLevelForTownHall,item.max_level_for_town_hall));
    if (apiCap) return apiCap;
    const cap = EQUIPMENT_TH_CAP[number(player.townHallLevel)];
    if (cap) return isEpic ? cap.epic : cap.common;
    return number(firstValue(item.maxLevel,item.max));
  }
  function assetImage(path, alt, className) {
    if (!path) return '<span class="asset-placeholder">Asset belum dipetakan</span>';
    const safePath = encodeURI(path);
    return '<img class="' + className + '" src="' + escapeHTML(safePath) + '" alt="' + escapeHTML(alt) + '" loading="lazy" onerror="this.classList.add(\'asset-failed\');this.nextElementSibling.hidden=false"><span class="asset-placeholder" hidden>Asset tidak ditemukan</span>';
  }
  function selectedPage() { return mode === 'player' ? 'playerContent' : mode === 'clan' ? 'clanContent' : 'cwlContent'; }
  function setLoading(message) {
    document.getElementById(selectedPage()).innerHTML = '<section class="section"><div class="loading">' + escapeHTML(message || 'Sabar bentar Ngab!') + '</div></section>';
  }
  function setError(message) {
    document.getElementById(selectedPage()).innerHTML = '<div class="error-box"><strong>Gagal mengambil data</strong><div>' + escapeHTML(message || 'Unknown error') + '</div></div>';
  }
  function setMode(nextMode) {
    mode = nextMode;
    ['player','clan','cwl'].forEach(function(name) {
      document.getElementById(name + 'Page').classList.toggle('active', name === mode);
      document.getElementById(name + 'Tab').classList.toggle('active', name === mode);
    });
    const input = document.getElementById('searchInput');
    const hint = document.getElementById('searchHint');
    const isPlayer = mode === 'player';
    input.placeholder = isPlayer ? 'Masukkan Player Tag' : 'Masukkan Clan Tag';
    hint.textContent = isPlayer ? 'Contoh: #9UG9LJV8Y' : 'Contoh: #2J0P2GR08';
  }
  async function api(endpoint, tag) {
    const response = await fetch(API_BASE + '/' + endpoint + '?tag=' + encodedTag(tag), { headers:{Accept:'application/json'}, cache:'no-store' });
    const text = await response.text();
    let body;
    try { body = JSON.parse(text); } catch (_) { throw new Error('Response API bukan JSON. HTTP ' + response.status); }
    if (!response.ok) throw new Error(firstValue(body && body.message, body && body.reason, body && body.error, body && body.details && body.details.message, 'HTTP ' + response.status));
    if (body && typeof body === 'object' && !Array.isArray(body)) {
      if (body.data && typeof body.data === 'object') return body.data;
      if (body.result && typeof body.result === 'object') return body.result;
      if (endpoint === 'player' && body.player && typeof body.player === 'object') return body.player;
      if (endpoint === 'clan' && body.clan && typeof body.clan === 'object') return body.clan;
      if (endpoint === 'cwl' && body.cwl && typeof body.cwl === 'object') return body.cwl;
    }
    return body;
  }
  function searchData() {
    const tag = cleanTag(document.getElementById('searchInput').value);
    if (!tag) { setError('Masukkan tag terlebih dahulu.'); return; }
    if (mode === 'player') loadPlayer(tag);
    else if (mode === 'clan') loadClan(tag);
    else loadCwl(tag);
  }
  function openClan(tag) {
    const cleaned = cleanTag(tag);
    if (!cleaned) return;
    document.getElementById('searchInput').value = cleaned;
    setMode('clan');
    loadClan(cleaned);
  }

  function normalizePlayer(raw) {
    const player = raw || {};
    const heroes = asArray(player.heroes).map(function(hero) {
      return {
        name:firstValue(hero.name,hero.heroName,'Hero'),
        level:number(firstValue(hero.level,hero.currentLevel)),
        maxLevel:number(firstValue(hero.maxLevel,hero.max,hero.max_level)),
        maxLevelForTownHall:number(firstValue(hero.maxLevelForTownHall,hero.max_level_for_town_hall))
      };
    });
    let equipment = asArray(firstValue(player.heroEquipment,player.equipment));
    if (!equipment.length) {
      equipment = asArray(player.heroes).flatMap(function(hero) {
        return asArray(hero.equipment).map(function(item) {
          const copy = Object.assign({},item);
          if (!copy.hero) copy.hero = firstValue(hero.name,hero.heroName);
          return copy;
        });
      });
    }
    return {
      name:firstValue(player.name,player.playerName,'-'),
      tag:firstValue(player.tag,player.playerTag,''),
      townHallLevel:number(firstValue(player.townHallLevel,player.townhallLevel,player.townHall)),
      expLevel:number(firstValue(player.expLevel,player.xp,player.experienceLevel)),
      trophies:number(firstValue(player.trophies,player.trophy)),
      warStars:number(firstValue(player.warStars,player.war_stars)),
      builderHallLevel:number(firstValue(player.builderHallLevel,player.builderBaseLevel,player.builderHall)),
      role:firstValue(player.role,'-'),
      roleName:firstValue(player.roleName,''),
      clan:player.clan || null,
      heroes:heroes,
      equipment:equipment
    };
  }
  async function loadPlayer(tag) {
    mode = 'player'; setMode('player'); setLoading();
    try { renderPlayer(normalizePlayer(await api('player',tag))); }
    catch (error) { setError(error && error.message); }
  }
  function renderPlayer(player) {
    const homeHeroes = player.heroes.filter(function(hero) {
      const key = assetKey(hero.name);
      return key !== 'battle machine' && key !== 'battle copter';
    });
    const builderHeroes = player.heroes.filter(function(hero) {
      const key = assetKey(hero.name);
      return key === 'battle machine' || key === 'battle copter';
    });

    function heroCards(list) {
      return list.length ? list.map(function(hero) {
        const path = resolveAsset(HERO_ASSET_INDEX,hero.name);
        const max = heroMaxFor(hero,player);
        return '<div class="hero-card">' +
          assetImage(path,hero.name,'hero-img') +
          '<div><div class="item-name">' + escapeHTML(hero.name) + '</div>' +
          '<div class="item-detail">Progress <strong>' + escapeHTML(hero.level || 0) + '/' + escapeHTML(max || '-') + '</strong></div></div>' +
          '</div>';
      }).join('') : '<div class="empty">Data hero tidak tersedia.</div>';
    }

    const homeHTML =
      '<div class="hero-group"><div class="hero-group-title">Home Village <span>Desa Utama</span></div>' +
      '<div class="hero-grid">' + heroCards(homeHeroes) + '</div></div>';

    const builderHTML =
      '<div class="hero-group"><div class="hero-group-title">Builder Base <span>Desa Builder</span></div>' +
      '<div class="hero-grid">' + heroCards(builderHeroes) + '</div></div>';

    const equipmentHTML = player.equipment.length ? player.equipment.map(function(item) {
      const name = firstValue(item.name,item.equipmentName,'Equipment');
      const key = assetKey(name);
      const path = resolveAsset(EQUIPMENT_ASSET_INDEX,name,EQUIPMENT_ALIASES);
      const level = firstValue(item.level,item.currentLevel,0);
      const isEpic = EPIC_EQUIPMENT.has(EQUIPMENT_ALIASES[key] || key);
      const max = equipmentMaxFor(item,player,isEpic);
      const rarity = isEpic ? '<div class="epic">EPIC</div>' : '<div class="epic">COMMON</div>';

      return '<div class="equipment-card">' +
        assetImage(path,name,'equipment-img') +
        '<div><div class="item-name">' + escapeHTML(name) + '</div>' +
        '<div class="item-detail">Progress <strong>' + escapeHTML(level) + '/' + escapeHTML(max || '-') + '</strong></div>' +
        rarity + '</div></div>';
    }).join('') : '<div class="empty">Data equipment tidak tersedia.</div>';

    const clanHTML = player.clan && cleanTag(firstValue(player.clan.tag,player.clan.clanTag)) ?
      '<button type="button" class="player-clan-link" onclick="openClan(\'' + escapeHTML(firstValue(player.clan.tag,player.clan.clanTag)) + '\')">' +
      badgeImage(player.clan,'') +
      '<span class="player-clan-copy"><strong>' +
      escapeHTML(firstValue(player.clan.name,player.clan.clanName,'Clan')) +
      '</strong><span>' +
      escapeHTML(firstValue(player.clan.tag,player.clan.clanTag,'')) +
      ' · Buka detail clan</span></span></button>' :
      '<div class="player-clan-link"><span class="player-clan-copy"><strong>Belum bergabung clan</strong></span></div>';

    document.getElementById('playerContent').innerHTML =
      '<div class="clan-header"><div class="player-name-row"><div class="clan-name">' +
      escapeHTML(player.name) + '</div><div class="xp-bubble">XP ' + escapeHTML(player.expLevel || '-') +
      '</div></div><div class="clan-tag">' + escapeHTML(player.tag) + '</div>' + clanHTML +
      '<div class="summary"><div class="meta">Town Hall<strong>TH' +
      escapeHTML(player.townHallLevel || '-') + '</strong></div><div class="meta">Trophies<strong>' +
      formatNumber(player.trophies) + '</strong></div><div class="meta">War Stars<strong>' +
      formatNumber(player.warStars) + '</strong></div><div class="meta">Role<strong>' +
      escapeHTML(firstValue(player.roleName,player.role,'-')) + '</strong></div></div></div>' +

      '<section class="section"><div class="section-head"><div class="section-title">Heroes</div><div class="section-value">' +
      player.heroes.length + ' Hero</div></div>' + homeHTML + builderHTML + '</section>' +

      '<section class="section"><div class="section-head"><div class="section-title">Hero Equipment</div><div class="section-value">' +
      player.equipment.length + ' Item</div></div><div class="equipment-grid">' +
      equipmentHTML + '</div></section>';

    window.scrollTo({top:0,behavior:'smooth'});
  }

  function normalizeMembers(source) {
    return asArray(source).map(function(member) {
      return {
        tag:firstValue(member.tag,member.playerTag,''),
        name:firstValue(member.name,member.playerName,'-'),
        townHallLevel:number(firstValue(member.townHallLevel,member.townhallLevel,member.townHall)),
        trophies:number(firstValue(member.trophies,member.trophy)),
        clanRank:number(firstValue(member.clanRank,member.rank)),
        role:firstValue(member.role,member.roleName,'Member')
      };
    });
  }
  function normalizeClan(raw) {
    const clan = raw || {};
    const members = normalizeMembers(firstValue(clan.memberList,clan.membersList,Array.isArray(clan.members) ? clan.members : []));
    return {
      tag:firstValue(clan.tag,clan.clanTag,''),
      name:firstValue(clan.name,clan.clanName,'-'),
      clanLevel:firstValue(clan.clanLevel,clan.level,'-'),
      members:number(firstValue(typeof clan.members === 'number' ? clan.members : null,clan.memberCount,members.length)),
      memberList:members,
      description:firstValue(clan.description,clan.desc,''),
      type:firstValue(clan.type,clan.clanType,'-'),
      badgeUrls:firstValue(clan.badgeUrls,clan.iconUrls,null)
    };
  }
  function roleOrder(role) {
    const key = assetKey(role);
    if (key === 'leader') return 1;
    if (key === 'co leader' || key === 'coleader') return 2;
    if (key === 'elder' || key === 'admin') return 3;
    return 4;
  }
  function roleName(role) {
    const order = roleOrder(role);
    return order === 1 ? 'Leader' : order === 2 ? 'Co-Leader' : order === 3 ? 'Elder' : 'Member';
  }
  function compareText(a,b) { return String(a || '').localeCompare(String(b || ''),undefined,{sensitivity:'base'}); }
  function sortClanMembers(members) {
    return members.slice().sort(function(a,b) {
      let result = 0;
      if (clanSort === 'role') result = roleOrder(a.role) - roleOrder(b.role) || number(a.clanRank) - number(b.clanRank);
      if (clanSort === 'th-desc') result = number(b.townHallLevel) - number(a.townHallLevel) || number(a.clanRank) - number(b.clanRank);
      if (clanSort === 'th-asc') result = number(a.townHallLevel) - number(b.townHallLevel) || number(a.clanRank) - number(b.clanRank);
      if (clanSort === 'trophy-desc') result = number(b.trophies) - number(a.trophies) || number(a.clanRank) - number(b.clanRank);
      if (clanSort === 'trophy-asc') result = number(a.trophies) - number(b.trophies) || number(a.clanRank) - number(b.clanRank);
      if (clanSort === 'rank') result = number(a.clanRank) - number(b.clanRank);
      return result || compareText(a.name,b.name);
    });
  }
  function setClanSort(value) {
    clanSort = value;
    if (currentClan) renderClan(currentClan);
  }
  async function loadClan(tag) {
    mode = 'clan'; setMode('clan'); setLoading();
    try { currentClan = normalizeClan(await api('clan',tag)); renderClan(currentClan); }
    catch (error) { setError(error && error.message); }
  }
  function renderClan(clan) {
    const members = sortClanMembers(clan.memberList);
    const clanBadgeHTML = badgeImage(clan,'');
    const memberHTML = members.length ? members.map(function(member,index) {
      const role = roleName(member.role);
      const roleClass = role === 'Leader' ? 'role-leader' : role === 'Co-Leader' ? 'role-coleader' : role === 'Elder' ? 'role-elder' : '';
      return '<button type="button" class="member" onclick="loadPlayer(\'' + escapeHTML(member.tag) + '\')"><div class="member-rank">' + String(index + 1).padStart(2,'0') + '</div><div class="member-info"><div class="member-name">' + escapeHTML(member.name) + '</div><div class="member-detail">' + formatNumber(member.trophies) + ' trophies · <span class="' + roleClass + '">' + role + '</span></div></div><div class="member-th">TH' + escapeHTML(member.townHallLevel || '-') + '</div></button>';
    }).join('') : '<div class="empty">Member tidak tersedia.</div>';
    document.getElementById('clanContent').innerHTML =
      '<div class="clan-header"><div class="player-name-row">' + clanBadgeHTML + '<div><div class="clan-name">' + escapeHTML(clan.name) + '</div><div class="clan-tag">' + escapeHTML(clan.tag) + '</div></div></div>' + (clan.description ? '<div class="clan-description">' + escapeHTML(clan.description) + '</div>' : '') + '<div class="clan-meta"><div class="meta">Member<strong>' + formatNumber(clan.members) + '/50</strong></div><div class="meta">Level<strong>' + escapeHTML(clan.clanLevel) + '</strong></div><div class="meta">Type<strong>' + escapeHTML(clan.type) + '</strong></div></div></div>' +
      '<section class="section"><div class="section-head"><div><div class="section-title">Clan Members</div><div class="section-value">' + members.length + '/50</div></div><label class="sort-control">Urutkan<select class="sort-select" onchange="setClanSort(this.value)"><option value="role"' + (clanSort === 'role' ? ' selected' : '') + '>Role → Rank</option><option value="th-desc"' + (clanSort === 'th-desc' ? ' selected' : '') + '>TH tinggi → rendah</option><option value="th-asc"' + (clanSort === 'th-asc' ? ' selected' : '') + '>TH rendah → tinggi</option><option value="trophy-desc"' + (clanSort === 'trophy-desc' ? ' selected' : '') + '>Trophy tinggi → rendah</option><option value="trophy-asc"' + (clanSort === 'trophy-asc' ? ' selected' : '') + '>Trophy rendah → tinggi</option><option value="rank"' + (clanSort === 'rank' ? ' selected' : '') + '>Rank</option></select></label></div><div class="member-list">' + memberHTML + '</div></section>';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function clanTag(clan) { return cleanTag(firstValue(clan && clan.tag,clan && clan.clanTag)); }
  function cwlClanFor(data, tag) {
    const wanted = cleanTag(tag);
    return asArray(data.clans).find(function(clan) { return clanTag(clan) === wanted; }) || null;
  }
  function normalizeCwl(raw) {
    const data = raw || {};
    const sourceRounds = asArray(firstValue(data.rounds,data.cwlRounds));
    return Object.assign({},data,{
      currentClan:firstValue(data.currentClan,data.clan,null),
      clans:asArray(data.clans),
      cwlRoster:asArray(data.cwlRoster),
      cwlRosterSize:number(data.cwlRosterSize),
      rounds:Array.from({length:7},function(_,index) {
        const round = sourceRounds[index] || {};
        return Object.assign({roundNumber:index + 1,wars:[],targetWar:null},round);
      })
    });
  }
  function breakdownEntries(source) {
    if (Array.isArray(source)) {
      return source.map(function(item) {
        return { th:number(firstValue(item && item.townHallLevel,item && item.townhallLevel,item && item.th,item && item.level)), count:number(firstValue(item && item.count,item && item.total,item && item.members)) };
      });
    }
    if (source && typeof source === 'object') {
      return Object.keys(source).map(function(key) {
        const value = source[key];
        return { th:number(String(key).replace(/[^0-9]/g,'')), count:number(typeof value === 'object' ? firstValue(value.count,value.total,value.members) : value) };
      });
    }
    return [];
  }
  function nonZeroBreakdown(entries) {
    const grouped = {};
    entries.forEach(function(item) {
      if (number(item.th) > 0 && number(item.count) > 0) grouped[number(item.th)] = (grouped[number(item.th)] || 0) + number(item.count);
    });
    return Object.keys(grouped).map(function(th) { return {th:number(th),count:grouped[th]}; }).sort(function(a,b) { return b.th - a.th; });
  }
  function rosterBreakdown(roster) {
    return nonZeroBreakdown(asArray(roster).map(function(member) {
      return { th:number(firstValue(member.townHallLevel,member.townhallLevel,member.townHall)), count:1 };
    }));
  }
  function cwlRosterFor(data, selectedClan) {
    if (asArray(data.cwlRoster).length) return asArray(data.cwlRoster);
    if (selectedClan && asArray(selectedClan.cwlRoster).length) return asArray(selectedClan.cwlRoster);
    return [];
  }
  function cwlBreakdownFor(data, selectedClan, roster) {
    /*
     * Root cwlTownHallBreakdown and root cwlRoster belong to the queried clan
     * in the Worker.  The only clan-level fallback is the matching selected
     * clan; no other league clan can influence this breakdown.
     */
    const rootBreakdown = nonZeroBreakdown(breakdownEntries(data.cwlTownHallBreakdown));
    if (rootBreakdown.length) return rootBreakdown;
    const rosterDerived = rosterBreakdown(roster);
    if (rosterDerived.length) return rosterDerived;
    const candidates = [
      data.currentClan && clanTag(data.currentClan) === data.selectedTag ? data.currentClan.cwlTownHallBreakdown : null,
      selectedClan && selectedClan.cwlTownHallBreakdown,
      selectedClan && selectedClan.townHallBreakdown
    ];
    for (let index = 0; index < candidates.length; index += 1) {
      const breakdown = nonZeroBreakdown(breakdownEntries(candidates[index]));
      if (breakdown.length) return breakdown;
    }
    return [];
  }
  function warIncludesClan(war, tag) {
    if (!war) return false;
    const wanted = cleanTag(tag);
    const direct = [war.target,war.enemy,war.clan,war.opponent].some(function(side) { return clanTag(side) === wanted; });
    const sides = asArray(firstValue(war.clans,war.sides));
    return direct || sides.some(function(side) { return clanTag(side) === wanted; });
  }
  function warForRound(round, tag) {
    if (warIncludesClan(round.targetWar,tag)) return round.targetWar;
    return asArray(firstValue(round.wars,round.matches)).find(function(war) { return warIncludesClan(war,tag); }) || null;
  }
  function sidesForWar(war, tag) {
    const wanted = cleanTag(tag);
    if (war.target && war.enemy && clanTag(war.target) === wanted) return {mine:war.target,enemy:war.enemy};
    if (war.target && war.enemy && clanTag(war.enemy) === wanted) return {mine:war.enemy,enemy:war.target};
    const sides = asArray(firstValue(war.clans,war.sides,war.clan && war.opponent ? [war.clan,war.opponent] : []));
    const mine = sides.find(function(side) { return clanTag(side) === wanted; });
    const enemy = sides.find(function(side) { return clanTag(side) !== wanted; });
    return mine && enemy ? {mine:mine,enemy:enemy} : null;
  }
  function scoreFor(side) {
    return formatNumber(firstValue(side.stars,side.starCount,side.clanStars)) + ' ★ · ' + formatNumber(firstValue(side.destructionPercentage,side.destruction)) + '%';
  }
  function renderCwlRound(round,index,selectedTag) {
    const war = warForRound(round,selectedTag);
    const numberRound = number(firstValue(round.roundNumber,round.round,index)) || index;
    if (!war) return '<div class="round"><div class="round-head"><div class="round-title">Round ' + numberRound + '</div><div class="round-status">Belum tersedia untuk clan ini</div></div></div>';
    const sides = sidesForWar(war,selectedTag);
    if (!sides) return '<div class="round"><div class="round-head"><div class="round-title">Round ' + numberRound + '</div><div class="round-status">Data war tidak cocok dengan clan ini</div></div></div>';
    return '<div class="round"><div class="round-head"><div class="round-title">Round ' + numberRound + '</div><div class="round-status">' + escapeHTML(firstValue(war.state,war.status,'War')) + '</div></div><div class="war"><div class="war-side"><div class="war-name">' + escapeHTML(firstValue(sides.mine.name,sides.mine.clanName,'-')) + '</div><div class="war-score">' + scoreFor(sides.mine) + '</div></div><div class="vs">VS</div><div class="war-side right"><div class="war-name">' + escapeHTML(firstValue(sides.enemy.name,sides.enemy.clanName,'-')) + '</div><div class="war-score">' + scoreFor(sides.enemy) + '</div></div></div></div>';
  }
  async function loadCwl(tag) {
    requestedCwlTag = cleanTag(tag);
    mode = 'cwl'; setMode('cwl'); setLoading();
    try { currentCwl = normalizeCwl(await api('cwl',requestedCwlTag)); renderCwl(currentCwl); }
    catch (error) { setError(error && error.message); }
  }
  function renderClanTownHallTable(clans, selectedTag) {
    const towns = Array.from({length:18},function(_,index) { return 18 - index; });
    const header = '<tr><th>Clan</th>' + towns.map(function(th) { return '<th class="th-column">TH' + th + '</th>'; }).join('') + '</tr>';
    const rows = asArray(clans).map(function(clan) {
      const tag = clanTag(clan);
      if (tag === cleanTag(selectedTag) && !asArray(clan.cwlRoster).length && asArray(currentCwl && currentCwl.cwlRoster).length) {
        clan = Object.assign({},clan,{cwlRoster:currentCwl.cwlRoster});
      }
      const counts = {};
      let breakdown = nonZeroBreakdown(
        breakdownEntries(firstValue(clan.cwlTownHallBreakdown,clan.townHallBreakdown,{}))
      );
      if (!breakdown.length && asArray(clan.cwlRoster).length) {
        breakdown = rosterBreakdown(clan.cwlRoster);
      }
      breakdown.forEach(function(entry) {
        counts[entry.th] = number(entry.count);
      });
      const cells = towns.map(function(th) { return '<td>' + (counts[th] ? formatNumber(counts[th]) : '–') + '</td>'; }).join('');
      const name = firstValue(clan.name,clan.clanName,'-');
      const clickable = tag ? '<button type="button" class="cwl-clan-link" onclick="openClan(\'' + escapeHTML(tag) + '\')">' + escapeHTML(name) + '</button>' : escapeHTML(name);
      return '<tr' + (tag === cleanTag(selectedTag) ? ' class="selected"' : '') + '><td><div class="clan-cell">' + badgeImage(clan,'small') + '<div><div>' + clickable + '</div><div class="clan-tag">' + escapeHTML(tag || '-') + '</div></div></div></td>' + cells + '</tr>';
    }).join('');
    return '<div class="table-wrap"><table class="clan-th-table"><thead>' + header + '</thead><tbody>' + (rows || '<tr><td colspan="19">Data clan CWL belum tersedia.</td></tr>') + '</tbody></table></div>';
  }
  function renderCwl(data) {
    const selectedTag = cleanTag(firstValue(data.tag,data.clanTag,data.currentClan && data.currentClan.tag,data.currentClan && data.currentClan.clanTag,requestedCwlTag));
    data.selectedTag = selectedTag;
    const selectedClan = cwlClanFor(data,selectedTag);
    const currentClanIsSelected = data.currentClan && clanTag(data.currentClan) === selectedTag ? data.currentClan : null;
    const displayedClan = currentClanIsSelected || selectedClan;
    const roster = cwlRosterFor(data,selectedClan);
    const breakdown = cwlBreakdownFor(data,selectedClan,roster);
    const rosterSize = roster.length || number(firstValue(data.cwlRosterSize,selectedClan && selectedClan.cwlRosterSize));
    const max = Math.max.apply(null,[1].concat(breakdown.map(function(item) { return item.count; })));
    const breakdownHTML = breakdown.length ? breakdown.map(function(item) {
      return '<div class="th-row"><div class="th-label">TH' + item.th + '</div><div class="th-bar"><div class="th-bar-fill" style="width:' + Math.round(item.count / max * 100) + '%"></div></div><div class="th-count">' + formatNumber(item.count) + '</div></div>';
    }).join('') : '<div class="empty">Data TH CWL belum tersedia.</div>';
    const clanName = firstValue(displayedClan && displayedClan.name,displayedClan && displayedClan.clanName,'CWL');
    const clanLink = selectedTag ? '<button type="button" class="cwl-clan-link" onclick="openClan(\'' + escapeHTML(selectedTag) + '\')">' + escapeHTML(clanName) + '</button>' : '<div class="clan-name">' + escapeHTML(clanName) + '</div>';
    const roundsHTML = data.rounds.map(function(round,index) { return renderCwlRound(round,index + 1,selectedTag); }).join('');
    const clanTableHTML = renderClanTownHallTable(data.clans,selectedTag);
    document.getElementById('cwlContent').innerHTML =
      '<div class="clan-header"><div class="clan-name">' + clanLink + '</div><div class="clan-tag">' + escapeHTML(selectedTag || '-') + '</div><div class="clan-meta"><div class="meta">CWL Rounds<strong>7</strong></div><div class="meta">Peserta CWL<strong>' + formatNumber(rosterSize) + ' Player</strong></div><div class="meta">Season<strong>' + escapeHTML(firstValue(data.season,'-')) + '</strong></div></div></div>' +
      '<section class="section"><div class="section-head"><div class="section-title">Town Hall Breakdown</div>' + (selectedTag ? '<button type="button" class="cwl-clan-link" onclick="openClan(\'' + escapeHTML(selectedTag) + '\')">' + escapeHTML(clanName) + '</button>' : '') + '</div><div class="th-breakdown">' + breakdownHTML + '</div></section>' +
      '<section class="section"><div class="section-head"><div class="section-title">Komposisi Town Hall</div></div>' + clanTableHTML + '</section>' +
      '<section class="section"><div class="section-head"><div class="section-title">CWL Battle Rounds</div><div class="section-value">7 Rounds</div></div>' + roundsHTML + '</section>';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.getElementById('searchInput').addEventListener('keydown',function(event) {
    if (event.key === 'Enter') searchData();
  });
  setMode('player');
  </script>
</body>
</html>
