/* ============================================================
   CWL HELPERS
============================================================ */

function clanTag(clan) {

  return cleanTag(
    firstValue(
      clan && clan.tag,
      clan && clan.clanTag
    )
  );

}


function cwlClanFor(
  data,
  tag
) {

  const wanted =
    cleanTag(tag);

  return asArray(
    data.clans
  ).find(
    function(clan) {

      return (
        clanTag(clan) === wanted
      );

    }
  ) || null;

}


function normalizeCwl(raw) {

  const data =
    raw || {};

  const sourceRounds =
    asArray(
      firstValue(
        data.rounds,
        data.cwlRounds
      )
    );


  return Object.assign(
    {},
    data,
    {

      currentClan:
        firstValue(
          data.currentClan,
          data.clan,
          null
        ),

      clans:
        asArray(data.clans),

      cwlRoster:
        asArray(data.cwlRoster),

      cwlRosterSize:
        number(
          data.cwlRosterSize
        ),

      rounds:
        Array.from(
          {
            length:7
          },
          function(_,index) {

            const round =
              sourceRounds[index] ||
              {};

            return Object.assign(
              {
                roundNumber:
                  index + 1,

                wars:[],

                targetWar:null
              },
              round
            );

          }
        )

    }
  );

}


function breakdownEntries(source) {

  if (Array.isArray(source)) {

    return source.map(
      function(item) {

        return {

          th:
            number(
              firstValue(
                item &&
                item.townHallLevel,

                item &&
                item.townhallLevel,

                item &&
                item.th,

                item &&
                item.level
              )
            ),

          count:
            number(
              firstValue(
                item &&
                item.count,

                item &&
                item.total,

                item &&
                item.members
              )
            )

        };

      }
    );

  }


  if (
    source &&
    typeof source === 'object'
  ) {

    return Object.keys(source)
      .map(
        function(key) {

          const value =
            source[key];

          return {

            th:
              number(
                String(key)
                  .replace(
                    /[^0-9]/g,
                    ''
                  )
              ),

            count:
              number(
                typeof value === 'object'
                  ? firstValue(
                      value.count,
                      value.total,
                      value.members
                    )
                  : value
              )

          };

        }
      );

  }


  return [];

}


function nonZeroBreakdown(
  entries
) {

  const grouped = {};


  entries.forEach(
    function(item) {

      if (
        number(item.th) > 0 &&
        number(item.count) > 0
      ) {

        grouped[number(item.th)] =
          (
            grouped[number(item.th)] ||
            0
          ) +
          number(item.count);

      }

    }
  );


  return Object.keys(grouped)
    .map(
      function(th) {

        return {
          th:number(th),
          count:grouped[th]
        };

      }
    )
    .sort(
      function(a,b) {

        return b.th - a.th;

      }
    );

}


function rosterBreakdown(
  roster
) {

  return nonZeroBreakdown(
    asArray(roster)
      .map(
        function(member) {

          return {

            th:
              number(
                firstValue(
                  member.townHallLevel,
                  member.townhallLevel,
                  member.townHall
                )
              ),

            count:1

          };

        }
      )
  );

}


function cwlRosterFor(
  data,
  selectedClan
) {

  if (
    asArray(
      data.cwlRoster
    ).length
  ) {

    return asArray(
      data.cwlRoster
    );

  }


  if (
    selectedClan &&
    asArray(
      selectedClan.cwlRoster
    ).length
  ) {

    return asArray(
      selectedClan.cwlRoster
    );

  }


  return [];

}


function cwlBreakdownFor(
  data,
  selectedClan,
  roster
) {

  const rootBreakdown =
    nonZeroBreakdown(
      breakdownEntries(
        data.cwlTownHallBreakdown
      )
    );


  if (rootBreakdown.length) {
    return rootBreakdown;
  }


  const rosterDerived =
    rosterBreakdown(
      roster
    );


  if (rosterDerived.length) {
    return rosterDerived;
  }


  const candidates = [

    data.currentClan &&
    clanTag(data.currentClan) ===
      data.selectedTag
      ? data.currentClan.cwlTownHallBreakdown
      : null,

    selectedClan &&
      selectedClan.cwlTownHallBreakdown,

    selectedClan &&
      selectedClan.townHallBreakdown

  ];


  for (
    let index = 0;
    index < candidates.length;
    index += 1
  ) {

    const breakdown =
      nonZeroBreakdown(
        breakdownEntries(
          candidates[index]
        )
      );

    if (breakdown.length) {
      return breakdown;
    }

  }


  return [];

}


/* ============================================================
   CWL WAR
============================================================ */

function warIncludesClan(
  war,
  tag
) {

  if (!war) {
    return false;
  }

  const wanted =
    cleanTag(tag);


  const direct = [

    war.target,
    war.enemy,
    war.clan,
    war.opponent

  ].some(
    function(side) {

      return (
        clanTag(side) ===
        wanted
      );

    }
  );


  const sides =
    asArray(
      firstValue(
        war.clans,
        war.sides
      )
    );


  return (
    direct ||
    sides.some(
      function(side) {

        return (
          clanTag(side) ===
          wanted
        );

      }
    )
  );

}


function warForRound(
  round,
  tag
) {

  /*
   * Worker mengirim war ronde ini di round.war.
   */

  if (
    warIncludesClan(
      round.war,
      tag
    )
  ) {

    return round.war;

  }


  if (
    warIncludesClan(
      round.targetWar,
      tag
    )
  ) {

    return round.targetWar;

  }


  return asArray(
    firstValue(
      round.wars,
      round.matches
    )
  ).find(
    function(war) {

      return warIncludesClan(
        war,
        tag
      );

    }
  ) || null;

}


function sidesForWar(
  war,
  tag
) {

  const wanted =
    cleanTag(tag);


  if (
    war.target &&
    war.enemy &&
    clanTag(war.target) ===
      wanted
  ) {

    return {
      mine:war.target,
      enemy:war.enemy
    };

  }


  if (
    war.target &&
    war.enemy &&
    clanTag(war.enemy) ===
      wanted
  ) {

    return {
      mine:war.enemy,
      enemy:war.target
    };

  }


  const sides =
    asArray(
      firstValue(
        war.clans,
        war.sides,

        war.clan &&
        war.opponent
          ? [
              war.clan,
              war.opponent
            ]
          : []
      )
    );


  const mine =
    sides.find(
      function(side) {

        return (
          clanTag(side) ===
          wanted
        );

      }
    );


  const enemy =
    sides.find(
      function(side) {

        return (
          clanTag(side) !==
          wanted
        );

      }
    );


  return (
    mine &&
    enemy
  )
    ? {
        mine:mine,
        enemy:enemy
      }
    : null;

}


function scoreFor(side) {

  return (
    formatNumber(
      firstValue(
        side.stars,
        side.starCount,
        side.clanStars
      )
    ) +
    ' ★ · ' +
    formatNumber(
      firstValue(
        side.destructionPercentage,
        side.destruction
      )
    ) +
    '%'
  );

}

============================================================ */

function cwlStateLabel(state) {

  const key =
    String(state || '').toLowerCase();

  if (key === 'preparation') {
    return 'Persiapan';
  }

  if (key === 'inwar') {
    return 'Sedang perang';
  }

  if (key === 'warended') {
    return 'Selesai';
  }

  return state
    ? String(state)
    : 'War';

}


function warAttacksUsed(side) {

  return asArray(side.members).reduce(
    function(total,member) {

      return total + asArray(
        member && member.attacks
      ).length;

    },
    0
  );

}


function warResult(mine,enemy) {

  const myStars =
    number(mine.stars);

  const enemyStars =
    number(enemy.stars);

  if (myStars !== enemyStars) {

    return myStars > enemyStars
      ? 'win'
      : 'lose';

  }

  const myDestruction =
    number(mine.destructionPercentage);

  const enemyDestruction =
    number(enemy.destructionPercentage);

  if (myDestruction !== enemyDestruction) {

    return myDestruction > enemyDestruction
      ? 'win'
      : 'lose';

  }

  return 'draw';

}


function warSideHTML(
  side,
  total,
  alignRight
) {

  const name =
    firstValue(
      side.name,
      side.clanName,
      '-'
    );

  return `

function renderCwlRound(
  round,

  selectedTag
) {

  const war =
    warForRound(
      round,
      selectedTag
    );


  const numberRound =
    number(
      firstValue(

      )
    ) || index;


  if (!war) {

      round.unavailable
        ? 'Gagal dimuat, coba cek lagi'

          </div>

          </div>

          <div class="round-status">
            Data war tidak cocok dengan clan ini

      firstValue(

  let chipClass = 'live';

/* ============================================================
   WAR LOG (Classic War)
   Data dari /warlog di Worker. War log hanya berisi ringkasan
   hasil perang, bukan daftar peserta atau serangan pemain.
============================================================ */

let currentWarLog = null;
let currentWarState = null;
let warLogError = null;
let warLogFilter = 'all';
let warLogSort = 'newest';
let warLogPage = 1;

const WARLOG_FILTERS = [
  { key:'all',  label:'Semua' },
  { key:'win',  label:'Menang' },
  { key:'lose', label:'Kalah' },
  { key:'tie',  label:'Seri' }
];


/* Nilai kosong tetap null ("-" di UI). Jangan diubah menjadi 0. */
function warArchiveCount(value) {
  if (Array.isArray(value)) return value.length;
  return nullableNumber(value);
}

function normalizeArchivedWarSide(side, fallbackTag, fallbackName) {
  const source = side || {};
  const tag = cleanTag(firstValue(source.tag, source.clanTag, fallbackTag));
  const members = Array.isArray(source.members) ? source.members : null;
  return {
    tag: tag || null,
    name: firstValue(source.name, source.clanName, fallbackName),
    badgeUrls: firstValue(source.badgeUrls, source.iconUrls, source.badge),
    clanLevel: nullableNumber(firstValue(source.clanLevel, source.level)),
    stars: nullableNumber(firstValue(source.stars, source.clanStars)),
    destructionPercentage: nullableNumber(firstValue(source.destructionPercentage, source.destruction)),
    attacks: warArchiveCount(source.attacks),
    expEarned: nullableNumber(firstValue(source.expEarned, source.exp_earned)),
    memberCount: members ? members.length : nullableNumber(firstValue(source.memberCount, source.members))
  };
}

function normalizeArchivedWarItem(item, requestedTag) {
  const source = item || {};
  const state = String(firstValue(source.state, '')).toLowerCase();
  const warType = String(firstValue(source.type, source.warType, source.war_type, '')).toLowerCase();
  /* ClashKing/CoC menandai CWL dengan WarTag (field tag); pisahkan dari Classic War. */
  const isCwl = Boolean(
    source.tag || source.warTag || source.war_tag ||
    source.leagueGroup || source.league_group ||
    warType === 'cwl' || warType === 'league'
  );
  if (isCwl) return null;
  /* Perang yang belum selesai bukan riwayat dan hasilnya belum final. */
  if (state === 'inwar' || state === 'preparation') return null;

  const clan = normalizeArchivedWarSide(source.clan || source.home || source.ourClan, requestedTag, 'Klan');
  const opponent = normalizeArchivedWarSide(source.opponent || source.enemy || source.away, firstValue(source.opponentTag), firstValue(source.opponentName, 'Lawan'));
  const endMs = historyTimeMs(firstValue(source.endTime, source.end_time, source.endDate, source.date, source.time, source.startTime));

  let result = String(firstValue(source.result, source.outcome, '')).toLowerCase();
  result = { won: 'win', victory: 'win', lost: 'lose', loss: 'lose', defeat: 'lose', draw: 'tie', tied: 'tie' }[result] || result;
  if (!['win', 'lose', 'tie'].includes(result)) {
    if (clan.stars !== null && opponent.stars !== null && clan.stars !== opponent.stars) {
      result = clan.stars > opponent.stars ? 'win' : 'lose';
    } else if (clan.stars !== null && opponent.stars !== null && clan.destructionPercentage !== null && opponent.destructionPercentage !== null) {
      result = clan.destructionPercentage > opponent.destructionPercentage ? 'win'
        : clan.destructionPercentage < opponent.destructionPercentage ? 'lose' : 'tie';
    } else {
      result = 'unknown';
    }
  }

  return {
    result,
    endTime: endMs === null ? null : new Date(endMs).toISOString(),
    teamSize: nullableNumber(firstValue(source.teamSize, source.team_size, source.size)) || null,
    attacksPerMember: nullableNumber(firstValue(source.attacksPerMember, source.attacks_per_member)) || null,
    clan,
    opponent,
    archiveSource: true
  };
}

/* Isi field kosong sebuah sisi dari sisi yang sama di sumber lain. */
function fillWarSide(target, extra) {
  ['name', 'tag', 'badgeUrls'].forEach(function(key) {
    if (!target[key] && extra[key]) target[key] = extra[key];
  });
  ['clanLevel', 'attacks', 'expEarned', 'memberCount'].forEach(function(key) {
    /* official log memakai 0 untuk level yang tidak ada */
    const missing = target[key] === null || target[key] === undefined || (key === 'clanLevel' && !target[key]);
    if (missing && extra[key] !== null && extra[key] !== undefined && !(key === 'clanLevel' && !extra[key])) {
      target[key] = extra[key];
    }
  });
}

function findSameWar(list, war) {
  const endMs = historyTimeMs(war.endTime);
  const opponentTag = cleanTag(war.opponent && war.opponent.tag);
  for (const candidate of list) {
    const candidateMs = historyTimeMs(candidate.endTime);
    const candidateTag = cleanTag(candidate.opponent && candidate.opponent.tag);
    if (opponentTag && candidateTag) {
      if (opponentTag !== candidateTag) continue;
      /* Waktu selesai dari dua sumber boleh berbeda beberapa detik. */
      if (endMs === null || candidateMs === null || Math.abs(endMs - candidateMs) <= 120000) return candidate;
    } else if (endMs !== null && candidateMs !== null && endMs === candidateMs
      && String(war.opponent && war.opponent.name || '') === String(candidate.opponent && candidate.opponent.name || '')) {
      return candidate;
    }
  }
  return null;
}

function mergeWarLogSources(officialRaw, archiveRaw, tag) {
  const official = normalizeWarLogData(officialRaw || { tag, wars: [] });
  /* Worker membungkus arsip sebagai { archive: { items } }. */
  const archiveBody = archiveRaw && !Array.isArray(archiveRaw) && archiveRaw.archive ? archiveRaw.archive : archiveRaw;
  const archiveItems = Array.isArray(archiveBody)
    ? archiveBody
    : asArray(archiveBody && archiveBody.items).length ? archiveBody.items : asArray(archiveBody && archiveBody.wars);
  const combined = official.wars.slice();
  let added = 0;
  let enriched = 0;
  archiveItems.forEach(function(item) {
    const war = normalizeArchivedWarItem(item, tag);
    if (!war) return;
    const match = findSameWar(combined, war);
    if (match) {
      const before = JSON.stringify([match.clan, match.opponent]);
      fillWarSide(match.clan, war.clan);
      fillWarSide(match.opponent, war.opponent);
      if (!match.teamSize && war.teamSize) match.teamSize = war.teamSize;
      if (!match.attacksPerMember && war.attacksPerMember) match.attacksPerMember = war.attacksPerMember;
      if (before !== JSON.stringify([match.clan, match.opponent])) enriched += 1;
      return;
    }
    combined.push(war);
    added += 1;
  });
  combined.sort(function(a, b) {
    return (historyTimeMs(b.endTime) || 0) - (historyTimeMs(a.endTime) || 0);
  });
  return {
    tag: official.tag || cleanTag(tag),
    wars: combined,
    hiddenCwl: official.hiddenCwl || 0,
    hasMore: official.hasMore || Boolean(archiveBody && archiveBody.hasMore),
    archiveCount: archiveItems.length,
    archiveAdded: added,
    archiveEnriched: enriched,
    archivePartial: Boolean(archiveBody && archiveBody.partial),
    officialCount: official.wars.length
  };
}


function normalizeWarLogData(raw) {

  const data =
    raw || {};

  return {
    tag:
      cleanTag(data.tag),

    wars:
      asArray(data.wars),

    hiddenCwl:
      number(data.hiddenCwl),

    hasMore:
      Boolean(data.hasMore)
  };

}


async function loadWarLog(tag) {

  mode = 'warlog';

  lastLoad = { fn:loadWarLog, tag:tag };

  setMode('warlog');

  setLoading();

  /* Riwayat dan perang berlangsung diambil bersamaan. */

  const results =
    await Promise.allSettled([
      api('warlog', tag),
      api('currentwar', tag),
      api('warhistory', tag)
    ]);

  const logFail =
    results[0].status === 'rejected'
      ? results[0].reason
      : null;

  const currentFail =
    results[1].status === 'rejected'
      ? results[1].reason
      : null;

  const archiveFail =
    results[2].status === 'rejected'
      ? results[2].reason
      : null;

  if (
    (logFail && logFail.code === 'superseded') ||
    (currentFail && currentFail.code === 'superseded')
  ) {
    return;
  }

  /* Dua-duanya gagal (misalnya war log privat) -> satu pesan. */

  if (logFail && currentFail && archiveFail) {

    handleLoadError(
      logFail.code === 'private'
        ? logFail
        : currentFail.code === 'private'
          ? currentFail
          : logFail
    );

    return;

  }

  currentWarLog =
    !logFail
      ? mergeWarLogSources(results[0].value,archiveFail?null:results[2].value,tag)
      : !archiveFail
        ? mergeWarLogSources(null,results[2].value,tag)
        : null;

  currentWarState = {
    data:
      currentFail
        ? null
        : normalizeCurrentWarData(
            results[1].value
          ),

    error:
      currentFail
        ? currentFail.message
        : null
  };

  warLogError =
    logFail && archiveFail
      ? logFail.message + ' | Arsip tambahan: ' + archiveFail.message
      : null;

  warLogFilter = 'all';
  warLogSort = 'newest';
  warLogPage = 1;

  if (currentWarLog && archiveFail) {
    currentWarLog.archiveError = archiveFail.message || 'tidak diketahui';
  }

  renderWarLog(
    currentWarLog
  );

}


function warLogCounts(wars) {

  const counts = {
    win:0,
    lose:0,
    tie:0,
    unknown:0
  };

  wars.forEach(
    function(war) {

      if (counts[war.result] !== undefined) {
        counts[war.result] += 1;
      } else {
        counts.unknown += 1;
      }

    }
  );

  return counts;

}


function warLogDate(iso) {

  if (!iso) {
    return 'Waktu tidak tersedia';
  }

  const date =
    new Date(iso);

  if (Number.isNaN(date.getTime())) {
    return 'Waktu tidak tersedia';
  }

  return date.toLocaleString(
    'id-ID',
    {
      day:'numeric',
      month:'short',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


function warLogPercent(value) {

  return (
    Number(
      number(value).toFixed(2)
    ) + '%'
  );

}

function warLogDetailHTML(war) {

  const mine =
    war.clan || {};

  const enemy =
    war.opponent || {};

  /* Tiap sisi dibaca dari strukturnya sendiri. Nilai yang tidak ada
     ditampilkan "-" dan tidak diganti dengan data sisi lain. */
  const rows = [];

  const dash = function(value) {
    return value === null || value === undefined || value === '' ? '-' : String(value);
  };

  const percentText = function(side) {
    return nullableNumber(side.destructionPercentage) === null
      ? '-'
      : warLogPercent(side.destructionPercentage);
  };

  const starsText = function(side) {
    return dash(nullableNumber(side.stars));
  };

  const maxAttacks =
    number(war.teamSize) * number(war.attacksPerMember);

  const attacksText = function(side) {
    const used = nullableNumber(side.attacks);
    if (used === null) {
      return '-';
    }
    return maxAttacks ? used + '/' + maxAttacks : String(used);
  };

  const levelOf = function(side) {
    const level = nullableNumber(side.clanLevel);
    return level ? level : null;
  };

  const known = function(a, b) {
    return (a !== null && a !== undefined) || (b !== null && b !== undefined);
  };

  rows.push(['Clan tag', dash(mine.tag), dash(enemy.tag)]);
  rows.push(['Bintang', starsText(mine), starsText(enemy)]);
  rows.push(['Destruction', percentText(mine), percentText(enemy)]);

  if (known(nullableNumber(mine.attacks), nullableNumber(enemy.attacks))) {
    rows.push(['Serangan', attacksText(mine), attacksText(enemy)]);
  }

  if (known(levelOf(mine), levelOf(enemy))) {
    rows.push(['Level clan', dash(levelOf(mine)), dash(levelOf(enemy))]);
  }

  if (known(nullableNumber(mine.expEarned), nullableNumber(enemy.expEarned))) {
    rows.push([
      'XP clan didapat',
      nullableNumber(mine.expEarned) === null ? '-' : formatNumber(mine.expEarned),
      nullableNumber(enemy.expEarned) === null ? '-' : formatNumber(enemy.expEarned)
    ]);
  }

  if (known(nullableNumber(mine.memberCount), nullableNumber(enemy.memberCount))) {
    rows.push(['Jumlah anggota', dash(nullableNumber(mine.memberCount)), dash(nullableNumber(enemy.memberCount))]);
  }

  const mineName =
    firstValue(mine.name,'Clan');

  const enemyName =
    firstValue(enemy.name,'Lawan');

  return `
    <details class="roster-details">

      <summary class="war-detail-button">Detail</summary>

      <div class="wl-table">

        <div class="wl-h"></div>
        <div class="wl-h">${warClanLinkHTML(mine,mineName)}</div>
        <div class="wl-h">${warClanLinkHTML(enemy,enemyName)}</div>

        ${rows.map(
          function(row) {

            return `
              <div class="wl-l">${escapeHTML(row[0])}</div>
              <div>${escapeHTML(row[1])}</div>
              <div>${escapeHTML(row[2])}</div>
            `;

          }
        ).join('')}

      </div>

    </details>
  `;

}

function visibleWarLog() {

  const wars =
    currentWarLog
      ? currentWarLog.wars.slice()
      : [];

  const filtered =
    warLogFilter === 'all'
      ? wars
      : wars.filter(
          function(war) {
            return war.result === warLogFilter;
          }
        );

  filtered.sort(
    function(a,b) {

      const diff =
        String(a.endTime || '')
          .localeCompare(
            String(b.endTime || '')
          );

      return warLogSort === 'oldest'
        ? diff
        : -diff;

    }
  );

  return filtered;

}


function renderWarLogList() {

  const list =
    document.getElementById('warlogList');

  if (!list) {
    return;
  }

  const filtered =
    visibleWarLog();

  const pageSize = 100;

  const totalPages =
    Math.max(1, Math.ceil(filtered.length / pageSize));

  warLogPage =
    Math.min(totalPages, Math.max(1, Number(warLogPage) || 1));

  const visible =
    filtered.slice(
      (warLogPage - 1) * pageSize,
      warLogPage * pageSize
    );

  const pager =
    document.getElementById('warlogPager');

  if (pager) {
    pager.innerHTML =
      totalPages > 1
        ? '<div class="history-pagination">' +
            '<button type="button" ' + (warLogPage <= 1 ? 'disabled ' : '') +
              'onclick="setWarLogPage(' + (warLogPage - 1) + ')">Sebelumnya</button>' +
            '<span>' + ((warLogPage - 1) * pageSize + 1) + '-' +
              Math.min(warLogPage * pageSize, filtered.length) +
              ' dari ' + filtered.length + '</span>' +
            '<button type="button" ' + (warLogPage >= totalPages ? 'disabled ' : '') +
              'onclick="setWarLogPage(' + (warLogPage + 1) + ')">Berikutnya</button>' +
          '</div>'
        : '';
  }

  list.innerHTML =
    visible.length
      ? visible.map(warLogCardHTML).join('')
      : `
        <div class="empty">
          Tidak ada perang dengan hasil ini.
        </div>
      `;

  const count =
    document.getElementById('warlogCount');

  if (count) {
    count.textContent =
      filtered.length + ' perang';
  }

  document
    .querySelectorAll('.wl-chip')
    .forEach(
      function(button) {

        button.classList.toggle(
          'active',
          button.dataset.filter === warLogFilter
        );

        button.setAttribute(
          'aria-pressed',
          button.dataset.filter === warLogFilter
            ? 'true'
            : 'false'
        );

      }
    );

}


function setWarLogPage(page) {

  warLogPage = Math.max(1, Number(page) || 1);

function normalizeCurrentWarData(raw) {

  const data =
    raw || {};

  return {
    state:
      data.state || 'notInWar',

    war:
      data.war || null
  };

}


function formatRemaining(ms) {

  if (ms <= 0) {
    return 'sebentar lagi';
  }

  const minutes =
    Math.floor(ms / 60000);

  const days =
    Math.floor(minutes / 1440);

  const hours =
    Math.floor((minutes % 1440) / 60);

  const mins =
    minutes % 60;

  const parts = [];

  if (days) {
    parts.push(days + ' hari');
  }

  if (hours) {
    parts.push(hours + ' jam');
  }

  if (!days && (mins || !hours)) {
    parts.push(
      (mins || 1) + ' menit'
    );
  }

  return parts.join(' ');

}


function currentWarTimingText(war) {

  const now =
    Date.now();

  const start =
    war.startTime
      ? new Date(war.startTime).getTime()
      : NaN;

  const end =
    war.endTime
      ? new Date(war.endTime).getTime()
      : NaN;

  if (
    war.state === 'preparation' &&
    !Number.isNaN(start)
  ) {

    return (
      'Perang dimulai dalam ' +
      formatRemaining(start - now) +
      ' · ' + warLogDate(war.startTime)
    );

  }

  if (
    war.state === 'inWar' &&
    !Number.isNaN(end)
  ) {

    return (
      'Berakhir dalam ' +
      formatRemaining(end - now) +
      ' · ' + warLogDate(war.endTime)
    );

  }

  if (
    war.state === 'warEnded' &&
    war.endTime
  ) {

    return (
      'Selesai ' +
      warLogDate(war.endTime)
    );

  }

  return '';

}

        </div>
        <div class="cw-player-th">TH ${escapeHTML(member.townHallLevel || '-')}</div>
        <div class="cw-player-position">Posisi ${escapeHTML(member.mapPosition || '-')}</div>
      </div>
      <div class="cw-defense-right">${defenseHTML}</div>
    </div>
  `;
}

function currentWarSectionHTML(current) {

  const title = `
    <div class="section-head">
      <div class="section-title">
        Perang Sedang Berlangsung
      </div>
      %CHIP%
    </div>
  `;

  if (!current) {
    return '';
  }

  if (current.error) {

    return `
      <section class="section">
        ${title.replace('%CHIP%','')}
        <div class="error-box">
          <strong>Perang berlangsung gagal dimuat</strong>
          <div>${escapeHTML(current.error)}</div>
          <button
            type="button"
            class="retry-btn"
            onclick="retryLastLoad()"
          >Coba lagi</button>
        </div>
      </section>
    `;

  }

  const data =
    current.data;

  if (
    !data ||
    data.state === 'notInWar' ||
    !data.war
  ) {

    return `
      <section class="section">
        ${title.replace('%CHIP%','')}
        <div class="empty">
          Klan ini sedang tidak dalam Classic War.
          Kalau sedang CWL, lihat di tab CWL.
        </div>
      </section>
    `;

  }

  const war =
    data.war;

  const chip =
    war.state === 'preparation'
      ? ['prep','Persiapan']
      : war.state === 'inWar'
        ? ['live','Sedang perang']
        : ['draw','Selesai'];

  const size =
    number(war.teamSize);

  const total =
    size * number(war.attacksPerMember);

  const timing =
    currentWarTimingText(war);

  const lists = [
    [war.clan,  'cw-mine'],
    [war.opponent, 'cw-enemy']
  ];

  return `
    <section class="section current-war-section">

      ${title.replace(
        '%CHIP%',
        `<div class="round-chip ${chip[0]}">${chip[1]}</div>`
      )}

      ${timing
        ? `<div class="wl-note cw-timing">${escapeHTML(timing)}</div>`
        : ''}

      <div class="war">

        ${currentWarSideHTML(war.clan,total,false)}

        <div class="vs">VS</div>

        ${currentWarSideHTML(war.opponent,total,true)}

      </div>

      <div class="war-foot">
        ${size ? size + ' vs ' + size + ' pemain · ' : ''}${number(war.attacksPerMember)} serangan/pemain
      </div>

      <details class="roster-details">
        <summary>Lihat daftar peserta</summary>
        ${warRosterComparisonHTML(war.clan,war.opponent)}
      </details>

    </section>
  `;

}


/* ============================================================
   LOAD CWL
============================================================ */

async function loadCwl(tag) {

  requestedCwlTag =
    cleanTag(tag);

  mode = 'cwl';

  lastLoad = { fn:loadCwl, tag:requestedCwlTag };

  setMode('cwl');

  setLoading();

  try {

    const results = await Promise.allSettled([
      api('cwl', requestedCwlTag),
      api('warlog', requestedCwlTag)
    ]);

    if (results[0].status === 'rejected') {
      throw results[0].reason;
    }

    currentCwl =
      normalizeCwl(results[0].value);

    const warLogArchive =
      results[1].status === 'fulfilled'
        ? results[1].value
        : null;

    renderCwl(currentCwl);

    renderCwlArchive(
      warLogArchive && warLogArchive.hiddenCwlEntries
        ? warLogArchive.hiddenCwlEntries
        : []
    );

  } catch (error) {

    handleLoadError(error);

  }

}



/* Arsip CWL yang terdeteksi pada war log klasik. Data ini hanya
   menyimpan tanggal/ukuran yang tersedia; hasil pertandingan tidak ditebak. */
function renderCwlArchive(entries) {
  const root = document.getElementById('cwlContent');
  if (!root || !Array.isArray(entries) || !entries.length) return;

  const grouped = new Map();
  entries.forEach(function(entry) {
    const date = entry && entry.endTime ? new Date(entry.endTime) : null;
    const valid = date && !Number.isNaN(date.getTime());
    const key = valid
      ? date.toLocaleDateString('id-ID', { month:'long', year:'numeric' })
      : 'Tanggal tidak tersedia';
    const item = grouped.get(key) || { label:key, count:0, dates:[] };
    item.count += 1;
    if (valid) item.dates.push(date);
    grouped.set(key, item);
  });

  const groups = Array.from(grouped.values()).map(function(item) {
    const countLabel = item.count + (item.count === 1 ? ' entri' : ' entri');
    return '<div class="meta"><strong>' + escapeHTML(item.label) +
      '</strong><span>' + countLabel +
      '</span><p>Arsip CWL terdeteksi dari war log. Detail hasil lama tidak tersedia dari data ini.</p></div>';
  }).join('');

  root.insertAdjacentHTML('beforeend',
    '<section class="section cwl-archive"><div class="section-head">' +
    '<div class="section-title">Arsip CWL Terdeteksi</div></div>' +
    '<div class="section-note">Label bulan/tahun dibuat hanya jika tanggal tersedia. Arsip ini bukan bukti hasil menang/kalah; API war log tidak memberikan detail hasil untuk entri tersebut.</div>' +
    '<div class="summary">' + groups + '</div></section>');
}


/* ============================================================
   CWL TH TABLE
============================================================ */

function cwlClansFromRounds(data) {

  const map = new Map();

  function addClan(clan) {

    if (!clan) {
      return;
    }

    const tag = clanTag(clan);

    if (!tag) {
      return;
    }

    const existing = map.get(tag) || {};
    const merged = Object.assign({}, existing, clan);

    if (
      !asArray(merged.cwlRoster).length &&
      asArray(clan.members).length
    ) {
      merged.cwlRoster = clan.members;
    }

    if (
      !asArray(merged.cwlRoster).length &&
      asArray(clan.memberList).length
    ) {
      merged.cwlRoster = clan.memberList;
    }

    if (
      !merged.cwlTownHallBreakdown &&
      merged.townHallBreakdown
    ) {
      merged.cwlTownHallBreakdown =
        merged.townHallBreakdown;
    }

    if (
      !merged.cwlTownHallBreakdown &&
      asArray(merged.cwlRoster).length
    ) {
      merged.cwlTownHallBreakdown =
        rosterBreakdown(merged.cwlRoster);
    }

    map.set(tag, merged);
  }

  asArray(data.clans).forEach(addClan);

  asArray(data.rounds).forEach(
    function(round) {

      const wars =
        asArray(
          firstValue(
            round.wars,
            round.matches
          )
        ).slice();

      if (round.targetWar) {
        wars.push(round.targetWar);
      }

      wars.forEach(
        function(war) {

          if (!war) {
            return;
          }

          addClan(war.target);
          addClan(war.enemy);
          addClan(war.clan);
          addClan(war.opponent);

          addClan(war.homeClan);
          addClan(war.awayClan);
          addClan(war.home);
          addClan(war.away);
          addClan(war.clan1);
          addClan(war.clan2);

          asArray(
            firstValue(
              war.clans,
              war.sides,
              war.teams
            )
          ).forEach(addClan);

        }
      );

    }
  );

  return Array.from(map.values());

}


function renderClanTownHallTable(
  clans,
  selectedTag
) {

  const towns =
    Array.from(
      {
        length:18
      },
      function(_,index) {

        return 18 - index;

      }
    );


  const header =
    '<tr>' +
    '<th>Clan</th>' +

    towns
      .map(
        function(th) {

          return `
            <th class="th-column">
              TH${th}
            </th>
          `;

        }
      )
      .join('') +

    '</tr>';


  const rows =
    asArray(clans)
      .map(
        function(clan) {

          const tag =
            clanTag(clan);

          const counts = {};


          let breakdown =
            nonZeroBreakdown(
              breakdownEntries(
                firstValue(
                  clan.cwlTownHallBreakdown,
                  clan.townHallBreakdown,
                  {}
                )
              )
            );


          if (
            !breakdown.length &&
            asArray(
              clan.cwlRoster
            ).length
          ) {

            breakdown =
              rosterBreakdown(
                clan.cwlRoster
              );

          }


          breakdown.forEach(
            function(entry) {

              counts[entry.th] =
                number(
                  entry.count
                );

            }
          );


          const cells =
            towns
              .map(
                function(th) {

                  return `
                    <td>
                      ${
                        counts[th]
                          ? formatNumber(
                              counts[th]
                            )
                          : '–'
                      }
                    </td>
                  `;

                }
              )
              .join('');


          const name =
            firstValue(
              clan.name,
              clan.clanName,
              '-'
            );


          const clickable =
            tag

              ? `
                <button
                  type="button"
                  class="cwl-clan-link"
                  onclick="openClan('${escapeHTML(tag)}')"
                >
                  ${escapeHTML(name)}
                </button>
              `

              : escapeHTML(name);


          return `

            <tr
              ${
                tag === cleanTag(selectedTag)
                  ? 'class="selected"'
                  : ''
              }
            >

              <td>

                <div class="clan-cell">

                  ${badgeImage(
                    clan,
                    'small'
                  )}

                  <div>

                    <div>
                      ${clickable}
                    </div>

                    <div class="clan-tag">
                      ${escapeHTML(
                        tag || '-'
                      )}
                    </div>

                  </div>

                </div>

              </td>

              ${cells}

            </tr>

          `;

        }
      )
      .join('');


  return `

    <div class="table-scroll-hint">
      Geser tabel ke kanan atau kiri untuk melihat TH lainnya
    </div>

    <div class="table-wrap">

      <table class="clan-th-table">

        <thead>
          ${header}
        </thead>

        <tbody>

          ${
            rows ||
            `
              <tr>
                <td colspan="19">
                  Data clan CWL belum tersedia.
                </td>
              </tr>
            `
          }

        </tbody>

      </table>

    </div>

  `;

}


/* ============================================================
   RENDER CWL
============================================================ */

function renderCwl(data) {

  const selectedTag =
    cleanTag(
      firstValue(
        data.tag,
        data.clanTag,

        data.currentClan &&
        data.currentClan.tag,

        data.currentClan &&
        data.currentClan.clanTag,

        requestedCwlTag
      )
    );


  data.selectedTag =
    selectedTag;


  if (
    !asArray(data.clans).length
  ) {

    document.getElementById(
      'cwlContent'
    ).innerHTML = `
      <div class="clan-header">

        <div class="clan-name">
          ${escapeHTML(selectedTag || 'CWL')}
        </div>

        <div class="empty">
          Clan ini sedang tidak mengikuti CWL
          (atau tag tidak ditemukan).
        </div>

      </div>
    `;

    return;

  }


  const selectedClan =
    cwlClanFor(
      data,
      selectedTag
    );


  const currentClanIsSelected =
    data.currentClan &&
    clanTag(data.currentClan) ===
      selectedTag

      ? data.currentClan
      : null;


  const displayedClan =
    currentClanIsSelected ||
    selectedClan;


  const roster =
    cwlRosterFor(
      data,
      selectedClan
    );


  const breakdown =
    cwlBreakdownFor(
      data,
      selectedClan,
      roster
    );


  const rosterSize =
    roster.length ||
    number(
      firstValue(
        data.cwlRosterSize,
        selectedClan &&
        selectedClan.cwlRosterSize
      )
    );


  const max =
    Math.max.apply(
      null,
      [1].concat(
        breakdown.map(
          function(item) {
            return item.count;
          }
        )
      )
    );


  const breakdownHTML =
    breakdown.length

      ? breakdown
          .sort(
            function(a,b) {
              return b.th - a.th;
            }
          )
          .map(
            function(item) {

              return `

                <div class="th-row">

                  <div class="th-label">
                    TH${item.th}
                  </div>

                  <div class="th-bar">

                    <div
                      class="th-bar-fill"
                      style="width:${Math.round(
                        item.count / max * 100
                      )}%"
                    ></div>

                  </div>

                  <div class="th-count">
                    ${formatNumber(
                      item.count
                    )}
                  </div>

                </div>

              `;

            }
          )
          .join('')

      : `
        <div class="empty">
          Data TH CWL belum tersedia.
        </div>
      `;


  /*
   * Daftar pemain yang ikut CWL (roster CWL),
   * diurutkan TH tertinggi dulu.
   */

  const rosterSorted =
    roster
      .slice()
      .sort(
        function(a,b) {

          return (
            number(b.townHallLevel) -
            number(a.townHallLevel) ||
            compareText(a.name,b.name)
          );

        }
      );

  const rosterListHTML =
    rosterSorted.length

      ? `
        <details class="roster-details">

          <summary>
            Lihat daftar peserta
            (${rosterSorted.length})
          </summary>

          <div class="roster-list">

            ${rosterSorted.map(
              function(member,i) {

                return `
                  <button
                    type="button"
                    class="roster-row"
                    data-player-tag="${escapeHTML(cleanTag(member.tag))}"
                  >

                    <span class="roster-no">
                      ${i + 1}
                    </span>

                    <span class="roster-name">
                      ${escapeHTML(member.name)}
                      <small>
                        ${escapeHTML(member.tag)}
                      </small>
                    </span>

                    <span class="member-th">
                      TH ${escapeHTML(
                        member.townHallLevel || '-'
                      )}
                    </span>

                  </button>
                `;

              }
            ).join('')}

          </div>

        </details>
      `

      : '';


  const clanName =
    firstValue(
      displayedClan &&
      displayedClan.name,

      displayedClan &&
      displayedClan.clanName,

      'CWL'
    );


  const clanLink =
    selectedTag

      ? `
        <button
          type="button"
          class="cwl-clan-link"
          onclick="openClan('${escapeHTML(selectedTag)}')"
        >
          ${escapeHTML(clanName)}
        </button>
      `

      : `
        <div class="clan-name">
          ${escapeHTML(clanName)}
        </div>
      `;


  const roundsHTML =
    data.rounds
      .map(
        function(round,index) {

          return renderCwlRound(
            round,
            index + 1,
            selectedTag
          );

        }
      )
      .join('');


  const cwlClans =
    cwlClansFromRounds(
      data
    );

  const clanTableHTML =
    renderClanTownHallTable(
      cwlClans,
      selectedTag
    );

  const rosterNotes = {
    leaguegroup:
      'Berdasarkan pemain yang didaftarkan untuk CWL, bukan member clan saat ini.',
    snapshot:
      'Berdasarkan arsip daftar pemain CWL musim ini.',
    wars:
      'Perkiraan dari data war (daftar pendaftaran CWL belum tersedia).',
    none:
      'Daftar pemain CWL belum tersedia.'
  };

  const rosterNoteHTML = `
    <div class="section-note">
      ${escapeHTML(
        rosterNotes[data.rosterSource] ||
        rosterNotes.leaguegroup
      )}
    </div>
  `;


  document.getElementById(
    'cwlContent'
  ).innerHTML = `

    <div class="clan-header">

      <div class="clan-name">
        ${clanLink}
      </div>

      <div class="clan-tag">
        ${escapeHTML(
          selectedTag || '-'
        )}
      </div>


      <div class="clan-meta">

        <div class="meta">

          Peserta CWL

          <strong>
            ${formatNumber(
              rosterSize
            )} Player
          </strong>

        </div>


        <div class="meta">

          Season

          <strong>
            ${escapeHTML(
              firstValue(
                data.season,
                '-'
              )
            )}
          </strong>

        </div>

      </div>

    </div>


    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Town Hall Breakdown
        </div>

        ${
          selectedTag
            ? `
              <button
                type="button"
                class="cwl-clan-link"
                onclick="openClan('${escapeHTML(selectedTag)}')"
              >
                ${escapeHTML(clanName)}
              </button>
            `
            : ''
        }

      </div>


      ${rosterNoteHTML}

      <div class="th-breakdown">
        ${breakdownHTML}
      </div>

      ${rosterListHTML}

    </section>


    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Komposisi Town Hall
        </div>

      </div>

      ${rosterNoteHTML}

      ${clanTableHTML}

    </section>


    <section class="section">

      <div class="section-head">

        <div class="section-title">
          CWL Battle Rounds
        </div>

        <div class="section-value">
          7 Rounds
        </div>

      </div>

      ${roundsHTML}

    </section>

  `;


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

/* ============================================================
   MUSIM (season.json)
   Ganti hero / background / warna tiap bulan cukup lewat
   season.json. Kalau file tidak ada atau rusak, tampilan
   bawaan tetap dipakai.
============================================================ */

function applySeason(season) {

  if (
    !season ||
    typeof season !== 'object'
  ) {
    return;
  }

  const root =
    document.documentElement.style;

  if (
    season.heroes &&
    typeof season.heroes === 'object'
  ) {

    Object.assign(
      HERO_ASSET_INDEX,
      indexedAssets(season.heroes)
    );

  }

  const theme =
    season.theme || {};

  const names = {
    accent:'--accent',
    accent2:'--accent2',
    accent3:'--accent3',
    accentDark:'--accent-dark',
    gold:'--gold',
    gold2:'--gold2'
  };

  Object.keys(names).forEach(
    function(key) {

      if (
        typeof theme[key] === 'string' &&
        /^#[0-9a-f]{3,8}$/i.test(theme[key])
      ) {

        root.setProperty(
          names[key],
          theme[key]
        );

      }

    }
  );

  if (season.name) {

    const sub =
      document.querySelector('.brand-sub');

    if (sub) {

      const tag =
        document.createElement('span');

      tag.className = 'season-tag';

      tag.textContent =
        'Season · ' + season.name;

      sub.appendChild(tag);

    }

  }

  if (
    typeof season.background === 'string' &&
    season.background
  ) {

    const image = new Image();

    image.onload = function() {

      root.setProperty(
        '--season-bg',
        'url("' +
        encodeURI(season.background) +
        '")'
      );

      document.body.classList.add(
        'season-on'
      );

    };

    image.src = season.background;

  }

}


async function loadSeason() {

  try {

    const response =
      await fetch(
        'season.json',
        {
          cache:'no-cache'
        }
      );

  if (!response.ok) {
      return;
    }

    applySeason(
      await response.json()
    );

  } catch (_) {

    /* tanpa season.json: pakai tampilan bawaan */

  }

}
