<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarjana Checker</title>
  <meta name="description" content="Clash of Clans Player, Clan & CWL Analyzer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#edf3fb; --card:#ffffff; --card2:#e7effb; --text:#10233f; --muted:#52677f; --line:#b9c9dc; --accent:#123b83; --accent2:#0d5dc0; --green:#087950; --red:#bb1d36; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#dce8f8 0,#f6f9fd 36rem); color:var(--text); font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(100%,1400px); margin:0 auto; padding:24px 16px 32px; }
    .header {
      position:relative;
      display:flex;
      align-items:center;
      gap:13px;
      margin:4px 0 22px;
      padding:10px 14px 12px;
      border:1px solid rgba(18,59,131,.18);
      border-radius:16px;
      background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(235,243,253,.92));
      box-shadow:0 8px 24px rgba(24,57,99,.09);
      overflow:hidden;
    }
    .header::before {
      content:"";
      position:absolute;
      left:14px;
      right:14px;
      bottom:0;
      height:1px;
      background:linear-gradient(90deg,transparent,#c69a3a 20%,#123b83 50%,#c69a3a 80%,transparent);
      opacity:.75;
    }
    .header::after {
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      right:-70px;
      top:-90px;
      background:radial-gradient(circle,rgba(198,154,58,.16),transparent 68%);
      pointer-events:none;
    }
    .logo {
      position:relative;
      z-index:1;
      width:52px;
      height:52px;
      object-fit:contain;
      border-radius:13px;
      filter:drop-shadow(0 4px 7px rgba(18,59,131,.16));
    }
    .brand-title {
      position:relative;
      z-index:1;
      font-size:21px;
      font-weight:800;
      letter-spacing:-.4px;
      background:linear-gradient(90deg,#102f68,#123b83 55%,#8b6a2b);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .brand-sub {
      position:relative;
      z-index:1;
      color:var(--muted);
      font-size:11px;
      margin-top:2px;
      letter-spacing:.15px;
    }
    .search-panel,.section,.clan-header,.round { border:1px solid var(--line); background:var(--card); border-radius:16px; box-shadow:0 5px 16px rgba(24,57,99,.08); }
    .search-panel { padding:14px; margin-bottom:18px; }
    .switch { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
    .switch button,.search-btn,.sort-select { border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--text); min-height:38px; padding:8px 12px; font-weight:800; }
    .switch button.active,.search-btn { background:var(--accent); border-color:var(--accent); color:#fff; }
    .search-row { display:flex; gap:8px; }
    .search-row input { min-width:0; flex:1; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; }
    .hint { margin:8px 2px 0; color:var(--muted); font-size:11px; }
    .page { display:none; }
    .page.active { display:block; }
    .loading,.error-box,.empty { padding:20px; color:var(--muted); text-align:center; }
    .error-box { color:#7b1021; border:1px solid #e0aab4; border-radius:14px; background:#fff1f3; }
    .clan-header { padding:18px; margin-bottom:12px; }
    .clan-name { font-size:22px; font-weight:800; overflow-wrap:anywhere; }
    .clan-tag,.info-desc { color:var(--muted); font-size:12px; }
    .clan-description { color:var(--muted); margin-top:8px; }
    .clan-meta { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
    .meta { padding:9px; border-radius:10px; background:#eaf1fb; color:var(--muted); font-size:10px; }
    .meta strong { display:block; color:var(--text); font-size:14px; margin-top:2px; }
    .section { padding:15px; margin-bottom:12px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .section-title { font-weight:800; font-size:15px; }
    .section-value { color:var(--accent2); font-size:12px; font-weight:700; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .summary .meta { min-height:58px; }
    .hero-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .hero-group + .hero-group { margin-top:10px; }
    .hero-group-title { display:flex; align-items:center; gap:7px; margin:0 0 7px; padding:6px 9px; border-left:3px solid #c69a3a; border-radius:7px; background:#edf4fc; font-size:11px; font-weight:800; }
    .hero-group-title span { color:var(--muted); font-size:9px; font-weight:600; }
    .hero-card,.equipment-card { display:flex; align-items:center; gap:10px; min-width:0; padding:10px; border:1px solid var(--line); border-radius:12px; background:#f8fbff; }
    .hero-img { width:58px; height:58px; object-fit:contain; flex:0 0 auto; }
    .equipment-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .equipment-img { width:42px; height:42px; object-fit:contain; flex:0 0 auto; }
    .asset-failed { display:none; }
    .asset-placeholder { width:42px; min-height:42px; display:grid; place-items:center; flex:0 0 auto; border:1px dashed #6c82a1; border-radius:8px; color:var(--muted); font-size:8px; text-align:center; padding:3px; }
    .hero-card .asset-placeholder { width:58px; min-height:58px; }
    .asset-placeholder[hidden] { display:none; }
    .item-name { font-weight:800; overflow-wrap:anywhere; }
    .item-detail { color:var(--muted); font-size:11px; margin-top:2px; }
    .epic { color:#ffcd75; font-size:10px; font-weight:800; margin-top:2px; }
    .sort-control { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:700; }
    .sort-select { min-height:32px; color:var(--text); background:#fff; padding:5px 8px; font-size:11px; }
    .member-list { display:grid; gap:7px; }
    .member { width:100%; display:flex; align-items:center; gap:10px; text-align:left; color:var(--text); background:#f8fbff; border:1px solid var(--line); border-radius:11px; padding:10px; }
    .member:hover { border-color:var(--accent); }
    .member-rank { color:var(--accent2); font-weight:800; width:24px; }
    .member-info { flex:1; min-width:0; }
    .member-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
    .member-detail { color:var(--muted); font-size:11px; }
    .member-th { color:var(--accent2); font-weight:800; font-size:12px; }
    .role-leader { color:#ffd678; } .role-coleader { color:var(--accent2); } .role-elder { color:var(--green); }
    .cwl-clan-link { appearance:none; padding:0; border:0; background:transparent; color:var(--accent2); text-align:left; font:inherit; font-weight:800; }
    .cwl-clan-link:hover { text-decoration:underline; }
    .th-breakdown { display:grid; gap:8px; }
    .th-row { display:grid; grid-template-columns:43px 1fr 28px; align-items:center; gap:9px; font-size:12px; }
    .th-label,.th-count { font-weight:800; }
    .th-bar { height:9px; overflow:hidden; border-radius:8px; background:#d9e5f5; }
    .th-bar-fill { height:100%; min-width:2px; background:linear-gradient(90deg,var(--accent),#2386da); }
    .round { padding:13px; margin:8px 0; }
    .round-head,.war { display:flex; justify-content:space-between; gap:10px; }
    .round-title { font-weight:800; } .round-status { color:var(--muted); font-size:11px; }
    .war { align-items:center; margin-top:10px; }
    .war-side { width:calc(50% - 24px); } .war-side.right { text-align:right; }
    .war-name { font-weight:800; overflow-wrap:anywhere; } .war-score { color:var(--muted); font-size:11px; margin-top:2px; }
    .vs { color:var(--accent2); font-size:11px; font-weight:800; }
    .footer { color:#52677f; margin:22px 0 0; text-align:center; font-size:11px; }
    .footer a { color:var(--accent2); text-decoration:none; font-weight:800; }
    .player-name-row { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    .xp-bubble { display:inline-grid; place-items:center; min-width:44px; min-height:28px; padding:3px 8px; border-radius:999px; background:#d8eaff; border:1px solid #96bde8; color:#073c84; font-size:11px; font-weight:800; }
    .player-clan-link { display:flex; align-items:center; gap:10px; width:max-content; max-width:100%; margin-top:13px; padding:8px 10px; border:1px solid #9eb9d9; border-radius:11px; background:#edf5ff; color:#0b4d9f; font-weight:800; text-align:left; }
    .clan-badge { width:44px; height:44px; object-fit:contain; flex:0 0 auto; }
    .clan-badge.small { width:36px; height:36px; }
    .player-clan-copy { min-width:0; }
    .player-clan-copy strong,.player-clan-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .player-clan-copy span { color:var(--muted); font-size:11px; font-weight:600; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
    .clan-th-table { width:100%; min-width:0; table-layout:fixed; border-collapse:collapse; background:#fff; }
    .clan-th-table th,.clan-th-table td { padding:6px 3px; border-bottom:1px solid #d5e0ed; text-align:center; }
    .clan-th-table th { background:#123b83; color:#fff; font-size:10px; white-space:nowrap; }
    .clan-th-table th:first-child { width:210px; min-width:210px; text-align:left; }
    .clan-th-table td { color:#152c4c; font-weight:700; }
    .clan-th-table tbody tr:nth-child(even) { background:#f1f6fc; }
    .clan-th-table tbody tr.selected { background:#ccecff; }
    .clan-cell { display:flex; align-items:center; gap:6px; min-width:0; text-align:left; }
    .clan-cell .cwl-clan-link { color:#10233f; max-width:145px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .th-column { width:calc((100% - 210px) / 18); }
    @media (max-width:600px) { .app { padding-inline:10px; } .summary { grid-template-columns:repeat(2,1fr); } .clan-meta { grid-template-columns:repeat(3,1fr); } .section-head { align-items:flex-start; } .sort-control { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="logo" src="assets/logo/og-thumbnail.png" alt="Sarjana Checker" onerror="this.style.display='none'">
      <div><div class="brand-title">Sarjana Checker</div><div class="brand-sub">Clash of Clans Account Analyzer</div></div>
    </header>
    <section class="search-panel">
      <div class="switch">
        <button id="playerTab" class="active" type="button" onclick="setMode('player')">PLAYER</button>
        <button id="clanTab" type="button" onclick="setMode('clan')">CLAN</button>
        <button id="cwlTab" type="button" onclick="setMode('cwl')">CWL</button>
      </div>
      <div class="search-row">
        <input id="searchInput" type="text" autocomplete="off" placeholder="Masukkan Player Tag">
        <button class="search-btn" id="searchButton" type="button" onclick="searchData()">CHECK</button>
      </div>
      <div class="hint" id="searchHint">Contoh: #9UG9LJV8Y</div>
    </section>
    <main id="playerPage" class="page active"><div id="playerContent"></div></main>
    <main id="clanPage" class="page"><div id="clanContent"></div></main>
    <main id="cwlPage" class="page"><div id="cwlContent"></div></main>
    <footer class="footer">
      <div>Sarjana Checker · Clash of Clans Analyzer</div>
      <div>Custom Base Nama: <a href="https://mujib-syarif.basenama.workers.dev" target="_blank" rel="noopener noreferrer">BaseNama</a></div>
      <div>TikTok: <a href="https://tiktok.com/@mujib_syarif" target="_blank" rel="noopener noreferrer">@mujib_syarif</a></div>
    </footer>
  </div>
  <script>
  'use strict';
  const API_BASE = 'https://sarjana-checker-api.basenama.workers.dev';
  let mode = 'player';
  let currentClan = null;
  let currentCwl = null;
  let requestedCwlTag = '';
  let clanSort = 'role';
  /*
   * These are the exact paths present in the uploaded source.  The resolver
   * below normalizes API names only; it never guesses a new filename.
   */
  const HERO_ASSETS = {
    'barbarian king':'assets/heroes/AnimeFury_BK_01 .png',
    'archer queen':'assets/heroes/AnimeFury_AQ_01.png',
    'grand warden':'assets/heroes/AnimeFury_GW_01.png',
    'royal champion':'assets/heroes/AnimeFury_RC_02.png',
    'minion prince':'assets/heroes/AnimeFury_MP_01.png',
    'dragon duke':'assets/heroes/DD_AnimeFury.png',
    'battle machine':'assets/heroes/Hero_Skin_BM_Battle_Machine_of_the_North_3_shadow.png',
    'battle copter':'assets/heroes/BattleCopter_Boat_Pose03_NoShadow.png'
  };
  const EQUIPMENT_ASSETS = {
    'barbarian puppet':'assets/equipment/Hero_Equipment_BK_Barbarian_Puppet.png',
    'rage vial':'assets/equipment/Hero_Equipment_BK_Rage_Vial.png',
    'earthquake boots':'assets/equipment/Hero_Equipment_BK_Earthquake_Boots.png',
    'vampstache':'assets/equipment/Hero_Equipment_BK_Vampstache.png',
    'giant gauntlet':'assets/equipment/Hero_Equipment_BQ_Giant_Gauntlet.png',
    'spiky ball':'assets/equipment/Hero_Equipment_BK_Spiky_Ball.png',
    'snake bracelet':'assets/equipment/Hero_Equipment_BK_SnakeBracelet.png',
    'stick horse':'assets/equipment/HeroGear_BK_StickFireHorse.png',
    'archer puppet':'assets/equipment/Hero_Equipment_AQ_Archer_Puppet.png',
    'invisibility vial':'assets/equipment/Hero_Equipment_AQ_Invisibility_Vial.png',
    'giant arrow':'assets/equipment/Hero_Equipment_AQ_Giant_Arrow.png',
    'healer puppet':'assets/equipment/Hero_Equipment_AQ_Healer_Puppet.png',
    'frozen arrow':'assets/equipment/Hero_Equipment_AQ_Frozen_Arrow.png',
    'magic mirror':'assets/equipment/Hero_Equipment_AQ_Magic_Mirror.png',
    'action figure':'assets/equipment/Hero_Equipment_AQ_WWEActionFigure.png',
    'wwe action figure':'assets/equipment/Hero_Equipment_AQ_WWEActionFigure.png',
    'monolith arrow':'assets/equipment/Hero_Equipment_AQ_MonolithArrow.png',
    'eternal tome':'assets/equipment/Hero_Equipment_GW_Eternal_Tome.png',
    'life gem':'assets/equipment/Hero_Equipment_GW_Life_Gem.png',
    'rage gem':'assets/equipment/Hero_Equipment_GW_Rage_Gem.png',
    'healing tome':'assets/equipment/Hero_Equipment_GW_Healing_Tome.png',
    'fireball':'assets/equipment/Hero_Equipment_GW_Fireball.png',
    'lavaloon puppet':'assets/equipment/icon_gear_GW_LavaloonPuppet.png',
    'heroic torch':'assets/equipment/Hero_Equipment_GW_Heroic_Torch.png',
    'dark orb':'assets/equipment/Hero_Equipment_MP_DarkOrb.png',
    'henchman':'assets/equipment/Hero_Equipment_MP_Henchman.png',
    'power pump':'assets/equipment/Hero_Equipment_MP_PowerPump.png',
    'iron pants':'assets/equipment/HeroEquipment_MP_IronPants.png',
    'dark crown':'assets/equipment/HeroGear_MP_DarkCrown_2k.png',
    'meteor staff':'assets/equipment/Hero_Equipment_MP_Meteor_Staff.png',
    'royal gem':'assets/equipment/Hero_Equipment_RC_Royal_Gem.png',
    'seeking shield':'assets/equipment/Hero_Equipment_RC_Seeking_Shield.png',
    'hog rider doll':'assets/equipment/Hero_Equipment_RC_Hog_Rider_Doll.png',
    'haste vial':'assets/equipment/Hero_Equipment_RC_Haste_Vial.png',
    'frost flake':'assets/equipment/Hero_Equipment_rc_frost_flake.png',
    'electro boots':'assets/equipment/Hero_Equipment_RC_ElectroBoots.png',
    'rocket spear':'assets/equipment/HeroGear_RoyalChampion_RocketSpear_Equipment_03.png',
    'electro fangs':'assets/equipment/HG_DD_Electro_Fangs.png',
    'fire heart':'assets/equipment/HG_DD_Fire Heart.png',
    'flame blower':'assets/equipment/HG_DD_Flame Blower.png',
    'rocket backpack':'assets/equipment/HG_DD_Rocket_BackPack.png',
    'stun blast':'assets/equipment/HG_DD_StunBlast.png',
    'reverse card':'assets/equipment/HG_DD_reverse_card.png'
  };
  const EQUIPMENT_ALIASES = {
    'wweactionfigure':'wwe action figure',
    'actionfigure':'action figure',
    'lavaloon':'lavaloon puppet',
    'rocket spear equipment':'rocket spear'
  };
  const EPIC_EQUIPMENT = new Set(['giant gauntlet','spiky ball','snake bracelet','stick horse','giant arrow','magic mirror','action figure','wwe action figure','monolith arrow','fireball','heroic torch','dark orb','dark crown','meteor staff','rocket spear','electro fangs','fire heart','flame blower','rocket backpack','stun blast','reverse card']);
  /*
   * Town Hall caps retained from the uploaded source.  API values explicitly
   * labelled maxLevelForTownHall take precedence when the Worker supplies them.
   */
  const HOME_HERO_MAX = {
    4:{'barbarian king':1},5:{'barbarian king':1},6:{'barbarian king':1},
    7:{'barbarian king':10},8:{'barbarian king':20,'archer queen':10},
    9:{'barbarian king':30,'archer queen':30,'minion prince':10},
    10:{'barbarian king':40,'archer queen':40,'minion prince':20},
    11:{'barbarian king':50,'archer queen':50,'minion prince':30,'grand warden':20},
    12:{'barbarian king':65,'archer queen':65,'minion prince':40,'grand warden':40},
    13:{'barbarian king':75,'archer queen':75,'minion prince':50,'grand warden':50,'royal champion':25},
    14:{'barbarian king':85,'archer queen':85,'minion prince':60,'grand warden':60,'royal champion':30},
    15:{'barbarian king':90,'archer queen':90,'minion prince':70,'grand warden':65,'royal champion':40,'dragon duke':10},
    16:{'barbarian king':95,'archer queen':95,'minion prince':80,'grand warden':70,'royal champion':45,'dragon duke':15},
    17:{'barbarian king':100,'archer queen':100,'minion prince':90,'grand warden':75,'royal champion':50,'dragon duke':20},
    18:{'barbarian king':110,'archer queen':110,'minion prince':95,'grand warden':85,'royal champion':55,'dragon duke':25}
  };
  const BUILDER_HERO_MAX = {
    5:{'battle machine':5},6:{'battle machine':10},7:{'battle machine':20},
    8:{'battle machine':25,'battle copter':25},9:{'battle machine':30,'battle copter':30},
    10:{'battle machine':35,'battle copter':35}
  };
  const EQUIPMENT_TH_CAP = {
    8:{common:9,epic:12},9:{common:9,epic:12},10:{common:12,epic:15},
    11:{common:12,epic:15},12:{common:15,epic:18},13:{common:15,epic:18},
    14:{common:18,epic:21},15:{common:18,epic:24},16:{common:18,epic:27},
    17:{common:18,epic:27},18:{common:18,epic:27}
  };
  function firstValue() {
    for (let index = 0; index < arguments.length; index += 1) {
      const value = arguments[index];
      if (value !== undefined && value !== null && value !== '') return value;
    }
    return null;
  }
  function asArray(value) { return Array.isArray(value) ? value : []; }
  function number(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
  function formatNumber(value) { return number(value).toLocaleString('en-US'); }
  function cleanTag(value) {
    const tag = String(value || '').trim().toUpperCase();
    return tag && tag.charAt(0) !== '#' ? '#' + tag : tag;
  }
  function encodedTag(value) { return encodeURIComponent(cleanTag(value)); }
  function escapeHTML(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  function assetKey(value) {
    return String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/&/g,' and ').replace(/['\u2018\u2019]/g,'')
      .replace(/[_-]+/g,' ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function indexedAssets(source) {
    const index = {};
    Object.keys(source).forEach(function(key) { index[assetKey(key)] = source[key]; });
    return index;
  }
  const HERO_ASSET_INDEX = indexedAssets(HERO_ASSETS);
  const EQUIPMENT_ASSET_INDEX = indexedAssets(EQUIPMENT_ASSETS);
  function resolveAsset(index, name, aliases) {
    const key = assetKey(name);
    const alias = aliases && aliases[key] ? assetKey(aliases[key]) : key;
    return index[alias] || null;
  }
  function badgeUrl(clan) {
    const urls = clan && firstValue(clan.badgeUrls,clan.iconUrls,clan.badge);
    if (typeof urls === 'string') return urls;
    return firstValue(urls && urls.medium,urls && urls.large,urls && urls.small,'');
  }
  function badgeImage(clan, sizeClass) {
    const url = badgeUrl(clan);
    return url ? '<img class="clan-badge' + (sizeClass ? ' ' + sizeClass : '') + '" src="' + escapeHTML(url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  }
  function heroMaxFor(hero, player) {
    const apiCap = number(firstValue(hero.maxLevelForTownHall,hero.max_level_for_town_hall));
    if (apiCap) return apiCap;
    const key = assetKey(hero.name);
    if (key === 'battle machine' || key === 'battle copter') {
      const builderHall = number(firstValue(player.builderHallLevel,player.builderBaseLevel,player.builderHall));
      return number(BUILDER_HERO_MAX[builderHall] && BUILDER_HERO_MAX[builderHall][key]) || number(firstValue(hero.maxLevel,hero.max,hero.max_level));

      return '<div class="th-row"><div class="th-label">TH' + item.th + '</div><div class="th-bar"><div class="th-bar-fill" style="width:' + Math.round(item.count / max * 100) + '%"></div></div><div class="th-count">' + formatNumber(item.count) + '</div></div>';
    }).join('') : '<div class="empty">Data TH CWL belum tersedia.</div>';
    const clanName = firstValue(displayedClan && displayedClan.name,displayedClan && displayedClan.clanName,'CWL');
    const clanLink = selectedTag ? '<button type="button" class="cwl-clan-link" onclick="openClan(\'' + escapeHTML(selectedTag) + '\')">' + escapeHTML(clanName) + '</button>' : '<div class="clan-name">' + escapeHTML(clanName) + '</div>';
    const roundsHTML = data.rounds.map(function(round,index) { return renderCwlRound(round,index + 1,selectedTag); }).join('');
    const clanTableHTML = renderClanTownHallTable(data.clans,selectedTag);
    document.getElementById('cwlContent').innerHTML =
      '<div class="clan-header"><div class="clan-name">' + clanLink + '</div><div class="clan-tag">' + escapeHTML(selectedTag || '-') + '</div><div class="clan-meta"><div class="meta">CWL Rounds<strong>7</strong></div><div class="meta">Peserta CWL<strong>' + formatNumber(rosterSize) + ' Player</strong></div><div class="meta">Season<strong>' + escapeHTML(firstValue(data.season,'-')) + '</strong></div></div></div>' +
      '<section class="section"><div class="section-head"><div class="section-title">Town Hall Breakdown</div>' + (selectedTag ? '<button type="button" class="cwl-clan-link" onclick="openClan(\'' + escapeHTML(selectedTag) + '\')">' + escapeHTML(clanName) + '</button>' : '') + '</div><div class="th-breakdown">' + breakdownHTML + '</div></section>' +
      '<section class="section"><div class="section-head"><div class="section-title">Komposisi Town Hall</div></div>' + clanTableHTML + '</section>' +
      '<section class="section"><div class="section-head"><div class="section-title">CWL Battle Rounds</div><div class="section-value">7 Rounds</div></div>' + roundsHTML + '</section>';
    window.scrollTo({top:0,behavior:'smooth'});
  }
  document.getElementById('searchInput').addEventListener('keydown',function(event) {
    if (event.key === 'Enter') searchData();
  });
  setMode('player');
  </script>
</body>
</html>
