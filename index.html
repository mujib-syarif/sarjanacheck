<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sarjana Checker</title>

<meta
  name="description"
  content="Sarjana Checker - Clash of Clans Player, Clan dan CWL Analyzer."
>

<style>

/* ============================================================
   ROOT
============================================================ */

:root {

  --bg: #07090d;

  --panel: #0e1219;

  --panel2: #131923;

  --panel3: #181f2b;

  --border: #252d3a;

  --text: #f5f7fb;

  --muted: #8993a3;

  --accent: #8b5cf6;

  --accent2: #a78bfa;

  --orange: #ff9f1c;

  --green: #35d07f;

  --red: #ff6577;

  --blue: #45a7ff;

  --yellow: #f5c451;

  --cyan: #4dd4ff;

  --max-width: 1180px;
}


/* ============================================================
   RESET
============================================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {

  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(139, 92, 246, .18),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(255, 159, 28, .05),
      transparent 25%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

img {
  max-width: 100%;
}


/* ============================================================
   APP
============================================================ */

.app {

  width: min(
    calc(100% - 28px),
    var(--max-width)
  );

  margin: auto;

  padding:
    24px
    0
    60px;
}


/* ============================================================
   HEADER
============================================================ */

.header {

  display: flex;

  align-items: center;

  gap: 16px;

  margin-bottom: 22px;

  padding:
    16px
    18px;

  background:
    linear-gradient(
      145deg,
      #151b26,
      #0c1017
    );

  border:
    1px solid var(--border);

  border-radius: 20px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.18);
}

.header-logo {

  width: 62px;

  height: 62px;

  object-fit: contain;

  flex-shrink: 0;
}

.header-title {

  font-size: 25px;

  font-weight: 900;

  letter-spacing: -.8px;
}

.header-sub {

  margin-top: 4px;

  color: var(--muted);

  font-size: 12px;
}


/* ============================================================
   SEARCH PANEL
============================================================ */

.search-panel {

  padding: 14px;

  margin-bottom: 18px;

  background:
    linear-gradient(
      145deg,
      #131924,
      #0c1118
    );

  border:
    1px solid var(--border);

  border-radius: 18px;
}

.tabs {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;

  padding: 4px;

  margin-bottom: 13px;

  background: #080b10;

  border-radius: 12px;
}

.tabs button {

  border: 0;

  background: transparent;

  color: var(--muted);

  border-radius: 9px;

  padding: 10px 8px;

  font-size: 11px;

  font-weight: 800;
}

.tabs button.active {

  color: white;

  background: var(--accent);

  box-shadow:
    0 5px 15px
    rgba(139,92,246,.25);
}

.search-row {

  display: flex;

  gap: 8px;
}

.search-input {

  flex: 1;

  min-width: 0;

  height: 48px;

  padding:
    0
    14px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  outline: none;

  color: white;

  background: #080c12;

  font-size: 13px;
}

.search-input:focus {

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px
    rgba(139,92,246,.08);
}

.search-btn {

  min-width: 110px;

  border: 0;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6d45df
    );

  color: white;

  font-weight: 900;

  font-size: 12px;
}

.search-btn:active {
  transform: scale(.98);
}

.search-hint {

  margin-top: 7px;

  color: var(--muted);

  font-size: 10px;
}


/* ============================================================
   LOADING
============================================================ */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(4,6,9,.78);

  backdrop-filter:
    blur(8px);
}

.loading.show {
  display: flex;
}

.loading-card {

  width: min(
    90vw,
    330px
  );

  padding: 28px;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      #171e29,
      #0d1219
    );

  border:
    1px solid var(--border);

  border-radius: 20px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.5);
}

.spinner {

  width: 36px;

  height: 36px;

  margin:
    0
    auto
    15px;

  border:
    3px solid
    rgba(255,255,255,.12);

  border-top-color:
    var(--accent);

  border-radius: 50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }
}

.loading-text {

  font-weight: 900;

  font-size: 15px;
}


/* ============================================================
   ERROR
============================================================ */

.error {

  display: none;

  margin-bottom: 15px;

  padding: 14px;

  color: #ff9aaa;

  background:
    rgba(255,101,119,.08);

  border:
    1px solid
    rgba(255,101,119,.22);

  border-radius: 14px;

  font-size: 12px;

  line-height: 1.5;
}

.error.show {
  display: block;
}


/* ============================================================
   PROFILE
============================================================ */

.profile {

  overflow: hidden;

  margin-bottom: 14px;

  background:
    linear-gradient(
      145deg,
      #151c27,
      #0d1219
    );

  border:
    1px solid var(--border);

  border-radius: 20px;
}

.profile-top {

  display: flex;

  align-items: center;

  gap: 15px;

  padding: 20px;
}

.player-avatar {

  width: 70px;

  height: 70px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 18px;

  background:
    rgba(139,92,246,.12);

  border:
    1px solid
    rgba(139,92,246,.2);

  color: var(--accent2);

  font-size: 28px;

  font-weight: 900;
}

.profile-info {
  min-width: 0;
}

.player-name {

  display: flex;

  align-items: center;

  gap: 8px;

  font-size: 23px;

  font-weight: 900;

  letter-spacing: -.6px;
}

.player-xp {

  color: var(--orange);

  font-size: 11px;

  white-space: nowrap;
}

.player-tag {

  margin-top: 4px;

  color: var(--muted);

  font-size: 11px;
}

.player-clan {

  display: inline-flex;

  align-items: center;

  gap: 6px;

  margin-top: 11px;

  padding: 7px 10px;

  border:
    1px solid
    rgba(139,92,246,.2);

  border-radius: 9px;

  background:
    rgba(139,92,246,.08);

  color: #c4b5fd;

  font-size: 11px;

  font-weight: 800;
}

.player-clan:hover {
  border-color: var(--accent);
}

.player-clan small {

  color: var(--muted);

  font-weight: 600;
}


/* ============================================================
   STAT GRID
============================================================ */

.stat-grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  border-top:
    1px solid var(--border);
}

.stat {

  padding: 14px 8px;

  text-align: center;

  border-right:
    1px solid var(--border);
}

.stat:last-child {
  border-right: 0;
}

.stat-value {

  font-size: 15px;

  font-weight: 900;
}

.stat-label {

  margin-top: 3px;

  color: var(--muted);

  font-size: 9px;

  font-weight: 600;
}


/* ============================================================
   SECTION
============================================================ */

.section {

  margin-bottom: 14px;

  padding: 17px;

  background: var(--panel);

  border:
    1px solid var(--border);

  border-radius: 17px;
}

.section-head {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 14px;
}

.section-title {

  font-size: 14px;

  font-weight: 900;
}

.section-value {

  color: var(--accent2);

  font-size: 11px;

  font-weight: 900;
}


/* ============================================================
   PROGRESS
============================================================ */

.progress-wrap {

  margin-bottom: 14px;
}

.progress-top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 7px;

  font-size: 11px;
}

.progress-top span:last-child {

  color: var(--accent2);

  font-weight: 900;
}

.progress {

  height: 9px;

  overflow: hidden;

  background: #070a0e;

  border-radius: 99px;
}

.progress > div {

  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
}


/* ============================================================
   MINI PROGRESS
============================================================ */

.mini-progress {

  display: grid;

  gap: 9px;
}

.mini-row {

  display: grid;

  gap: 5px;
}

.mini-top {

  display: flex;

  justify-content: space-between;

  font-size: 10px;

  color: var(--muted);
}

.mini-top strong {
  color: white;
}

.mini-bar {

  height: 5px;

  background: #070a0e;

  border-radius: 99px;

  overflow: hidden;
}

.mini-bar > div {

  height: 100%;

  border-radius: inherit;

  background: var(--blue);
}


/* ============================================================
   HERO GRID
============================================================ */

.hero-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 9px;
}

.hero-card {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px;

  background: #0a0e14;

  border:
    1px solid var(--border);

  border-radius: 13px;
}

.asset-box {

  width: 54px;

  height: 54px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 4px;

  overflow: hidden;

  background:
    rgba(255,255,255,.035);

  border-radius: 11px;
}

.asset-box img {

  width: 100%;

  height: 100%;

  object-fit: contain;
}

.asset-fallback {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 100%;

  height: 100%;

  color: var(--accent2);

  font-size: 20px;

  font-weight: 900;
}

.hero-info {

  flex: 1;

  min-width: 0;
}

.hero-name {

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 11px;

  font-weight: 800;
}

.hero-level {

  margin-top: 3px;

  color: var(--orange);

  font-size: 14px;

  font-weight: 900;
}

.hero-bar {

  height: 5px;

  margin-top: 6px;

  background: #070a0e;

  border-radius: 99px;

  overflow: hidden;
}

.hero-bar > div {

  height: 100%;

  background: var(--orange);

  border-radius: inherit;
}


/* ============================================================
   EQUIPMENT
============================================================ */

.equipment-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 8px;
}

.equipment-card {

  display: flex;

  align-items: center;

  gap: 9px;

  min-width: 0;

  padding: 9px;

  background: #0a0e14;

  border:
    1px solid var(--border);

  border-radius: 12px;
}

.equipment-card .asset-box {

  width: 46px;

  height: 46px;
}

.equipment-info {

  flex: 1;

  min-width: 0;
}

.equipment-name {

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 10px;

  font-weight: 800;
}

.equipment-hero {

  margin-top: 2px;

  color: var(--muted);

  font-size: 9px;
}

.equipment-level {

  margin-top: 4px;

  color: var(--accent2);

  font-size: 10px;

  font-weight: 900;
}

.equipment-bar {

  height: 4px;

  margin-top: 5px;

  background: #070a0e;

  border-radius: 99px;

  overflow: hidden;
}

.equipment-bar > div {

  height: 100%;

  background: var(--accent);

  border-radius: inherit;
}


/* ============================================================
   CLAN HEADER
============================================================ */

.clan-header {

  margin-bottom: 14px;

  padding: 20px;

  background:
    linear-gradient(
      145deg,
      #151c27,
      #0d1219
    );

  border:
    1px solid var(--border);

  border-radius: 20px;
}

.clan-title-row {

  display: flex;

  align-items: center;

  gap: 13px;
}

.clan-badge {

  width: 66px;

  height: 66px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 4px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.035);
}

.clan-badge img {

  width: 100%;

  height: 100%;

  object-fit: contain;
}

.clan-name {

  font-size: 22px;

  font-weight: 900;

  letter-spacing: -.6px;
}

.clan-tag {

  margin-top: 4px;

  color: var(--muted);

  font-size: 11px;
}

.clan-meta {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

  margin-top: 13px;
}

.meta {

  padding: 7px 9px;

  color: var(--muted);

  background: #090d13;

  border:
    1px solid var(--border);

  border-radius: 8px;

  font-size: 10px;
}

.meta strong {
  color: white;
}


/* ============================================================
   CLAN MEMBERS
============================================================ */

.member-tools {

  display: flex;

  gap: 7px;

  margin-bottom: 10px;

  overflow-x: auto;
}

.member-tools button {

  flex-shrink: 0;

  padding: 7px 9px;

  color: var(--muted);

  background: #090d13;

  border:
    1px solid var(--border);

  border-radius: 8px;

  font-size: 9px;

  font-weight: 800;
}

.member-tools button.active {

  color: white;

  border-color: var(--accent);

  background:
    rgba(139,92,246,.12);
}

.members {

  display: grid;

  gap: 7px;
}

.member {

  display: flex;

  align-items: center;

  gap: 10px;

  width: 100%;

  padding: 10px;

  text-align: left;

  color: white;

  background: #090d13;

  border:
    1px solid var(--border);

  border-radius: 11px;
}

.member:hover {

  border-color:
    rgba(139,92,246,.55);
}

.member-rank {

  width: 30px;

  flex-shrink: 0;

  text-align: center;

  color: var(--muted);

  font-size: 10px;

  font-weight: 800;
}

.member-info {

  flex: 1;

  min-width: 0;
}

.member-name {

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 11px;

  font-weight: 900;
}

.member-detail {

  margin-top: 3px;

  color: var(--muted);

  font-size: 9px;
}

.member-th {

  flex-shrink: 0;

  color: var(--accent2);

  font-size: 10px;

  font-weight: 900;
}

.member-role {

  min-width: 65px;

  text-align: center;

  color: var(--muted);

  font-size: 9px;

  font-weight: 700;
}


/* ============================================================
   CWL
============================================================ */

.cwl-summary {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;

  margin-bottom: 14px;
}

.cwl-stat {

  padding: 13px 8px;

  text-align: center;

  background: var(--panel);

  border:
    1px solid var(--border);

  border-radius: 13px;
}

.cwl-stat strong {

  display: block;

  font-size: 16px;

  font-weight: 900;
}

.cwl-stat span {

  display: block;

  margin-top: 3px;

  color: var(--muted);

  font-size: 9px;
}


/* ============================================================
   CWL TH TABLE
============================================================ */

.table-scroll {

  overflow-x: auto;

  -webkit-overflow-scrolling: touch;

  border:
    1px solid var(--border);

  border-radius: 13px;
}

.th-table {

  width: 100%;

  min-width: 930px;

  border-collapse: collapse;

  background: #090d13;
}

.th-table th,
.th-table td {

  padding:
    10px
    8px;

  text-align: center;

  border-bottom:
    1px solid var(--border);

  font-size: 9px;
}

.th-table th {

  position: sticky;

  top: 0;

  z-index: 2;

  color: var(--muted);

  background: #111720;

  font-weight: 900;
}

.th-table th:first-child,
.th-table td:first-child {

  position: sticky;

  left: 0;

  z-index: 3;

  min-width: 170px;

  text-align: left;

  background: #0c1118;
}

.th-table td:first-child {
  z-index: 1;
}

.th-table tr:last-child td {
  border-bottom: 0;
}

.th-clan {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  max-width: 165px;

  color: white;

  border: 0;

  background: transparent;

  text-align: left;

  font-size: 10px;

  font-weight: 900;
}

.th-clan:hover {
  color: var(--accent2);
}

.th-mini-badge {

  width: 25px;

  height: 25px;

  flex-shrink: 0;

  object-fit: contain;
}

.th-number {

  color: white;

  font-weight: 800;
}

.th-zero {
  color: #4e5663;
}


/* ============================================================
   WAR BREAKDOWN
============================================================ */

.rounds {

  display: grid;

  gap: 10px;
}

.round {

  padding: 14px;

  background: #090d13;

  border:
    1px solid var(--border);

  border-radius: 14px;
}

.round-top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 11px;
}

.round-title {

  font-size: 12px;

  font-weight: 900;
}

.state {

  padding: 5px 7px;

  border-radius: 7px;

  font-size: 8px;

  font-weight: 900;

  text-transform: uppercase;
}

.state.ended {

  color: var(--green);

  background:
    rgba(53,208,127,.09);
}

.state.active {

  color: var(--orange);

  background:
    rgba(255,159,28,.09);
}

.state.prep {

  color: var(--blue);

  background:
    rgba(69,167,255,.09);
}

.state.wait {

  color: var(--muted);

  background:
    rgba(255,255,255,.04);
}

.war-matchup {

  display: grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  align-items: center;

  gap: 8px;
}

.war-team {

  min-width: 0;

  padding: 10px;

  background: #0d1219;

  border:
    1px solid var(--border);

  border-radius: 10px;
}

.war-team.enemy {
  text-align: right;
}

.war-team-name {

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 10px;

  font-weight: 900;
}

.war-team-stars {

  margin-top: 4px;

  font-size: 17px;

  font-weight: 900;

  color: var(--orange);
}

.war-vs {

  color: var(--muted);

  font-size: 9px;

  font-weight: 900;
}

.war-extra {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  margin-top: 8px;
}

.war-extra-item {

  padding: 7px;

  text-align: center;

  background: #0d1219;

  border-radius: 8px;
}

.war-extra-item strong {

  display: block;

  font-size: 10px;
}

.war-extra-item span {

  display: block;

  margin-top: 2px;

  color: var(--muted);

  font-size: 8px;
}


/* ============================================================
   EMPTY
============================================================ */

.empty {

  padding: 20px;

  text-align: center;

  color: var(--muted);

  background: #090d13;

  border:
    1px solid var(--border);

  border-radius: 12px;

  font-size: 11px;
}


/* ============================================================
   FOOTER
============================================================ */

.footer {

  padding-top: 22px;

  text-align: center;

  color: #555f6d;

  font-size: 9px;

  line-height: 1.8;
}

.footer a {

  color: #9f8cff;

  text-decoration: none;

  font-weight: 800;
}

.footer a:hover {
  text-decoration: underline;
}


/* ============================================================
   DESKTOP
============================================================ */

@media (min-width: 800px) {

  .app {
    padding-top: 35px;
  }

  .hero-grid {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .equipment-grid {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .player-layout {

    display: grid;

    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr);

    gap: 14px;
  }

  .player-layout > .full {
    grid-column: 1 / -1;
  }
}

/* ============================================================
   HELPERS
============================================================ */

function esc(value) {

  return String(
    value ??
    ""
  )

  .replaceAll("&", "&amp;")

  .replaceAll("<", "&lt;")

  .replaceAll(">", "&gt;")

  .replaceAll('"', "&quot;")

  .replaceAll("'", "&#039;");
}


function cleanTag(value) {

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if (!tag) {
    return "";
  }

  if (!tag.startsWith("#")) {
    tag = "#" + tag;
  }

  return tag;
}


function num(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function percent(current, max) {

  current = num(current);
  max = num(max);

  if (max <= 0) {
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      (current / max) * 100
    )
  );
}


function formatNumber(value) {

  return num(value)
    .toLocaleString("id-ID");
}


function normalizeName(value) {

  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


/* ============================================================
   ROLE
============================================================ */

function roleName(player) {

  if (player?.roleName) {
    return player.roleName;
  }

  const role =
    String(
      player?.role ||
      ""
    )
      .trim()
      .toLowerCase();

  if (role === "leader") {
    return "Leader";
  }

  if (
    role === "coleader" ||
    role === "co-leader"
  ) {
    return "Co-Leader";
  }

  if (
    role === "admin" ||
    role === "elder"
  ) {
    return "Elder";
  }

  return "Member";
}

/* ============================================================
   HERO MAX
============================================================ */

function getHeroMax(hero, townHall) {

  const apiMax =
    num(
      hero?.maxLevel ??
      hero?.maxLevelForTownHall
    );

  if (apiMax > 0) {
    return apiMax;
  }

  const th =
    num(townHall);

  const table =
    HOME_MAX[th] || {};

  return num(
    table[hero?.name]
  );
}


/* ============================================================
   IS BUILDER HERO
============================================================ */

function isBuilderHero(hero) {

  const name =
    normalizeName(hero?.name);

  return (
    name === "battle machine" ||
    name === "battle copter"
  );
}


/* ============================================================
   HERO DATA
============================================================ */

function getHeroList(player) {

  const heroes =
    Array.isArray(player?.heroes)
      ? [...player.heroes]
      : [];

  heroes.sort(
    (a, b) => {

      const ai =
        HERO_ORDER.indexOf(
          a?.name
        );

      const bi =
        HERO_ORDER.indexOf(
          b?.name
        );

      return (
        (ai < 0 ? 999 : ai) -
        (bi < 0 ? 999 : bi)
      );
    }
  );

  return heroes;
}


/* ============================================================
   HERO PROGRESS
============================================================ */

function calculateHeroProgress(player) {

  const heroes =
    getHeroList(player);

  let current = 0;

  let max = 0;

  for (const hero of heroes) {

    const level =
      num(hero.level);

    const heroMax =
      getHeroMax(
        hero,
        player.townHallLevel
      );

    if (heroMax > 0) {

      current +=
        Math.min(
          level,
          heroMax
        );

      max += heroMax;
    }
  }

  return {
    current,
    max,
    percent:
      percent(
        current,
        max
      )
  };
}


/* ============================================================
   EQUIPMENT PROGRESS
============================================================ */

function equipmentMax(item) {

  const max =
    num(
      item?.maxLevel ??
      item?.maxLevelForTownHall
    );

  if (max > 0) {
    return max;
  }

  /*
    Fallback hanya jika API tidak mengirim maxLevel.
    API normalnya sudah mengirim nilai ini.
  */

  return 18;
}


function calculateEquipmentProgress(
  equipment
) {

  let current = 0;

  let max = 0;

  for (const item of equipment) {

    const level =
      num(item.level);

    const itemMax =
      equipmentMax(item);

    current +=
      Math.min(
        level,
        itemMax
      );

    max += itemMax;
  }

  return {
    current,
    max,
    percent:
      percent(
        current,
        max
      )
  };
}


/* ============================================================
   API
============================================================ */

async function api(path) {

  const response =
    await fetch(
      API_BASE + path,
      {
        headers: {
          Accept:
            "application/json"
        }
      }
    );

  let body = null;

  try {
    body =
      await response.json();
  } catch (_) {}

  if (!response.ok) {

    throw new Error(
      body?.error ||
      `HTTP ${response.status}`
    );
  }

  if (
    body &&
    body.ok === false
  ) {

    throw new Error(
      body.error ||
      "API error"
    );
  }

  return body;
}

}


/* ============================================================
   SEARCH
============================================================ */

async function searchData() {

  const input =
    document.getElementById(
      "searchInput"
    );

  const tag =
    cleanTag(input.value);

  if (!tag) {

    showError(
      "Masukkan tag terlebih dahulu."
    );

    return;
  }

  clearError();

  try {

    if (mode === "player") {

      await loadPlayer(tag);

    } else if (mode === "clan") {

      await loadClan(tag);

    } else {

      await loadCwl(tag);

    }

  } catch (error) {

    showError(
      error?.message ||
      "Gagal mengambil data."
    );
  }
}

/* ============================================================
   HOME HERO PROGRESS
============================================================ */

function calculateHomeHeroData(
  player
) {

  const heroes =
    getHeroList(player)
      .filter(
        hero =>
          !isBuilderHero(hero)
      );

  let current = 0;

  let max = 0;

  for (const hero of heroes) {

    const level =
      num(hero.level);

    const heroMax =
      getHeroMax(
        hero,
        player.townHallLevel
      );

    if (heroMax > 0) {

      current +=
        Math.min(
          level,
          heroMax
        );

      max += heroMax;
    }
  }

  return {
    current,
    max
  };
}


function calculateHomeHeroProgress(
  player
) {

  const data =
    calculateHomeHeroData(
      player
    );

  return `
    ${formatNumber(data.current)}
    /
    ${formatNumber(data.max)}
  `;
}


function calculateHomeHeroPercent(
  player
) {

  const data =
    calculateHomeHeroData(
      player
    );

  return percent(
    data.current,
    data.max
  );
}


/* ============================================================
   BUILDER HERO PROGRESS
============================================================ */

function calculateBuilderHeroData(
  player
) {

  const heroes =
    getHeroList(player)
      .filter(
        hero =>
          isBuilderHero(hero)
      );

  let current = 0;

  let max = 0;

  for (const hero of heroes) {

    const level =
      num(hero.level);

    const heroMax =
      num(
        hero.maxLevel ??
        hero.maxLevelForTownHall
      );

    if (heroMax > 0) {

      current +=
        Math.min(
          level,
          heroMax
        );

      max += heroMax;
    }
  }

  return {
    current,
    max
  };
}


function calculateBuilderHeroProgress(
  player
) {

  const data =
    calculateBuilderHeroData(
      player
    );

  return `
    ${formatNumber(data.current)}
    /
    ${formatNumber(data.max)}
  `;
}


function calculateBuilderHeroPercent(
  player
) {

  const data =
    calculateBuilderHeroData(
      player
    );

  return percent(
    data.current,
    data.max
  );
}

/* ============================================================
   SORT MEMBERS
============================================================ */

function sortMembers(
  members,
  sort
) {

  return members.sort(
    (a, b) => {

      if (sort === "th") {

        return (
          num(b.townHallLevel) -
          num(a.townHallLevel)
        );
      }

      if (
        sort === "trophies"
      ) {

        return (
          num(b.trophies) -
          num(a.trophies)
        );
      }

      if (sort === "name") {

        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          )
        );
      }

      return (
        num(a.clanRank) -
        num(b.clanRank)
      );
    }
  );
}


function changeMemberSort(
  sort

  memberSort =
    sort;

  if (currentClan) {

    renderClan(
      currentClan

/* ============================================================
   WAR ROUND CARD
============================================================ */

function warRoundCard(round) {

  /*
    IMPORTANT:

    Hanya menggunakan round.targetWar.

    Tidak pernah mengambil wars[0].

    Jadi tidak akan menampilkan clan lain
    secara random.
  */

  const war =
    round?.targetWar;

  if (!war) {

    return `

      <div class="round">

        <div class="round-top">

          <div class="round-title">

            Battle Round
            ${formatNumber(
              round.roundNumber
            )}

          </div>

          <div class="state wait">
            Belum tersedia
          </div>

        </div>


        <div class="empty">

          Data war untuk round ini
          belum tersedia.

        </div>

      </div>

    `;
  }


  const state =
    String(
      war.state || ""
    );


  let stateClass =
    "wait";

  let stateText =
    state || "UNKNOWN";


  if (state === "warEnded") {

    stateClass =
      "ended";

    stateText =
      "WAR ENDED";

  } else if (
    state === "inWar"
  ) {

    stateClass =
      "active";

    stateText =
      "IN WAR";

  } else if (
    state === "preparation"
  ) {

    stateClass =
      "prep";

    stateText =
      "PREPARATION";
  }


  const target =
    war.target || {};

  const enemy =
    war.enemy || {};


  const result =
    String(
      war.result ||
      "draw"
    );


  return `

    <div class="round">

      <div class="round-top">

        <div class="round-title">

          Battle Round
          ${formatNumber(
            round.roundNumber
          )}

        </div>

        <div
          class="
            state
            ${stateClass}
          "
        >
          ${esc(
            stateText
          )}
        </div>

      </div>


      <div class="war-matchup">


        <!-- TARGET CLAN -->

        <div class="war-team">

          <div class="war-team-name">

            ${esc(
              target.name ||
              "-"
            )}

          </div>

          <div class="war-team-stars">

            ⭐
            ${formatNumber(
              target.stars
            )}

          </div>

        </div>


        <div class="war-vs">
          VS
        </div>


        <!-- OPPONENT -->

        <div class="war-team enemy">

          <div class="war-team-name">

            ${esc(
              enemy.name ||
              "-"
            )}

          </div>

          <div class="war-team-stars">

            ⭐
            ${formatNumber(
              enemy.stars
            )}

          </div>

        </div>


      </div>


      <div class="war-extra">


        <div class="war-extra-item">

          <strong>
            ${formatNumber(
              target.destructionPercentage
            )}%
          </strong>

          <span>
            Destruction
          </span>

        </div>


        <div class="war-extra-item">

          <strong>
            ${formatNumber(
              target.attacks
            )}
          </strong>

          <span>
            Attacks
          </span>

        </div>


        <div class="war-extra-item">

          <strong>

            ${
              result === "win"
                ? "WIN"
                : result === "loss"
                ? "LOSS"
                : "DRAW"
            }

          </strong>

          <span>
            Result
          </span>

        </div>


      </div>

    </div>

  `;
}
