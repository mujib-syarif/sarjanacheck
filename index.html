<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d11">

<title>Sarjana Checker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080b10;
  --panel:#10151d;
  --panel2:#151b25;
  --panel3:#0b0f15;
  --border:#252d3a;
  --text:#f5f7fb;
  --muted:#8f99a8;

  --gold:#f5c451;
  --gold2:#ffd86a;

  --purple:#8b6cff;
  --purple2:#b19cff;

  --green:#35d07f;
  --red:#ff6577;
  --blue:#45a7ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(245,196,81,.09),
      transparent 32%
    ),
    var(--bg);

  color:var(--text);
  font-family:"Plus Jakarta Sans",sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px 13px 50px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  padding:4px 2px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo{
  width:46px;
  height:46px;
  border-radius:12px;
  object-fit:cover;
  border:1px solid var(--border);
  background:#111722;
}

.brand-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.8px;
}

.brand-sub{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}


/* =====================================================
   MENU
===================================================== */

.menu-wrap{
  position:relative;
}

.menu-btn{
  width:42px;
  height:42px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--panel);
  color:white;

  font-size:21px;
  line-height:1;
}

.menu{
  position:absolute;

  right:0;
  top:48px;

  width:190px;

  background:#111720;

  border:1px solid var(--border);
  border-radius:14px;

  padding:7px;

  z-index:50;

  box-shadow:
    0 18px 40px rgba(0,0,0,.45);

  display:none;
}

.menu.open{
  display:block;
}

.menu button{
  display:block;

  width:100%;

  border:0;

  background:transparent;

  color:#dfe5ee;

  text-align:left;

  padding:11px 10px;

  border-radius:9px;

  font-size:11px;
  font-weight:700;
}

.menu button:hover{
  background:#1a2130;
}

.menu .menu-active{
  background:rgba(245,196,81,.1);
  color:var(--gold2);
}


/* =====================================================
   SEARCH
===================================================== */

.search-panel{
  background:
    linear-gradient(
      145deg,
      #121821,
      #0d1118
    );

  border:1px solid var(--border);

  border-radius:17px;

  padding:13px;

  margin-bottom:14px;
}

.switch{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:5px;

  background:#090c11;

  padding:4px;

  border-radius:11px;

  margin-bottom:11px;
}

.switch button{
  border:0;

  background:transparent;

  color:var(--muted);

  padding:8px;

  border-radius:8px;

  font-size:11px;
  font-weight:800;
}

.switch button.active{
  background:var(--purple);
  color:white;
}

.search-row{
  display:flex;
  gap:7px;
}

.search-row input{
  flex:1;
  min-width:0;

  background:#090d13;

  color:white;

  border:1px solid var(--border);

  outline:0;

  border-radius:10px;

  padding:11px 12px;

  font-size:12px;
}

.search-row input:focus{
  border-color:var(--purple);
}

.search-btn{
  border:0;

  border-radius:10px;

  padding:0 15px;

  background:var(--purple);

  color:white;

  font-weight:800;
  font-size:11px;
}

.hint{
  color:var(--muted);

  font-size:9px;

  margin-top:7px;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  display:none;
}

.page.active{
  display:block;
}


/* =====================================================
   PROFILE
===================================================== */

.profile,
.clan-header,
.section{
  background:
    linear-gradient(
      145deg,
      #141a23,
      #0e131a
    );

  border:1px solid var(--border);

  border-radius:18px;

  margin-bottom:12px;
}

.profile{
  overflow:hidden;
}

.profile-top{
  padding:18px;

  position:relative;
}

.profile-top:after{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-100px;
  top:-100px;

  background:rgba(139,108,255,.13);

  filter:blur(40px);

  border-radius:50%;

  pointer-events:none;
}

.player-line{
  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:10px;
}

.player-name,
.clan-name{
  font-size:22px;

  font-weight:800;

  letter-spacing:-.8px;
}

.player-tag,
.clan-tag{
  color:var(--muted);

  font-size:10px;

  margin-top:3px;
}

.role-pill{
  display:inline-flex;

  align-items:center;

  border:1px solid rgba(245,196,81,.25);

  background:rgba(245,196,81,.08);

  color:var(--gold2);

  border-radius:99px;

  padding:5px 8px;

  font-size:9px;

  font-weight:800;

  white-space:nowrap;
}

.clan-link{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:11px;

  color:#cfc5ff;

  background:rgba(139,108,255,.09);

  border:1px solid rgba(139,108,255,.22);

  border-radius:8px;

  padding:7px 9px;

  font-size:10px;

  font-weight:700;
}

.clan-link span{
  color:var(--muted);

  font-weight:500;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  border-top:1px solid var(--border);
}

.stat{
  padding:11px 8px;

  text-align:center;

  border-right:1px solid var(--border);
}

.stat:last-child{
  border-right:0;
}

.stat-value{
  font-weight:800;

  font-size:14px;
}

.stat-label{
  font-size:8px;

  color:var(--muted);

  margin-top:3px;
}


/* =====================================================
   SECTION
===================================================== */

.section{
  padding:14px;
}

.section-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

  margin-bottom:11px;
}

.section-title{
  font-size:12px;

  font-weight:800;
}

.section-value{
  color:var(--gold2);

  font-size:10px;

  font-weight:800;
}

.subhead{
  font-size:9px;

  color:var(--muted);

  margin:-4px 0 10px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-main{
  height:8px;

  background:#080b10;

  border-radius:99px;

  overflow:hidden;

  margin-bottom:7px;
}

.progress-fill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--purple2)
    );

  border-radius:inherit;
}

.progress-info{
  display:flex;

  justify-content:space-between;

  gap:8px;

  font-size:9px;

  color:var(--muted);
}


/* =====================================================
   HERO
===================================================== */

.hero-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:7px;
}

.hero-card{
  background:#0b0f15;

  border:1px solid var(--border);

  border-radius:12px;

  padding:9px;

  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;
}

.hero-icon,
.gear-icon{
  width:38px;
  height:38px;

  border-radius:9px;

  object-fit:contain;

  flex-shrink:0;

  background:#121823;

  border:1px solid #202837;

  padding:3px;
}

.hero-icon-fallback{
  display:grid;

  place-items:center;

  font-size:20px;
}

.hero-info{
  min-width:0;

  flex:1;
}

.hero-name{
  font-size:9px;

  color:#c8d0dc;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.hero-level{
  font-size:14px;

  font-weight:800;

  margin-top:2px;
}

.hero-max{
  font-size:8px;

  color:var(--green);

  margin-top:1px;
}


/* =====================================================
   EQUIPMENT
===================================================== */

.gear-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:7px;
}

.gear-card{
  background:#0b0f15;

  border:1px solid var(--border);

  border-radius:11px;

  padding:8px;

  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;
}

.gear-name{
  font-size:9px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.gear-level{
  font-size:8px;

  color:var(--muted);

  margin-top:2px;
}

.rarity{
  font-size:7px;

  font-weight:800;

  margin-top:3px;

  text-transform:uppercase;
}

.rarity.common{
  color:#9aa4b3;
}

.rarity.epic{
  color:#c084fc;
}


/* =====================================================
   EMPTY / INFO
===================================================== */

.empty{
  padding:12px;

  background:var(--panel3);

  border:1px dashed var(--border);

  border-radius:10px;

  color:var(--muted);

  font-size:10px;
}

.priority{
  display:flex;

  align-items:center;

  gap:9px;

  padding:10px;

  background:var(--panel3);

  border:1px solid var(--border);

  border-radius:10px;

  margin-top:7px;
}

.priority-name{
  font-size:10px;

  font-weight:700;
}

.priority-desc{
  font-size:8px;

  color:var(--muted);

  margin-top:2px;
}


/* =====================================================
   TWO COLUMN
===================================================== */

.two-col{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}


/* =====================================================
   CLAN
===================================================== */

.clan-header{
  padding:17px;
}

.clan-meta{
  display:flex;

  gap:6px;

  margin-top:11px;

  flex-wrap:wrap;
}

.meta{
  background:#0b0f15;

  border:1px solid var(--border);

  padding:6px 8px;

  border-radius:8px;

  font-size:9px;

  color:var(--muted);
}

.meta strong{
  color:white;
}


/* =====================================================
   MEMBERS
===================================================== */

.member{
  width:100%;

  display:flex;

  align-items:center;

  gap:9px;

  background:#0b0f15;

  border:1px solid var(--border);

  border-radius:10px;

  padding:9px;

  margin-bottom:6px;

  color:white;

  text-align:left;
}

.member:hover{
  border-color:rgba(139,108,255,.5);
}

.member-rank{
  width:23px;

  color:var(--muted);

  font-size:9px;

  text-align:center;
}

.member-info{
  flex:1;

  min-width:0;
}

.member-name{
  font-size:10px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.member-detail{
  font-size:8px;

  color:var(--muted);

  margin-top:2px;
}

.member-th{
  font-size:9px;

  font-weight:800;

  color:var(--gold2);
}


/* =====================================================
   BUTTON
===================================================== */

.back-btn,
.secondary-btn{
  border:1px solid var(--border);

  background:transparent;

  color:var(--muted);

  border-radius:9px;

  padding:8px 10px;

  font-size:9px;

  font-weight:700;

  margin-bottom:10px;
}


/* =====================================================
   CWL
===================================================== */

.cwl-toolbar{
  display:flex;

  gap:7px;

  align-items:center;

  margin-bottom:10px;
}

.cwl-toolbar input{
  flex:1;

  background:#090d13;

  color:white;

  border:1px solid var(--border);

  outline:0;

  border-radius:9px;

  padding:9px 10px;

  font-size:10px;
}

.cwl-toolbar button{
  border:0;

  background:var(--purple);

  color:white;

  border-radius:9px;

  padding:9px 11px;

  font-size:9px;

  font-weight:800;
}

.cwl-tabs{
  display:flex;

  gap:6px;

  overflow:auto;

  padding-bottom:4px;

  margin-bottom:10px;
}

.cwl-tab{
  flex:0 0 auto;

  border:1px solid var(--border);

  background:#0b0f15;

  color:var(--muted);

  border-radius:8px;

  padding:7px 9px;

  font-size:8px;

  font-weight:800;
}

.cwl-tab.active{
  background:rgba(245,196,81,.1);

  color:var(--gold2);

  border-color:rgba(245,196,81,.25);
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{
  overflow-x:auto;

  border:1px solid var(--border);

  border-radius:11px;
}

.table{
  width:100%;

  border-collapse:collapse;

  min-width:560px;
}

.table th,
.table td{
  padding:8px 7px;

  border-bottom:1px solid #1c2330;

  text-align:left;

  font-size:8px;

  white-space:nowrap;
}

.table th{
  color:var(--muted);

  font-weight:800;

  background:#0c1118;
}

.table tr:last-child td{
  border-bottom:0;
}

.th-grid{
  display:flex;

  gap:4px;

  flex-wrap:wrap;
}

.th-chip{
  padding:3px 5px;

  border-radius:5px;

  background:#151c27;

  color:#dbe2ed;

  font-size:7px;

  font-weight:800;
}


/* =====================================================
   WAR
===================================================== */

.war-card{
  background:#0b0f15;

  border:1px solid var(--border);

  border-radius:11px;

  padding:10px;

  margin-bottom:7px;
}

.war-top{
  display:flex;

  justify-content:space-between;

  gap:8px;
}

.war-round{
  font-size:9px;

  font-weight:800;

  color:var(--gold2);
}

.war-state{
  font-size:8px;

  color:var(--muted);
}

.war-match{
  display:grid;

  grid-template-columns:1fr auto 1fr;

  gap:8px;

  align-items:center;

  margin-top:9px;
}

.war-team{
  min-width:0;
}

.war-team:last-child{
  text-align:right;
}

.war-team-name{
  font-size:9px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.war-score{
  font-size:15px;

  font-weight:800;
}

.war-vs{
  color:var(--muted);

  font-size:8px;
}

.war-sub{
  font-size:8px;

  color:var(--muted);

  margin-top:2px;
}

.win{
  color:var(--green);
}

.loss{
  color:var(--red);
}

.draw{
  color:var(--gold2);
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
  text-align:center;

  color:#505a69;

  font-size:8px;

  margin-top:22px;

  line-height:1.7;
}

.footer a{
  color:#a78bfa;

  text-decoration:none;

  font-weight:700;

  margin:0 4px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(min-width:650px){

  .app{
    padding-top:25px;
  }

  .hero-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .gear-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:430px){

  .player-name,
  .clan-name{
    font-size:19px;
  }

  .two-col{
    grid-template-columns:1fr;
  }

  .gear-grid{
    grid-template-columns:1fr;
  }

  .hero-grid{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="brand">

    <img
      class="brand-logo"
      src="assets/logo/og-thumbnail.png"
      alt="Sarjana Checker"
      onerror="this.style.display='none'"
    >

    <div>

      <div class="brand-title">
        Sarjana Checker
      </div>

      <div class="brand-sub">
        Clash of Clans Account Analyzer
      </div>

    </div>

  </div>


  <div class="menu-wrap">

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Menu"
    >
      ⋮
    </button>


    <div
      id="menu"
      class="menu"
    >

      <button
        class="menu-active"
        onclick="menuPlayer()"
      >
        👤 Player Checker
      </button>

      <button
        onclick="menuClan()"
      >
        🏰 Clan Checker
      </button>

      <button
        onclick="menuCWL()"
      >
        ⚔️ CWL Breakdown
      </button>

    </div>

  </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section
  class="search-panel"
  id="searchPanel"
>

  <div class="switch">

    <button
      id="playerTab"
      class="active"
      onclick="setMode('player')"
    >
      PLAYER
    </button>


    <button
      id="clanTab"
      onclick="setMode('clan')"
    >
      CLAN
    </button>

  </div>


  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="Masukkan Player Tag"
    >

    <button
      class="search-btn"
      onclick="searchData()"
    >
      CHECK
    </button>

  </div>


  <div
    class="hint"
    id="searchHint"
  >
    Contoh: #9UG9LJV8Y
  </div>

</section>


<!-- =====================================================
     PLAYER PAGE
===================================================== -->

<main
  id="playerPage"
  class="page active"
>

  <div id="playerContent"></div>

</main>


<!-- =====================================================
     CLAN PAGE
===================================================== -->

<main
  id="clanPage"
  class="page"
>

  <button
    class="back-btn"
    onclick="showPlayer()"
  >
    ← Kembali
  </button>

  <div id="clanContent"></div>

</main>


<!-- =====================================================
     CWL PAGE
===================================================== -->

<main
  id="cwlPage"
  class="page"
>

  <div id="cwlContent"></div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

  <div>
    Clash of Clans Tag Tracker by: Mujib, S.Coc.
  </div>

  <div>

    <a
      href="https://mujib-syarif.basenama.workers.dev"
      target="_blank"
      rel="noopener noreferrer"
    >
      BaseNama
    </a>

    </a>

  </div>

</footer>


</div>

/* =====================================================
   HELPERS
===================================================== */

function norm(value){

  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ");

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatNumber(value){

  return Number(value || 0)
    .toLocaleString("en-US");

}


function cleanTag(value){

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if(tag && !tag.startsWith("#")){
    tag = "#" + tag;
  }

  return tag;

}


function pct(value,max){

  if(!max){
    return 0;
  }

  return Math.round(
    (Number(value || 0) / Number(max)) * 100
  );

}


/* =====================================================
   ROLE
===================================================== */

function roleName(role){

  const r = norm(role);

  if(r === "leader"){
    return "Leader";
  }

  if(
    r === "coleader" ||
    r === "co leader"
  ){
    return "Co-Leader";
  }

  if(
    r === "admin" ||
    r === "elder" ||
    r === "senior"
  ){
    return "Senior";
  }

  return "Member";

}


/* =====================================================
   HERO MAX
===================================================== */

function heroMax(name,th){

  const row =
    HOME_MAX[name];

  if(!row){
    return null;
  }

  let max = null;

  Object.keys(row)
    .map(Number)
    .filter(level => level <= th)
    .forEach(level => {
      max = row[level];
    });

  return max;

}


function builderMax(name,bh){

  const row =
    BUILDER_MAX[name];

  if(!row || !bh){
    return null;
  }

  let max = null;

  Object.keys(row)
    .map(Number)
    .filter(level => level <= bh)
    .forEach(level => {
      max = row[level];
    });

  return max;

}


function getMax(hero,isBuilder,player){

  const level =
    isBuilder
      ? Number(player.builderHallLevel || 0)
      : Number(player.townHallLevel || 0);

  return isBuilder
    ? builderMax(hero.name,level)
    : heroMax(hero.name,level);

}


/* =====================================================
   ASSET RESOLVER
===================================================== */

function assetFor(map,name){

  if(map[name]){
    return map[name];
  }

  const target =
    norm(name);

  const key =
    Object.keys(map)
      .find(key => norm(key) === target);

  return key
    ? map[key]
    : null;

}


/* =====================================================
   ICON FALLBACK
===================================================== */

function heroEmoji(name){

  if(name === "Dragon Duke"){
    return "🐉";
  }

  if(name === "Battle Machine"){
    return "🤖";
  }

  if(name === "Battle Copter"){
    return "🚁";
  }

  return "🦸";

}


function gearEmoji(name){

  return EPIC_EQUIPMENT.has(name)
    ? "✨"
    : "⚙️";

}


function imgOrFallback(
  src,
  alt,
  emoji,
  cls
){

  if(!src){

    return `
      <div class="${cls} hero-icon-fallback">
        ${emoji}
      </div>
    `;

  }

  return `
    <img
      class="${cls}"
      src="${escapeHTML(src)}"
      alt="${escapeHTML(alt)}"
      onerror="
        this.style.display='none';
        this.nextElementSibling.style.display='grid';
      "
    >

    <div
      class="${cls} hero-icon-fallback"
      style="display:none"
    >
      ${emoji}
    </div>
  `;

}


/* =====================================================
   EQUIPMENT RARITY
===================================================== */

function equipmentRarity(item){

  const raw =
    String(item.rarity || "")
      .toLowerCase();

  if(raw.includes("epic")){
    return "Epic";
  }

  if(raw.includes("common")){
    return "Common";
  }

  return EPIC_EQUIPMENT.has(item.name)
    ? "Epic"
    : "Common";

}


/* =====================================================
   EQUIPMENT MAX
   IMPORTANT:
   COMMON = 18
   EPIC = 27
===================================================== */

function equipmentMax(item){

  const rarity =
    equipmentRarity(item);

  if(rarity === "Epic"){
    return 27;
  }

  return 18;

}

/* =====================================================
   API
===================================================== */

async function apiGet(
  endpoint,
  tag
){

  const response =
    await fetch(
      `${API_BASE}/${endpoint}?tag=${encodeURIComponent(cleanTag(tag))}`
    );

  let data;

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "Respons API tidak valid."
    );

  }

  if(!response.ok){

    throw new Error(
      data?.details?.message ||
      data?.error ||
      `HTTP ${response.status}`
    );

  }

  return data;

}

/* =====================================================
   HERO SECTION
===================================================== */

function renderHeroSection(
  title,
  heroes,
  isBuilder,
  player
){

  const maxTotal =
    heroes.reduce(
      (sum,hero) =>
        sum +
        Number(
          getMax(
            hero,
            isBuilder,
            player
          ) || 0
        ),
      0
    );


  const levelTotal =
    heroes.reduce(
      (sum,hero) =>
        sum +
        Number(
          hero.level || 0
        ),
      0
    );


  const progress =
    pct(
      levelTotal,
      maxTotal
    );


  return `

    <section class="section">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-value">

          ${levelTotal}/${maxTotal || "—"}
          ·
          ${progress}%

        </div>

      </div>


      <div class="progress-main">

        <div
          class="progress-fill"
          style="
            width:${Math.min(
              progress,
              100
            )}%
          "
        ></div>

      </div>


      <div class="progress-info">

        <span>
          ${heroes.length} hero
        </span>

        <span>
          ${
            isBuilder
              ? "Builder Hall based max"
              : "Town Hall based max"
          }
        </span>

      </div>


      <div
        class="hero-grid"
        style="margin-top:10px"
      >

        ${
          heroes.length
            ? heroes
                .map(hero =>
                  renderHeroCard(
                    hero,
                    isBuilder,
                    player
                  )
                )
                .join("")
            : `
              <div class="empty">
                Tidak ada data hero.
              </div>
            `
        }

      </div>

    </section>

  `;

}

function renderEquipment(

  const items =
    homeHeroes.flatMap(
      hero =>

          .map(item => ({

  showLoading(

/* =====================================================
   WAR RESULT CLASS
===================================================== */

function warResultClass(war){

  if(
    !war?.available &&
    war?.state === "unavailable"
  ){

    return "";

  }


  const ourStars =
    Number(
      war?.clan?.stars || 0
    );


  const opponentStars =
    Number(
      war?.opponent?.stars || 0
    );


  if(
    ourStars >
    opponentStars
  ){

    return "win";

  }


  if(
    ourStars <
    opponentStars
  ){

    return "loss";

  }


  return "draw";

}

/* =====================================================
   CWL PLAYER AGGREGATION
===================================================== */

function aggregatePlayers(wars){

  const map =
    new Map();


  (wars || [])
    .forEach(war => {

      if(
        !war.available ||
        !war.clan?.members
      ){

        return;

      }


      (war.clan.members || [])
        .forEach(member => {

          let player =
            map.get(
              member.tag
            );


          if(!player){

            player = {

              tag:
                member.tag,

              name:
                member.name,

              townHallLevel:
                member.townHallLevel,

              attacks:0,

              expected:0,

              missed:0,

              stars:0,

              destruction:0,

              wars:0

            };

          }


          player.townHallLevel =
            Math.max(
              player.townHallLevel,
              member.townHallLevel
            );


          player.attacks +=
            member.attacks;


          player.expected +=
            member.attacksExpected;


          player.missed +=
            member.missed
              ? 1
              : 0;


          player.stars +=
            member.stars;


          player.destruction +=
            member.destructionPercentage;


          player.wars +=
            1;


          map.set(
            member.tag,
            player
          );

        });

    });


  return [...map.values()]
    .map(player => ({

      ...player,

      destruction:
        player.wars
          ? player.destruction /
            player.wars
          : 0

    }))
    .sort(
      (a,b) =>
        b.stars -
        a.stars ||

        b.destruction -
        a.destruction
    );

}

  const members =
    [...(
      war.clan.members || []

    .sort(
      (a,b) =>

        a.stars ||

        b.destructionPercentage -
