<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarjana Checker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#07090d;
  --panel:#10141b;
  --panel2:#151a22;
  --panel3:#0b0f14;
  --border:#252d38;

  --text:#f5f7fa;
  --muted:#8994a3;

  --gold:#f0bd55;
  --gold2:#ffd979;

  --purple:#7658ff;
  --purple2:#a895ff;

  --green:#36d582;
  --blue:#4da8ff;
  --red:#ff6578;
  --orange:#ff9e45;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(240,189,85,.12),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 30%,
      rgba(118,88,255,.08),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);
  font-family:"Plus Jakarta Sans",sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:22px 14px 50px;
}

/* =========================
   HEADER
========================= */

.header{
  text-align:center;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.brand-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:15px;
  filter:
    drop-shadow(0 5px 18px rgba(240,189,85,.18));
}

.brand-text{
  text-align:left;
}

.brand-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* =========================
   SEARCH
========================= */

.search-panel{
  background:
    linear-gradient(
      145deg,
      rgba(22,27,36,.96),
      rgba(12,16,22,.96)
    );

  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:16px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);
}

.switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;

  background:#080b10;
  padding:4px;
  border-radius:11px;
  margin-bottom:12px;
}

.switch button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px;
  border-radius:8px;

  font-size:11px;
  font-weight:800;
}

.switch button.active{
  background:var(--purple);
  color:#fff;
}

.search-row{
  display:flex;
  gap:7px;
}

.search-row input{
  min-width:0;
  flex:1;

  background:#090d12;
  color:#fff;

  border:1px solid var(--border);
  outline:none;

  border-radius:10px;
  padding:12px;

  font-size:12px;
}

.search-row input:focus{
  border-color:var(--purple);
}

.search-btn{
  border:0;
  border-radius:10px;

  padding:0 16px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      #6346ef
    );

  color:#fff;
  font-size:11px;
  font-weight:800;
}

.search-btn:active{
  transform:scale(.97);
}

.hint{
  color:var(--muted);
  font-size:9px;
  margin-top:7px;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   COMMON
========================= */

.section{
  background:
    linear-gradient(
      145deg,
      rgba(17,22,29,.98),
      rgba(12,16,22,.98)
    );

  border:1px solid var(--border);
  border-radius:17px;

  padding:15px;
  margin-bottom:13px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin-bottom:13px;
}

.section-title{
  font-size:13px;
  font-weight:800;
}

.section-value{
  color:var(--gold2);
  font-size:10px;
  font-weight:800;
}

.empty{
  color:var(--muted);
  font-size:11px;
  padding:8px 0;
}

.back-btn{
  border:1px solid var(--border);
  background:#0d1117;
  color:var(--muted);

  border-radius:9px;
  padding:8px 11px;

  font-size:10px;
  font-weight:700;

  margin-bottom:12px;
}

.back-btn:hover{
  color:#fff;
  border-color:#465163;
}

/* =========================
   PLAYER PROFILE
========================= */

.profile{
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #171d26,
      #0e131a
    );

  border:1px solid var(--border);
  border-radius:20px;

  margin-bottom:13px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.2);
}

.profile-top{
  position:relative;
  padding:20px;
  overflow:hidden;
}

.profile-top::after{
  content:"";
  position:absolute;

  width:190px;
  height:190px;

  right:-90px;
  top:-100px;

  border-radius:50%;

  background:rgba(240,189,85,.09);
  filter:blur(30px);
}

.profile-main{
  position:relative;
  z-index:1;
}

.player-name{
  font-size:24px;
  font-weight:800;
  letter-spacing:-1px;
}

.player-tag{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.player-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  padding:6px 8px;

  background:#0a0e14;
  border:1px solid var(--border);

  border-radius:7px;

  color:var(--muted);
  font-size:9px;
}

.badge strong{
  color:#fff;
}

.clan-link{
  display:flex;
  align-items:center;
  gap:8px;

  width:max-content;
  max-width:100%;

  margin-top:12px;

  background:rgba(118,88,255,.09);
  border:1px solid rgba(118,88,255,.25);

  color:#c9bfff;

  border-radius:9px;
  padding:7px 9px;

  font-size:10px;
  font-weight:700;

  text-align:left;
}

.clan-link:hover{
  background:rgba(118,88,255,.16);
}

.clan-mini-logo{
  width:28px;
  height:28px;
  object-fit:contain;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  border-top:1px solid var(--border);
}

.stat{
  text-align:center;
  padding:12px 6px;

  border-right:1px solid var(--border);
}

.stat:last-child{
  border-right:0;
}

.stat-value{
  font-size:14px;
  font-weight:800;
}

.stat-label{
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

/* =========================
   PROGRESS
========================= */

.progress-wrap{
  margin-bottom:12px;
}

.progress-label{
  display:flex;
  justify-content:space-between;

  font-size:10px;
  margin-bottom:6px;
}

.progress-label span:last-child{
  color:var(--muted);
}

.progress{
  height:7px;
  background:#080b10;
  border-radius:99px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      var(--gold2)
    );
}

/* =========================
   HERO
========================= */

.hero-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.hero-card{
  display:flex;
  align-items:center;
  gap:9px;

  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:12px;
  padding:10px;
}

.hero-img{
  width:43px;
  height:43px;
  object-fit:contain;
  flex-shrink:0;
}

.hero-info{
  min-width:0;
}

.hero-name{
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hero-level{
  font-size:15px;
  font-weight:800;
  margin-top:2px;
}

.hero-max{
  color:var(--green);
  font-size:8px;
  margin-top:2px;
}

.hero-progress{
  height:4px;
  background:#151a21;
  border-radius:99px;
  overflow:hidden;
  margin-top:5px;
}

.hero-progress div{
  height:100%;
  background:var(--blue);
}

/* =========================
   EQUIPMENT
========================= */

.equipment-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.equipment-card{
  background:#0a0e13;
  border:1px solid var(--border);
  border-radius:11px;

  padding:9px;

  display:flex;
  align-items:center;
  gap:8px;
}

.equipment-img{
  width:38px;
  height:38px;
  object-fit:contain;
  flex-shrink:0;
}

.equipment-info{
  min-width:0;
}

.equipment-name{
  font-size:9px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.equipment-hero{
  color:var(--muted);
  font-size:8px;
  margin-top:2px;
}

.equipment-level{
  color:var(--gold2);
  font-size:9px;
  font-weight:800;
  margin-top:3px;
}

/* =========================
   ACCOUNT STATS
========================= */

.data-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.data-card{
  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:10px;
  padding:10px;
}

.data-label{
  color:var(--muted);
  font-size:8px;
}

.data-value{
  font-size:13px;
  font-weight:800;
  margin-top:3px;
}

/* =========================
   UPGRADE
========================= */

.priority{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:10px;
  margin-top:7px;
}

.priority:first-child{
  margin-top:0;
}

.priority-number{
  width:25px;
  height:25px;

  display:grid;
  place-items:center;

  border-radius:7px;

  background:rgba(240,189,85,.1);
  color:var(--gold2);

  font-size:10px;
  font-weight:800;

  flex-shrink:0;
}

.priority-name{
  font-size:10px;
  font-weight:700;
}

.priority-desc{
  color:var(--muted);
  font-size:8px;
  margin-top:2px;
}

/* =========================
   INFO NOTE
========================= */

.note{
  color:var(--muted);
  font-size:9px;
  line-height:1.55;

  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:10px;
  padding:10px;
}

/* =========================
   CLAN HEADER
========================= */

.clan-header{
  position:relative;

  background:
    linear-gradient(
      145deg,
      #171d26,
      #0d1218
    );

  border:1px solid var(--border);
  border-radius:20px;

  padding:17px;

  margin-bottom:13px;
}

.clan-top{
  display:flex;
  align-items:center;
  gap:13px;
}

.clan-logo{
  width:72px;
  height:72px;
  object-fit:contain;
  flex-shrink:0;

  filter:drop-shadow(0 5px 15px rgba(240,189,85,.12));
}

.clan-name{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.7px;
}

.clan-tag{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.clan-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
}

.meta{
  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:8px;
  padding:7px 9px;

  color:var(--muted);
  font-size:8px;
}

.meta strong{
  color:#fff;
}

/* =========================
   CLAN SORT
========================= */

.sort-row{
  display:flex;
  gap:7px;
  margin-bottom:11px;
}

.sort-row select{
  flex:1;

  background:#0a0e13;
  color:#fff;

  border:1px solid var(--border);
  border-radius:9px;

  padding:9px;

  outline:none;
  font-size:9px;
}

.sort-dir{
  width:42px;

  background:#0a0e13;
  color:var(--gold2);

  border:1px solid var(--border);
  border-radius:9px;

  font-weight:800;
}

/* =========================
   MEMBER
========================= */

.member{
  width:100%;

  display:flex;
  align-items:center;
  gap:9px;

  background:#0a0e13;
  border:1px solid var(--border);

  border-radius:10px;

  padding:9px;

  margin-bottom:6px;

  color:#fff;
  text-align:left;
}

.member:hover{
  border-color:rgba(118,88,255,.5);
  background:#0c1118;
}

.member-rank{
  width:23px;
  color:var(--muted);
  font-size:8px;
  text-align:center;
}

.member-logo{
  width:31px;
  height:31px;
  object-fit:contain;
}

.member-info{
  min-width:0;
  flex:1;
}

.member-name{
  font-size:10px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-detail{
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

.member-role{
  color:var(--gold2);
}

.member-th{
  color:var(--purple2);
  font-size:9px;
  font-weight:800;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
  font-size:10px;
}

.spinner{
  width:25px;
  height:25px;

  border:3px solid #242b36;
  border-top-color:var(--gold);

  border-radius:50%;

  margin:0 auto 10px;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  color:#596372;
  font-size:8px;

  line-height:1.8;
  margin-top:25px;
}

.footer a{
  color:var(--gold2);
  text-decoration:none;

  font-weight:700;
}

.footer a:hover{
  text-decoration:underline;
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:5px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:600px){

  .app{
    padding-top:35px;
  }

  .hero-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .equipment-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

</style>
</head>

<header class="header">

  <div class="brand">

  <div

    Contoh: #9UG9LJV8Y

</section>


<!-- =========================

========================= -->

<main

</main>


<!-- =========================

========================= -->

</footer>

</div>

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatNumber(value){

  return Number(value || 0)
    .toLocaleString("en-US");

}


function cleanTag(value){

  let tag =
    String(value || "")
      .trim()
      .toUpperCase();

  if(tag && !tag.startsWith("#")){
    tag = "#" + tag;
  }

  return tag;

}


function heroMax(heroName,townHall){

  const table =
    HERO_MAX[Number(townHall)] || {};

  return Number(
    table[heroName] || 0
  );

}


function equipmentMax(item,townHall){

  const th =
    Number(townHall);

  const caps =
    EQUIPMENT_CAPS[th];

  if(!caps){
    return Number(
      item.maxLevel ||
      item.level ||
      0
    );
  }

  const rarity =
    String(item.rarity || "")
      .toLowerCase();

  if(rarity.includes("epic")){
    return caps.epic;
  }

  return caps.common;

}


function getHeroAsset(name){

  return HERO_ASSETS[name] || "";

}


function getEquipmentAsset(name){

  return EQUIPMENT_ASSETS[name] || "";

}


function imageFallback(){

  this.style.display="none";

}


/* =====================================================
   ROLE
===================================================== */

function normalizeRole(role){

  const value =
    String(role || "")
      .toLowerCase();

  if(
    value.includes("leader") &&
    !value.includes("co")
  ){
    return "Leader";
  }

  if(
    value.includes("co") ||
    value.includes("admin") ||
    value.includes("coleader")
  ){
    return "Co-Leader";
  }

  if(
    value.includes("elder") ||
    value.includes("senior")
  ){
    return "Senior";
  }

  return "Member";

}


/* =====================================================
   API
===================================================== */

async function apiGet(
  endpoint,
  tag
){

  const response =
    await fetch(
      `${API_BASE}/${endpoint}?tag=${encodeURIComponent(cleanTag(tag))}`
    );

  let data;

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "Respons API tidak valid."
    );

  }

  if(!response.ok){

    const detail =
      data?.details?.message ||
      data?.error ||
      `HTTP ${response.status}`;

    throw new Error(detail);

  }

  return data;

}

function renderHeroCard(
  hero,
  townHall
){

  const level =
    Number(hero.level || 0);

  const max =
    heroMax(
      hero.name,
      townHall
    ) ||
    Number(hero.maxLevel || level);

  const percent =
    max
      ? Math.min(
          100,
          Math.round(
            level / max * 100
          )
        )
      : 0;

  const asset =
    getHeroAsset(hero.name);

  return `

    <div class="hero-card">

      ${
        asset
        ?
        `
        <img
          class="hero-img"
          src="${asset}"
          alt=""
          onerror="imageFallback.call(this)"
        >
        `
        :
        ""
      }

      <div class="hero-info">

        <div class="hero-name">
          ${escapeHTML(hero.name)}
        </div>

        <div class="hero-level">
          ${level}/${max}
        </div>

        <div class="hero-max">
          ${percent}% MAX
        </div>

        <div class="hero-progress">
          <div
            style="width:${percent}%"
          ></div>
        </div>

    </div>

}

function renderPlayer(player){

  const townHall =
    Number(
      player.townHallLevel || 0
    );

  const clan =
    player.clan || null;

  const heroes =
    (player.heroes || [])
      .filter(
        hero =>
          hero &&
          hero.name
      );

  /* -------------------------
     HERO PROGRESS
  ------------------------- */

  let heroTotal = 0;
  let heroMaxTotal = 0;

  heroes.forEach(hero => {

    const max =
      heroMax(
        hero.name,
        townHall
      ) ||
      Number(hero.maxLevel || hero.level || 0);

    const level =
      Number(hero.level || 0);

    heroTotal +=
      Math.min(level,max);

    heroMaxTotal += max;

  });

  const heroPercent =
    heroMaxTotal
      ? Math.round(
          heroTotal /
          heroMaxTotal *
          100
        )
      : 0;


  /* -------------------------
     EQUIPMENT
  ------------------------- */

  const equipment = [];

  heroes.forEach(hero => {

    (hero.equipment || [])
      .forEach(item => {

        equipment.push({
          ...item,
          heroName:hero.name
        });

      });

  });

  /*
   * Beberapa API response bisa punya
   * heroEquipment terpisah.
   */

  if(
    Array.isArray(

    player.heroEquipment

let clanSortField = "trophies";

let clanSortDesc = true;


function sortClanMembers(){

  if(!currentClan){
    return;
  }

  renderClan(
    currentClan,
    false
  );

}


/* =====================================================
   CLAN
===================================================== */

function renderClan(
  clan,
  scroll=true
){

  currentClan = clan;

  let members =
    Array.isArray(
      clan.memberList
    )
    ?
    [...clan.memberList]
    :
    [];


  /* -------------------------
     SORT
  ------------------------- */

  members.sort(
    (a,b) => {

      let av;
      let bv;

      switch(clanSortField){

        case "th":
          av =
            Number(
              a.townHallLevel || 0
            );
          bv =
            Number(
              b.townHallLevel || 0
            );
          break;

        case "trophies":
          av =
            Number(
              a.trophies || 0
            );
          bv =
            Number(
              b.trophies || 0
            );
          break;

        case "builder":
          av =
            Number(
              a.builderBaseTrophies || 0
            );
          bv =
            Number(
              b.builderBaseTrophies || 0
            );
          break;

        case "donations":
          av =
            Number(
              a.donations || 0
            );
          bv =
            Number(
              b.donations || 0
            );
          break;

        case "role":
          av =
            normalizeRole(a.role);
          bv =
            normalizeRole(b.role);
          break;

        case "name":
          av =
            String(a.name || "")
              .toLowerCase();
          bv =
            String(b.name || "")
              .toLowerCase();
          break;

        default:
          av = 0;
          bv = 0;

      }

      if(
        typeof av === "string" &&
        typeof bv === "string"
      ){

        return clanSortDesc
          ? bv.localeCompare(av)
          : av.localeCompare(bv);

      }

      return clanSortDesc
        ? bv - av
        : av - bv;

    }
  );


  /* -------------------------
     CLAN LOGO
  ------------------------- */

  const clanLogo =
    clan.badgeUrls?.medium ||
    clan.badgeUrls?.large ||
    clan.badgeUrls?.small ||
    "";


  /* -------------------------
     MEMBER HTML
  ------------------------- */

  const membersHTML =
    members.length
    ?
    members
      .map(
        (member,index) => {

          const role =
            normalizeRole(
              member.role
            );

          return `

            <button
              class="member"
              onclick="loadPlayer('${escapeHTML(member.tag)}')"
            >

              <div class="member-rank">
                ${String(index + 1).padStart(2,"0")}
              </div>

              <div class="member-info">

                <div class="member-name">
                  ${escapeHTML(member.name)}
                </div>

                <div class="member-detail">

                  ${formatNumber(member.trophies)}
                  trophies
                  ·
                  <span class="member-role">
                    ${role}
                  </span>

                  ·
                  ${formatNumber(member.donations || 0)}
                  donations

                </div>

              </div>

              <div class="member-th">
                TH${escapeHTML(member.townHallLevel)}
              </div>

            </button>

          `;

        }
      )
      .join("")
    :
    `
      <div class="empty">
        Member tidak tersedia.
      </div>
    `;


  document
    .getElementById("clanContent")
    .innerHTML = `

      <!-- CLAN HEADER -->

      <div class="clan-header">

        <div class="clan-top">

          ${
            clanLogo
            ?
            `
            <img
              class="clan-logo"
              src="${escapeHTML(clanLogo)}"
              alt="Clan Badge"
            >
            `
            :
            ""
          }

          <div>

            <div class="clan-name">
              ${escapeHTML(clan.name)}
            </div>

            <div class="clan-tag">
              ${escapeHTML(clan.tag)}
            </div>

          </div>

        </div>


        <div class="clan-meta">

          <div class="meta">
            Member
            <strong>
              ${members.length}/${escapeHTML(clan.members)}
            </strong>
          </div>

          <div class="meta">
            Level
            <strong>
              ${escapeHTML(clan.clanLevel)}
            </strong>
          </div>

          <div class="meta">
            Type
            <strong>
              ${escapeHTML(clan.type || "-")}
            </strong>
          </div>

          <div class="meta">
            War League
            <strong>
              ${escapeHTML(
                clan.warLeague?.name || "-"
              )}
            </strong>
          </div>

        </div>

      </div>


      <!-- MEMBERS -->

      <section class="section">

        <div class="section-head">

          <div class="section-title">
            Clan Members
          </div>

          <div class="section-value">
            ${members.length} Members
          </div>

        </div>


        <div class="sort-row">

          <select
            id="clanSort"
            onchange="
              clanSortField=this.value;
              renderClan(currentClan,false);
            "
          >

            <option
              value="trophies"
              ${clanSortField==="trophies"?"selected":""}
            >
              Trophies
            </option>

            <option
              value="th"
              ${clanSortField==="th"?"selected":""}
            >
              Town Hall
            </option>

            <option
              value="builder"
              ${clanSortField==="builder"?"selected":""}
            >
              Builder Trophies
            </option>

            <option
              value="donations"
              ${clanSortField==="donations"?"selected":""}
            >
              Donations
            </option>

            <option
              value="role"
              ${clanSortField==="role"?"selected":""}
            >
              Role
            </option>

            <option
              value="name"
              ${clanSortField==="name"?"selected":""}
            >
              Name
            </option>

          </select>


          <button
            class="sort-dir"
            onclick="
              clanSortDesc=!clanSortDesc;
              renderClan(currentClan,false);
            "
            title="Ubah urutan"
          >
            ${clanSortDesc ? "↓" : "↑"}
          </button>

        </div>


        ${membersHTML}

      </section>

    `;


  if(scroll){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPlayer(scroll=true){

  document
    .getElementById("playerPage")
    .classList.add("active");

  document
    .getElementById("clanPage")
    .classList.remove("active");

  if(scroll){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function openClan(scroll=true){

  document
    .getElementById("playerPage")
    .classList.remove("active");

  document
    .getElementById("clanPage")
    .classList.add("active");

  if(scroll){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        searchData();
      }

    }
  );


/* =====================================================
   DEFAULT PLAYER
===================================================== */

loadPlayer(
  "#9UG9LJV8Y"
);

</script>

</body>
</html>
